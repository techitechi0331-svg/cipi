research_question: Can a small activation-threshold calibration recover soft and repeated
  plosive recall for the frozen Vo.Prep v2.2 contextual detector without giving back
  its measured synthetic false-positive margin?
hypothesis: The highest passing threshold in the predeclared 0.72/0.70 family will
  recover plosive_soft and both repeated events while preserving nominal/strong latency,
  zero-or-near-zero negative occupancy, sample-rate stability and +/-12 dB input-scale
  invariance.
counter_hypotheses:
- Threshold-only calibration cannot recover the second repeated plosive because local-baseline/re-arm
  behavior, not activation threshold, is limiting recall.
- Lowering activation enough to recover soft/repeated events creates false detections
  on long-LF, proximity, fry or growl negatives.
- A passing threshold is not stable across 44.1/48/96 kHz or +/-12 dB input scaling.
acceptance_criteria:
- Select the highest activation threshold that passes every gate.
- Positive detection fraction is >= 0.90.
- Soft, nominal and strong cases are detected at every tested sample rate.
- Both repeated-plosive events are detected at every tested sample rate.
- Worst positive first-onset latency is <= 20 ms.
- Mean negative occupancy is <= 1% and worst negative occupancy is <= 5%.
- Candidate mean negative occupancy is <= 35% of the unchanged LF-only baseline mean.
- Maximum event duration is <= 125 ms.
- Maximum probability spread across 44.1/48/96 kHz is <= 0.06.
- Across -12/0/+12 dB scaling, maximum probability spread is <= 0.05 and occupancy
  spread <= 3 percentage points.
rejection_criteria:
- Neither 0.72 nor 0.70 passes every gate.
- Passing requires adding a new feature, changing release/cap, or relaxing a predeclared
  gate.
- Raw audio is persisted or product DSP is mutated.
