research_question: Can deployable single-view local spectro-temporal patch/context
  features recover a material fraction of the R7 causal-oracle ranking gap without
  increasing independent clean-vocal false triggers?
hypothesis: Across both predeclared seeds, local multi-scale curvature/shoulder/coherence
  features will improve conditional Top-5 by at least 0.08 over the frozen static
  ranker, close at least 15 percent of the R7 oracle gap, preserve strong-effect conditional
  Top-5 within 0.05, and not worsen external clean false-trigger by more than 0.05.
counter_hypotheses:
- The causal information exposed by R7 is not recoverable from local single-view patch
  shape, so conditional ranking will remain near the static baseline.
- Patch features improve one seed only, indicating unstable geometry rather than reusable
  information.
- Patch features learn natural narrow harmonic/formant structure and increase clean-vocal
  false triggers.
acceptance_criteria:
- 'for each seed: conditional Top-5 >= static + 0.08'
- 'for each seed: R7 oracle gap closure >= 0.15'
- 'for each seed: strong-effect conditional Top-5 >= static - 0.05'
- 'for each seed: external clean false-trigger <= static + 0.05'
- 'for each seed: generator ceiling >= 0.80'
rejection_criteria:
- any seed conditional Top-5 improvement < 0.08
- any seed oracle gap closure < 0.15
- any seed strong-effect conditional Top-5 regresses by more than 0.05
- any seed external clean false-trigger worsens by more than 0.05
