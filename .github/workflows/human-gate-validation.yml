name: Human Gate Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "automation/human_gate/**"
      - "automation/continuity/**"
      - "automation/schemas/human_gate_decision.schema.json"
      - "research/human_gates/**"
      - "tests/test_human_gate.py"
      - "tests/test_discord_bot.py"
      - ".github/workflows/human-gate-*.yml"
      - "integrations/discord/**"
  push:
    branches: [ main ]
    paths:
      - "automation/human_gate/**"
      - "automation/continuity/**"
      - "automation/schemas/human_gate_decision.schema.json"
      - "research/human_gates/**"
      - "tests/test_human_gate.py"
      - "tests/test_discord_bot.py"
      - ".github/workflows/human-gate-*.yml"
      - "integrations/discord/**"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install PyYAML==6.0.2 -r integrations/discord/requirements.txt
      - name: Discord catalog, sync and safety regression
        run: python -m unittest tests.test_discord_bot -v
      - name: Human Gate tests
        run: python -m unittest tests.test_human_gate -v
      - name: Discord bot syntax
        run: python -m py_compile integrations/discord/bot.py
      - name: Human Gate record validation
        run: python automation/human_gate/apply.py --validate-all
      - name: Continuity regression
        run: python -m unittest discover -s tests -p "test_continuity_layer.py" -v
