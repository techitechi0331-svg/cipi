research_question: >-
  Can architecture-level guitar mechanisms—two-polarization propagation, physically motivated
  pluck interaction, bridge scattering/sympathetic coupling, and nonlinear string-fret/contact
  dynamic detuning—produce a materially stronger implementation candidate than Realism v1.1?

hypothesis_id: HYP-VIRTUAL-GUITAR-PHYSICAL-REALISM-V04
hypothesis: >-
  A bounded three-phase architecture search can identify a stronger physical-string model class
  than the rejected v1.1 candidate while retaining realtime feasibility. Synthetic research may
  identify mechanisms and architecture candidates, but human listening and real-audio A/B remain mandatory.

