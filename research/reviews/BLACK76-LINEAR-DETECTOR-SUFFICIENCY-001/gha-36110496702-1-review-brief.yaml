research_question: Is a plain full-wave linear detector plus one optimized gain and
  bias per ratio sufficient to reproduce Black76's committed supplemental LN-era onset
  and low/mid/deep static-ratio curvature?
hypothesis: The linear full-wave detector is sufficient when detector gain and total
  bias are optimized separately for 4, 8, 12 and 20 modes.
counter_hypotheses:
- The linear detector can match onset and selected mid-GR slopes but cannot simultaneously
  reproduce low-GR knee and deep-GR growth, so nonlinear detector or loop curvature
  is required.
acceptance_criteria:
- Onset MAE is <= 1.0 dB.
- Ratio log-RMSE is <= 0.20 across all modes and GR regions.
- Maximum relative ratio error is <= 0.35.
- Minimum deep-GR ratio fraction is >= 0.80 of target.
rejection_criteria:
- Onset can be matched but complete static-ratio curvature remains outside one or
  more predeclared gates.
- Deep-GR ratio remains below 80 percent of target in any single-button mode.
