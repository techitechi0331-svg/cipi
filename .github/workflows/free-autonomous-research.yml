name: Free Autonomous Research Worker

on:
  push:
    branches: [ main ]
    paths:
      - "research/jobs/queued/**"
      - "automation/queue/**"
      - "automation/worker/**"
      - "automation/adapter_registry.yaml"
      - ".github/workflows/free-autonomous-research.yml"
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cipi-free-autonomous-research
  cancel-in-progress: false

jobs:
  run-one-research-job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Select one queued job
        id: select
        run: python automation/queue/select_job.py --github-output "$GITHUB_OUTPUT"

      - name: Install pinned Vocal Resonance scientific stack
        if: steps.select.outputs.has_job == 'true' && startsWith(steps.select.outputs.job_id, 'VOCAL-RESONANCE')
        run: python -m pip install -r automation/worker/requirements-scientific.txt

      - name: Validate jobs before execution
        if: steps.select.outputs.has_job == 'true'
        run: python tools/validate_research_job.py

      - name: Run allowlisted research job
        if: steps.select.outputs.has_job == 'true'
        id: execute
        env:
          JOB_ID: ${{ steps.select.outputs.job_id }}
          JOB_PATH: ${{ steps.select.outputs.job_path }}
        run: |
          RUN_ID="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          python automation/worker/runner.py "$JOB_PATH" --output "research/runs/$JOB_ID/$RUN_ID" --run-id "$RUN_ID"

      - name: Generate bounded research follow-up artifacts
        if: steps.select.outputs.has_job == 'true'
        env:
          JOB_PATH: ${{ steps.select.outputs.job_path }}
          JOB_ID: ${{ steps.select.outputs.job_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: python automation/queue/postprocess.py --job "$JOB_PATH" --run-dir "research/runs/$JOB_ID/$RUN_ID"

      - name: Finalize queue state on evidence branch
        if: steps.select.outputs.has_job == 'true'
        env:
          JOB_PATH: ${{ steps.select.outputs.job_path }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: python automation/queue/finalize_job.py --job "$JOB_PATH" --run-id "$RUN_ID" --result COMPLETED

      - name: Generate deterministic review triage
        if: steps.select.outputs.has_job == 'true'
        id: triage
        env:
          JOB_ID: ${{ steps.select.outputs.job_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: python automation/review/triage.py --job-id "$JOB_ID" --run-id "$RUN_ID" --github-output "$GITHUB_OUTPUT"

      - name: Validate result safety and CIPI contract
        if: steps.select.outputs.has_job == 'true'
        run: |
          python tools/validate_research_result.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python tools/validate_review_triage.py
          python tools/validate_research_job.py
          python tools/validate_research.py

      - name: Write trusted local gate report
        if: steps.select.outputs.has_job == 'true'
        env:
          JOB_ID: ${{ steps.select.outputs.job_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
          BOT_BRANCH: ${{ steps.select.outputs.branch }}
        run: python automation/queue/write_gate_report.py --job-id "$JOB_ID" --run-id "$RUN_ID" --branch "$BOT_BRANCH"

      - name: Commit evidence to research-bot branch
        if: steps.select.outputs.has_job == 'true'
        env:
          BOT_BRANCH: ${{ steps.select.outputs.branch }}
          JOB_ID: ${{ steps.select.outputs.job_id }}
        run: |
          git config user.name "cipi-research-bot"
          git config user.email "cipi-research-bot@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git add -A research/jobs research/runs research/reports
          if [ -d research/knowledge_candidates ]; then git add -A research/knowledge_candidates; fi
          if [ -d research/decisions ]; then git add -A research/decisions; fi
          if [ -d research/reviews ]; then git add -A research/reviews; fi
          git commit -m "submit autonomous research evidence: $JOB_ID"
          git push --set-upstream origin "$BOT_BRANCH"

      - name: Open evidence pull request
        id: open_pr
        continue-on-error: true
        if: steps.select.outputs.has_job == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.select.outputs.branch }}
          JOB_ID: ${{ steps.select.outputs.job_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: |
          gh pr create --base main --head "$BOT_BRANCH" --title "Autonomous research evidence: $JOB_ID" --body "Free CIPI autonomous research run **$RUN_ID**. Deterministic review triage: **${{ steps.triage.outputs.candidate_class }} → ${{ steps.triage.outputs.route }}**. The same trusted workflow executed the allowlisted experiment, result safety validation, decision/triage validation, and the existing CIPI research contract before pushing this branch. No paid external API was used. Knowledge promotion is not automatic."

      - name: Create review issue when Actions PR creation is disabled
        if: steps.select.outputs.has_job == 'true' && steps.open_pr.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.select.outputs.branch }}
          JOB_ID: ${{ steps.select.outputs.job_id }}
          RUN_ID: ${{ steps.execute.outputs.run_id }}
        run: |
          gh issue create --title "Autonomous research ready: $JOB_ID" --body "Free autonomous research run **$RUN_ID** completed successfully and is saved on branch $BOT_BRANCH. Deterministic review triage: **${{ steps.triage.outputs.candidate_class }} → ${{ steps.triage.outputs.route }}**. Automatic PR creation is disabled by the repository Actions setting, so this issue is the review handoff. The branch already passed the same-workflow Job, Result, Evidence Candidate, Decision Record, Review Triage, and CIPI research-contract gates. No paid external API was used."

      - name: Queue empty
        if: steps.select.outputs.has_job != 'true'
        run: echo "No unclaimed queued research job. Nothing to do."
