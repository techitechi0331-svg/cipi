claim: A low-order detector-only high-pass can reduce low-frequency false compressor
  drive while preserving useful vocal-body and short-event behavior in the frozen
  Vo.Prep compressor.
evidence_type: HYPOTHESIS
scope: Deterministic synthetic stress matrix only; OFF versus 40/60/70/80/100 Hz second-order
