provisional_root_causes:
  - "Research prototype grew in layers without collapsing semantic string state and acoustic string state into one authority."
  - "MELON architecture research currently models properties of architecture labels instead of executing candidate architecture implementations."
  - "Functional/regression success is much stronger than realism-validation coverage."
  - "Reference planning is ahead of reference adapter implementation and layer-specific identifiability design."

provisional_critical_path:
  - priority: 1
    item: "Repair the research method before using Realism-004 rankings for mechanism or architecture selection."
  - priority: 2
    item: "Define one authoritative continuous PhysicalStringState / PhysicalGuitarModel boundary."
  - priority: 3
    item: "Design executable candidate solvers or mechanism ablations whose outputs can actually be measured."
  - priority: 4
    item: "Split raw-physics mechanism validation from end-to-end DI/reference validation."
  - priority: 5
    item: "Only after evidence quality is repaired, run bounded architecture/mechanism research."
  - priority: 6
    item: "Product implementation remains blocked by product_repository_write=false."

provisional_track_recommendation:
  status: PROPOSAL_ONLY
  recommendation: >-
    Do not use the current Realism-004 MELON adapter to eliminate architectures or declare a
    winner. It may remain as an orchestration/proxy canary, but scientific mechanism survival
    should require executable physical/audio candidate evidence, ablation, and later real-reference
    and Human Gates.

