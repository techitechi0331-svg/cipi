schema_version: "1.0"
registry_id: VG-PICKUP-EXTERNAL-EVIDENCE-CORPUS-20260929
project: virtual-guitar
status: AUDITED_SOURCE_MATRIX_NOT_MODEL_FIT
recorded_at: "2026-09-29"
authority: CIPI_EVIDENCE_REGISTRY
automatic_measured_promotion: false
