rationale: >-
  The bounded R2 result supports advancing activation threshold 0.60 to
  real-vocal validation, but not product adoption. The frozen 0.65 baseline and
  0.62 candidate both missed SH/CH at lower sample rates in the declared
  synthetic matrix. Threshold 0.60 was the highest candidate that detected all
  S/SH/CH/T positives at every tested sample rate while retaining zero measured
  occupancy on the declared bright-vowel, air, breath, falsetto, upper-register
  and distorted-vocal negatives. Event duration, sample-rate spread and input
  scale gates also passed. Threshold 0.58 passed as well but is intentionally
  not selected because the higher passing threshold is the lower-risk candidate.
  Real sung-vocal evidence is still required before changing product DSP.
scope: >-
  Assistant review of the deterministic Vo.Prep Sibilance Guard v2.3
  threshold-only R2 calibration. ITERATE authorizes a 0.65-vs-0.60 real-vocal
  comparison only. It does not change Vo.Prep product DSP, parameter defaults
  or release status.
declared_rejection_criteria:
  - "No bounded candidate passes all predeclared R2 recall, negative-occupancy, duration, sample-rate and input-scale gates."
  - "Passing requires a feature-family change, release/cap change, relaxed gate, raw-audio persistence or product mutation."
triggered_criteria: []
retained_findings:
  - "0.60 positive detection fraction was 1.0 and all S/SH/CH/T cases were detected at every tested sample rate."
  - "0.60 mean and maximum declared negative occupancy were both 0 percent."
  - "0.60 worst positive first-onset latency was about 10.9297 ms."
  - "0.60 maximum event duration was about 107.083 ms."
  - "0.60 maximum probability spread across 44.1/48/96 kHz was about 0.0565979."
  - "0.60 maximum +/-12 dB input-scale probability spread was about 0.00003331 with 0 percentage-point occupancy spread."
  - "0.62 failed the all-positive and S/SH cross-sample-rate gates."
  - "0.58 also passed, but was not selected under the predeclared highest-passing-threshold rule."
reusable_findings:
  - "Decision consistency across sample rates must be checked directly even when probability-spread metrics pass."
  - "When a simple baseline has zero false occupancy, absolute negative-occupancy gates avoid an undefined 0/0 ratio."
  - "Synthetic threshold success must advance to real-vocal relevance/false-trigger screening before product adoption."
revisit_if:
  - "Real-vocal evidence shows candidate-only 0.60 activations are not concentrated on sibilant/affricate/high-frequency-transient material."
  - "Real-vocal false-trigger occupancy materially increases on bright vowels, air, breath, falsetto, upper-register or distorted singing."
  - "A source-code or C++ replay disagrees with the Python detector translation."
