research_question: Does the current Vo.Prep 50% Plosive/Macro/Sibilance chain reduce
  targeted downstream VoPriPro Natural50 reactions when the event cases are the source
  product's own verified Plosive and Sibilance regression positive controls?
hypothesis: Source-derived positive controls will first reproduce intended Vo.Prep
  detector engagement, after which targeted preprocessing will reduce downstream VoPriPro
  event peak GR without materially shifting neutral, post-event, phrase-level, or
  sample-rate behavior.
counter_hypotheses:
- The source-code translation fails to reproduce the source product positive-control
  detector engagement, invalidating downstream interpretation.
- Plosive Guard engages but does not reduce downstream VoPriPro plosive-event peak
  GR by the locked minimum.
- Sibilance Guard engages but still does not reduce downstream VoPriPro sibilance-event
  peak GR by the unchanged locked minimum.
- Vo.Prep introduces material neutral false engagement or post-event downstream GR
  offsets.
- Macro Level over-flattens or under-corrects the phrase-step case.
- Cross-product behavior becomes materially sample-rate dependent when 88.2 kHz is
  added.
acceptance_criteria:
- All generated preprocessed samples and downstream gain-reduction trajectories are
  finite.
- Neutral sustained material changes downstream mean GR by no more than 0.25 dB.
- Neutral sustained material causes no more than 0.25 dB Plosive/Sibilance event reduction.
- Source-derived Plosive positive control reaches probability at least 0.80 at every
  tested sample rate.
- Source-derived Plosive positive control produces at least 0.50 dB Plosive Guard
  reduction at every tested sample rate.
- Vo.Prep improves downstream VoPriPro plosive-event peak GR by at least 0.10 dB.
- Post-plosive downstream mean-GR shift is no more than 0.35 dB.
- Source-derived Sibilance positive control reaches probability at least 0.65 at every
  tested sample rate.
- Source-derived Sibilance positive control produces at least 0.30 dB Sibilance Guard
  reduction at every tested sample rate.
- Vo.Prep improves downstream VoPriPro sibilance-event peak GR by at least 0.02 dB.
- Post-sibilance downstream mean-GR shift is no more than 0.35 dB.
- Macro Level moves the phrase-step case by at least 0.10 dB.
- Phrase RMS spread improves by at least 0.05 dB and no more than 1.50 dB.
- Preprocessed downstream peak-GR sample-rate spread across 44.1/48/88.2/96 kHz is
  no more than 0.15 dB.
rejection_criteria:
- Any positive-control probability or reduction gate fails, making downstream event
  interpretation invalid.
- Any unchanged downstream interaction, neutral, recovery, phrase, finite, or sample-rate
  gate fails.
