schema_version: "1.0"
track_id: MIC-SIM-EXTERNAL-REFERENCE-SM57-001
enabled: false
activation_state: STAGED_SOURCE_RIGHTS_AUDIT
root_research_id: MIC-SIM-EXTERNAL-REFERENCE-SM57-001

research_question: >-
  Which external SM57 references can provide trustworthy, legally usable,
  dimension-specific evidence or perceptual validation without contaminating
  the strict controlled-measurement track?

hypothesis_id: HYP-MIC-SM57-EXTERNAL-CORPUS-001
hypothesis: >-
  A tiered corpus separating controlled raw measurement, controlled-but-confounded
  comparisons, standardized listening references, web/YouTube candidates and licensed
  real-world recordings will increase usable research coverage while preventing
  false MEASURED promotion and hardware-parity claims.

minimum_novelty: 0.10
minimum_improvement: 0.01
product_integration: false
human_gate_required: false

authority_boundaries:
  automatic_final_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
  automatic_measured_promotion: false
  automatic_product_integration: false
  automatic_release: false
  cipi_evidence_authority: true

depends_on_tracks:
  - MIC-SIM-REFERENCE-SM57-001

source_registry:
  path: research/plugins/mic-simulator/sm57-external-reference-corpus-2026-09-29.yaml

activation_requirements:
  - SOURCE_RIGHTS_AUDIT_COMPLETE
  - ORIGINAL_DATA_PROVENANCE_CAPTURED
  - NO_ARBITRARY_YOUTUBE_DOWNLOAD_CORPUS
  - STRICT_MEASURED_TRACK_REMAINS_SEPARATE

budget:
  max_loop_depth: 3
  max_runs: 3
  max_total_experiments: 3
  max_candidates: 24
  max_runtime: 300
  max_same_hypothesis_retry: 2
  max_same_architecture_retry: 2
  max_no_improvement_runs: 2

