research_question: What minimum physical/electrical Pickup/DI architecture can explain
  the baseline string/fret identity and pickup-stage gaps while preserving explicit
  uncertainty?
hypothesis: Separating string-state observation, magnetic pickup behavior, passive
  R/L/C network, controls, cable load, output impedance and guitar jack will provide
  a falsifiable PICKUP_DI candidate without disguising RAW-string model error.
counter_hypotheses:
- A static EQ-only pickup model is sufficient.
- String/fret identity can be discarded once MIDI pitch is known.
- Amp/Cab/Mic coloration is required to make pickup behavior plausible.
