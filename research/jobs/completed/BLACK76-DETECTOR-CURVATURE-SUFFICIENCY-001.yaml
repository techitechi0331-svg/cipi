schema_version: '1.0'
job_id: BLACK76-DETECTOR-CURVATURE-SUFFICIENCY-001
state: COMPLETED
track:
  id: 1176_FAMILY_FORMAL
  path: research/reference_devices/1176
research_question: Is one shared superlinear detector power exponent plus per-ratio
  detector gain and bias sufficient to reproduce the committed supplemental LN-era
  onset and low/mid/deep static-ratio curvature materially better than the gamma=1
  diagnostic baseline?
hypothesis: A shared superlinear detector curvature is the dominant missing mechanism
  and will pass all predeclared static-curve gates after per-ratio gain and bias retuning.
counter_hypotheses:
- A shared scalar curvature improves some regions but cannot fit low-, mid-, and deep-GR
  behavior across all ratios simultaneously.
- Ratio-dependent source/loading, diode-bias operating point, or control-loop behavior
  is required beyond one shared exponent.
baseline:
- gamma_1_linear_full_wave
variants:
- best_shared_gamma_gt_1
metrics:
- checksum_ok
- baseline_ratio_log_rmse
- candidate_ratio_log_rmse
- ratio_log_rmse_improvement_percent
- candidate_onset_mae_db
- candidate_max_relative_ratio_error
- candidate_deep_ratio_fraction_min
acceptance:
- Committed detector-curvature evidence checksums pass.
- Candidate onset MAE is <= 1.0 dB.
- Candidate ratio log-RMSE is <= 0.20.
- Candidate ratio log-RMSE improves by at least 30 percent versus gamma=1.
- Candidate maximum relative ratio error is <= 0.35.
- Candidate minimum deep-GR ratio fraction is >= 0.80 of target.
rejection:
- A shared-gamma candidate improves selected regions but any predeclared ratio-curvature
  gate still fails.
- Minimum deep-GR ratio fraction remains below 0.80 or maximum relative ratio error
  remains above 0.35.
max_runs: 1
timeout_minutes: 5
random_seed: 7602504
experiment_adapter: black76_detector_curvature_compare_v1
allowed_operations:
- read_committed_derived_metrics
- verify_committed_sha256
- deterministic_numeric_comparison
prohibited_operations:
- arbitrary_shell
- network_access
- network_write
- main_push
- raw_audio_read
- confidence_change
- current_stage_change
knowledge_candidate:
  claim: A single shared power-law detector curvature plus per-ratio gain and bias
    is insufficient to reproduce the committed supplemental LN-era low/mid/deep static-ratio
    curvature in the tested Black76 architecture.
  evidence_type: MEASURED
  scope: Black76 Rev E Priority-2 research-only shared-power detector ablation against
    the committed supplemental LN-era proxy curves; not direct vintage Rev-E hardware
    truth.
  promotion_requested: PROVISIONAL
continuation:
  on_accept: []
  on_reject: []
review_policy:
  required_human_gates:
  - Final interpretation must retain the distinction between supplemental LN-era proxy
    targets and exact vintage Rev-E hardware truth.
  - A diagnostic power-law transfer must not be promoted directly into Production
    without a physically justified circuit/loop interpretation.
