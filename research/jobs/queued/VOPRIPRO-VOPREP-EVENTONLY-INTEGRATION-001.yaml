schema_version: '1.0'
job_id: VOPRIPRO-VOPREP-EVENTONLY-INTEGRATION-001
state: QUEUED
priority: 93
depends_on_jobs:
  - VOPRIPRO-VOPREP-PLOSIVE-DECOMP-001
track:
  id: VOPRIPRO_FORMAL
  path: research/plugins/vopripro
research_question: Is Vo.Prep event-only processing (Plosive 50% + Sibilance 50%, Macro Level OFF) compatible with VoPriPro Natural50 across source-derived positive controls, neutral material, phrase steps, and sample rates without material double-processing?
hypothesis: Event-only Vo.Prep will perform localized Plosive/Sibilance cleanup, remain near-neutral on neutral/phrase material, preserve VoPriPro recovery, and avoid the Macro-driven post-event residual observed in integration v2.
counter_hypotheses:
  - Event-only processing still creates material post-event VoPriPro GR shifts.
  - Plosive cleanup materially changes downstream VoPriPro peak GR despite the 80 Hz sidechain HPF.
  - Sibilance processing no longer reduces downstream VoPriPro event GR when Macro is disabled.
  - Event modules false-trigger on neutral or phrase-step material.
  - Event-only compatibility is materially sample-rate dependent.
baseline:
  - dry_into_vopripro_natural50
variants:
  - voprep_plosive50_sibilance50_macro0_into_vopripro_natural50
metrics:
  - all_finite
  - macro_disabled_max_abs_gain_db
  - neutral_max_abs_mean_gr_delta_db
  - neutral_max_event_reduction_db
  - plosive_min_probability
  - plosive_min_reduction_db
  - plosive_min_event_audio_rms_attenuation_db
  - plosive_max_abs_event_vopripro_peak_gr_change_db
  - plosive_max_abs_post_event_mean_gr_delta_db
  - sibilance_min_probability
  - sibilance_min_reduction_db
  - sibilance_min_event_audio_rms_attenuation_db
  - sibilance_min_event_vopripro_peak_gr_improvement_db
  - sibilance_max_abs_post_event_mean_gr_delta_db
  - phrase_max_event_reduction_db
  - phrase_max_abs_spread_delta_db
  - downstream_peak_gr_sr_spread_db
acceptance:
  - All generated samples and downstream gain-reduction trajectories are finite.
  - Macro Level remains effectively unity with Amount 0%.
  - Neutral mean VoPriPro GR shift is no more than 0.10 dB.
  - Neutral false Plosive/Sibilance reduction is no more than 0.10 dB.
  - Plosive positive-control probability reaches at least 0.80 at every tested sample rate.
  - Plosive reduction reaches at least 0.50 dB at every tested sample rate.
  - Plosive event RMS attenuation is at least 0.25 dB at every tested sample rate.
  - Plosive absolute downstream VoPriPro event peak-GR change is no more than 0.10 dB.
  - Plosive absolute post-event VoPriPro mean-GR shift is no more than 0.15 dB.
  - Sibilance positive-control probability reaches at least 0.65 at every tested sample rate.
  - Sibilance reduction reaches at least 0.30 dB at every tested sample rate.
  - Sibilance event RMS attenuation is at least 0.10 dB at every tested sample rate.
  - Sibilance preprocessing improves downstream VoPriPro event peak GR by at least 0.02 dB.
  - Sibilance absolute post-event VoPriPro mean-GR shift is no more than 0.15 dB.
  - Phrase-step material causes no more than 0.10 dB false event reduction.
  - Event-only preprocessing changes phrase RMS spread by no more than 0.10 dB.
  - Preprocessed downstream peak-GR sample-rate spread across 44.1/48/88.2/96 kHz is no more than 0.15 dB.
rejection:
  - Any event-localization, neutrality, recovery, finite-state, phrase, or sample-rate gate fails.
max_runs: 1
timeout_minutes: 8
random_seed: 20260926
