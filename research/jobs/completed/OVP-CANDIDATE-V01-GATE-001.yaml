state: COMPLETED
track:
  id: UA610_ORIGINAL_VOCAL_PRE
  path: research/plugins/ua610
research_question: Does the measured Original Vocal Pre v0.1 full candidate meet its
  fixed product gates and justify its nonlinear complexity versus the simpler output-transformer-off
  baseline?
hypothesis: The full v0.1 candidate passes every declared candidate gate, keeps Character
  50 low-frequency THD bounded relative to 1 kHz, and does not impose more than a
  2x LF-THD penalty versus the simpler output-transformer-off baseline.
counter_hypotheses:
- The full candidate fails one or more predeclared gates and requires revision before
  parameter lock.
- The current output-transformer block adds disproportionate low-frequency distortion,
  so the simpler baseline is currently preferable for the stated vocal goal.
baseline:
- output_transformer_off
variants:
- full_current_v01
metrics:
- declared_gate_fail_count
- char50_100hz_thd_percent
- char50_1khz_thd_percent
- char50_lf_to_mid_ratio
- no_output_transformer_100hz_thd_percent
- full_vs_no_output_transformer_lf_ratio
- spectral_protection_off_100hz_thd_percent
- char100_1khz_thd_percent
- char100_stress_thd_percent
- char100_8x_alias_dbc
- char100_16x_alias_dbc
- char50_sample_rate_gain_spread_db
acceptance:
- Committed measurement SHA256 verification passes.
- declared_gate_fail_count == 0
- 0.15 <= Character 50 / 1 kHz / -18 dBFS THD <= 1.0 percent
- Character 50 100 Hz THD / 1 kHz THD <= 2.0
- Full 100 Hz THD / output-transformer-off 100 Hz THD <= 2.0
- Character 100 8x alias <= -70 dBc
- Character 50 sample-rate gain spread <= 0.10 dB
rejection:
- Any committed measurement checksum fails.
- Any predeclared candidate gate fails.
- Character 50 LF/mid THD ratio > 2.0.
- Full candidate has >2x the 100 Hz THD of the output-transformer-off baseline.
- Character 100 8x alias > -70 dBc.
