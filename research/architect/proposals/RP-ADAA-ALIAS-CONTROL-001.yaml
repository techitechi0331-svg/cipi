track:
  id: ARCHITECT_ADAA_ALIAS_CONTROL
  path: research/architect
research_question: When does ADAA reduce alias energy enough to justify its complexity
  versus oversampling for CIPI nonlinear stages?
hypothesis: For compatible memoryless nonlinearities, ADAA can reduce alias energy
  at lower oversampling cost than a naive 1x baseline.
counter_hypotheses:
- Oversampling alone is simpler and equally effective at the target CPU budget.
- Stateful nonlinear stages reduce the practical value of ADAA.
baseline:
- naive_1x_waveshaper
- oversampled_waveshaper
variants:
- adaa_candidate
metrics:
- alias_energy_dbc
- cpu_relative
- band_error
acceptance:
- ADAA materially reduces alias energy at a declared CPU/error budget.
rejection:
- ADAA provides no practical advantage over the matched oversampling baseline.
