  - Preserve detector probabilities, module reduction magnitudes, and downstream VoPriPro
    GR deltas.
  - Preserve the distinction between translation fidelity failure and actual chain
    interaction failure.
  reusable_findings:
  - Cross-product event interaction tests must verify source-module engagement before
    attributing downstream effects.
  - Near-misses against predeclared downstream gates remain negative evidence and
    do not justify post-hoc threshold relaxation.
