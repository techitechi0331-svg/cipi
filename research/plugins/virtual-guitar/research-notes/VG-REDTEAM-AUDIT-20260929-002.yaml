adversarial_self_refutation:
  hypothesis_attacked: "Physical Core is the dominant bottleneck."
  alternative_1: "Performance intelligence is actually the dominant perceptual problem."
  assessment: >-
    Plausible for phrase realism, but the user Human Gate rejected isolated/sounding realism and
    the current R3 lacks causal contact/string/body mechanisms even before phrase intelligence.
    Therefore Performance should proceed in parallel, but it is not sufficient to remove the
    Physical Core blocker.
  alternative_2: "Current R3 could become adequate through parameter tuning and better pickup modeling."
  assessment: >-
    Not ruled out for some mixed-context use cases, but current architecture cannot express several
    target behaviors at all and pickup would risk compensating for missing raw physics. Parameter
    tuning remains useful only as a baseline/control.
  alternative_3: "The proposed advanced physics may add complexity without audible benefit."
  assessment: >-
    Valid risk. This is why the recommendation is not to implement everything, but to run executable
    mechanism ablations and reject mechanisms that do not improve reference/perceptual evidence.
  alternative_4: "DI datasets can directly select the raw-string solver."
  assessment: >-
    Not cleanly. DI includes pickup/electronics observation. DI is strong end-to-end evidence but
    raw mechanism identification requires mechanistic/state tests and carefully controlled modeling
    of the observation layer.
  result: >-
    The main conclusions survive self-refutation: repair experiment validity, unify physical state,
    test mechanisms by executable ablation, and keep performance/reference work parallel.

answers_to_required_questions:
  Q1_current_method: "Hybrid research prototype with separate semantic performance state, legacy delay-loop audio, and a separate 24-mode R3 candidate; not yet one integrated physical guitar."
  Q2_physical_vs_approximation: "Physical inspiration exists, but current R3 bridge/body/pick behavior is mostly perceptual/parametric approximation rather than a coupled mechanical system."
  Q3_largest_gap: "Lack of one continuous causal Physical Core linking player contact, string, fret, boundaries and six-string coupling."
  Q4_parameter_or_architecture: "Architecture change is required; parameter tuning alone cannot create missing state variables/interactions."
  Q5_guitarist_or_MIDI_humanization: "Currently a deterministic heuristic performance planner with useful state, not yet a production-depth guitarist model."
  Q6_shared_continuous_state: "NO."
  Q7_bridge_body_physical_boundary: "NO; currently simplified gain/coloration proxies."
  Q8_six_string_interaction: "NO; outputs are independent before summation/average."
