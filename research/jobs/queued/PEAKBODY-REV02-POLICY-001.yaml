schema_version: "1.0"
job_id: PEAKBODY-REV02-POLICY-001
state: QUEUED
track:
  id: PEAKBODY_01
  path: research/experiments/PeakBody
research_question: "Does PeakBody Revision 02 preserve short vocal-transient-scale bursts while reaching sustained-body compression quickly and remaining numerically stable across common and high sample rates?"
hypothesis: "The 80 ms crest detector with split-direction 6-40 ms attack and 120-400 ms release will stay within 0.15 dB of the fixed 40/400 ms baseline on 10-30 ms bursts, reach at least 88 percent of final sustained gain reduction by 150 ms, and remain stable across 44.1/48/96/192 kHz."
counter_hypotheses:
  - "Revision 02 still over-compresses short bursts relative to the simple fixed-timing baseline."
  - "The 80 ms detector preserves transients but delays sustained-body convergence beyond the declared target."
  - "Revision 02 behavior changes materially with sample rate."
  - "The crest feature loses gain-scaling invariance or produces non-finite values."
baseline:
  - fixed_40ms_attack_400ms_release
variants:
  - peakbody_revision02_80ms_split_direction
metrics:
  - short_burst_extra_gr_max_db
  - short_burst_extra_gr_min_db
  - settled_fraction_150ms_min
  - burst30_candidate_sr_spread_db
  - steady_gr_sr_spread_db
  - crest_gain_invariance_abs_diff_max
  - all_numeric_finite
  - python_model_realtime_factor_min
acceptance:
  - "all numeric outputs are finite"
  - "the full 10/20/30/50/100 ms burst matrix is present at 44.1/48/96/192 kHz"
  - "maximum candidate extra gain reduction for 10-30 ms bursts is no more than 0.15 dB versus fixed 40/400 ms"
  - "minimum 150 ms sustained-body settled fraction across sample rates is at least 0.88"
  - "30 ms candidate burst max-GR sample-rate spread is no more than 0.05 dB"
  - "steady sustained gain-reduction sample-rate spread is no more than 0.05 dB"
  - "maximum gain-scaled steady-sine crest difference is no more than 0.02"
rejection:
  - "any acceptance invariant fails"
  - "any required sample-rate or burst case is missing"
max_runs: 1
timeout_minutes: 5
random_seed: 20260925
experiment_adapter: peakbody_revision02_policy_v1
allowed_operations:
  - read_repo_measurement_script
  - execute_allowlisted_adapter
  - write_derived_measurements
prohibited_operations:
  - arbitrary_shell
  - network_write
  - raw_audio_commit
  - main_push
  - confidence_change
  - stage_change
  - knowledge_promotion
  - product_release
knowledge_candidate:
  claim: "For the tested PeakBody model, separating adaptive attack and release direction by crest can preserve 10-30 ms transients near a fixed 40 ms attack while still tightening sustained body within a 150 ms convergence target."
  evidence_type: MEASURED
  scope: "PeakBody Revision 02 deterministic model across 44.1/48/96/192 kHz synthetic burst and sustain tests."
  promotion_requested: PROVISIONAL
lineage:
  related_jobs:
    - PEAKBODY-LEGACY-STRESS-001
    - PEAKBODY-LEGACY-REPLICATION-002
