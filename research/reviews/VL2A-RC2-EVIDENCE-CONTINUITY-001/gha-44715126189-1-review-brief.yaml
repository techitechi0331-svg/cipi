research_question: Does current CIPI main distinguish the accepted VL2A v0.6 RC2 pre-host
  evidence from older Phase01-H formal status, while retaining the unresolved Cubase,
  subjective listening, adoption and release gates?
hypothesis: Independent CIPI evidence records retain the already-tested 6-sample prepared-VST3
  latency, strict pluginval and HA100X pre-host candidate, but the older formal status
  still requires scope-labelled reconciliation, not a new DSP optimization or product
  release.
counter_hypotheses:
- The pre-host snapshot lacks a traceable candidate or claims verified Cubase outcomes
  without evidence.
- The retained baseline omits latency/pluginval measurements or the track's authority
  restrictions.
- The formal Phase01-H status already claims final review while external human gates
  are still unverified.
acceptance_criteria:
- Every required provenance and track record is present.
- The frozen baseline records strict pluginval and prepared VST3 latency without inventing
  a Cubase result.
- Product write and automatic knowledge/release decision remain prohibited.
- The status audit reports scope divergence rather than silently editing historical
  CIPI knowledge.
rejection_criteria:
- Any required source is missing or malformed.
- A product/knowledge/release permission boundary is unexpectedly enabled.
- The older formal status claims final review completion while external Human Gates
  remain unverified.
