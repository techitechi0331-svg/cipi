schema_version: "1.0"
track_id: MIC-SIM-FOUNDATION-RDQ-CANARY-002
enabled: true
activation_state: RESULT_DRIVEN_DECISION_QUALITY_CANARY
root_research_id: MIC-SIM-FOUNDATION-RDQ-CANARY-002

research_question: >-
  Can Mic Foundation autonomous research separate Calibration Control from search ranking
  and stop or continue from measured result quality instead of fixed loop depth while
  preserving deterministic measurement health and all existing authority boundaries?

hypothesis_id: HYP-MIC-RDQ-CANARY-RESULT-DRIVEN
hypothesis: >-
  Separating the known synthetic target as CALIBRATION_CONTROL, requiring independent-seed
  replication, and comparing search-error/ranking/parameter-interval evidence can produce
  an earlier and more defensible convergence decision than a fixed R1/R2/R3 schedule.

minimum_novelty: 0.10
minimum_improvement: 0.01

decision_policy:
  mode: RESULT_DRIVEN_CANARY_V1
  calibration_controls_affect_ranking: false
  replication_error_tolerance: 0.01
  minimum_parameter_interval_reduction: 0.10
  max_pareto_front_change_for_convergence: 0.0
  max_cross_run_novelty_for_convergence: 0.0
  continuation_priority:
    - FALSIFICATION
    - REPLICATION
    - UNCERTAINTY_REDUCTION
    - PARAMETERIZATION
    - CALIBRATION_CONTROL

product_integration: false
human_gate_required: false
human_gate_conditions:
  - REAL_AUDIO_AB
  - LISTENING_JUDGMENT
  - CUBASE_HOST_CONFIRMATION
  - PRODUCT_ADOPTION_DECISION
  - RELEASE_DECISION

authority_boundaries:
  automatic_final_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
  melon_continuation_is_proposal_only: true
  cipi_evidence_authority: true

dedup_baseline:
  parent_track: MIC-SIM-FOUNDATION-001
  evidence_snapshot: research/plugins/mic-simulator/foundation-inventory-2026-09-27.md
  canary_scope:
    - CALIBRATION_CONTROL_SEPARATION
    - RESULT_DRIVEN_CONTINUATION
    - EARLY_CONVERGENCE
    - ADAPTIVE_CONTINUATION
  do_not_reinterpret_parent_evidence: true

budget:
  max_loop_depth: 3
  max_runs: 3
  max_total_experiments: 3
  max_candidates: 24
  max_runtime: 240
  max_same_hypothesis_retry: 3
  max_same_architecture_retry: 3
  max_no_improvement_runs: 3

initial_experiment:
  experiment_id: EXP-MIC-RDQ-CANARY-R1
  experiment_type: INITIAL_FOUNDATION_IDENTIFIABILITY
  expected_information_gain: 0.90
  scope:
    - mic_simulator
    - result_driven_canary
    - calibration_control_separation
    - deterministic_harness
  inputs:
    seed: 2026092705
    population: 4
    generations: 2
    max_candidates: 8
    max_runtime_seconds: 60
    stage2_limit: 4
    stage2_archive_limit: 4
    stage2_epsilon_range_fraction: 0.03
    stage2_epsilon_spread_multiplier: 0.5
    stage3_limit: 1
    workers: 1
    preflight_mode: fast
  fingerprint_material:
    hypothesis: >-
      Calibration Control is measurement-health evidence and must not participate in search
      ranking; scientific continuation must be driven by independent replication and
      remaining uncertainty rather than loop count.
    architecture: MIC_CAPTURE_BASELINE_LADDER_RDQ_CANARY_V1
    tested_parameters:
      spectral_mix: bounded_0_to_0_25
      phase_delay_samples: [0, 1, 2]
      geometry_weight: bounded_0_to_1
      adaptive_search_width: result_driven_0_02_to_0_20
    benchmark_profile:
      - mic_foundation_identifiability_v1
      - mic_foundation_determinism_v1
      - mic_result_driven_decision_canary_v1
    sample_rate: 48000
    input_set: SYNTHETIC_MIC_FOUNDATION_TARGET_V1
    reference_model: SYNTHETIC_IDENTIFIABILITY_TARGET_CALIBRATION_ONLY_NOT_REAL_MICROPHONE
    objective_set:
      - best_search_identifiability_error
      - independent_seed_replication_consistency
      - ranking_stability
      - parameter_interval_reduction
      - determinism
      - numerical_stability
    relevant_constraints:
      - calibration_control_excluded_from_ranking
      - loop_depth_is_safety_bound_only
      - no_hardware_fidelity_claim
      - bounded_runtime
      - product_integration_off
      - automatic_promotion_off
    experiment_type: INITIAL_FOUNDATION_IDENTIFIABILITY
    scope:
      - mic_simulator
      - result_driven_canary
      - calibration_control_separation

efficiency_policy:
  policy_id: MIC-SIM-RDQ-CANARY-EFFICIENCY-V1
  policy_version: "1.0"
  state: ACTIVE
  max_memory_mb: 1024
  candidate_timeout_seconds: 5
  full_regression_required: false
