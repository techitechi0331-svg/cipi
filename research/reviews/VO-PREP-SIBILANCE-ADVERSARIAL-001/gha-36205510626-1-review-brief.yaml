research_question: Does the current Vo.Prep Sibilance Guard v2.3 contextual ratio
  detector preserve S/SH/CH/T event detection while rejecting bright but non-sibilant
  vocal conditions materially better than an absolute 4-12 kHz level trigger?
hypothesis: The high-to-broad/high-to-mid contextual detector will detect controlled
  sibilant events while producing substantially less false occupancy on bright vowel,
  air, breath, falsetto, female upper-register and distorted-vocal stress cases than
  the absolute high-band baseline, with small sample-rate and input-scale sensitivity.
counter_hypotheses:
- The contextual detector misses too many CH/T or sustained S/SH events.
- Bright vowels, air, breath or upper-register vocals still cause excessive false
  event occupancy.
- Detector behavior changes materially with sample rate or +/-12 dB input scaling.
acceptance_criteria:
- Context positive detection fraction is >= 0.85 across S/SH/CH/T and 44.1/48/96 kHz.
- S and SH are detected at every tested sample rate.
- Worst positive-event first-onset latency is <= 30 ms.
- Mean false event occupancy over declared non-sibilant cases is <= 8% and worst negative
  occupancy is <= 20%.
- Context mean false occupancy is <= 35% of the absolute high-band baseline mean false
  occupancy.
- Maximum contiguous context event duration is <= 355 ms.
- Maximum context probability spread across 44.1/48/96 kHz is <= 0.08.
- Across -12/0/+12 dB scaling on S, bright vowel and breath, max context probability
  spread is <= 0.05 and occupancy spread <= 5 percentage points.
- All derived values remain finite.
rejection_criteria:
- Any declared acceptance condition fails.
- Passing requires relaxing a predeclared recall, false-occupancy, latency, duration,
  sample-rate or scale-invariance gate.
- Raw audio is persisted or product DSP is mutated.
