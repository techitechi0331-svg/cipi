knowledge_candidate:
  claim: Vo.Prep event-only processing may advance to actual cross-product validation only if Plosive/Sibilance cleanup remains localized, Macro is truly disabled, and downstream VoPriPro interaction stays inside the predeclared compatibility budget.
  evidence_type: HYPOTHESIS
  scope: Deterministic source-derived event-only compatibility screen only.
  promotion_requested: HYPOTHESIS
rejection_record:
  reason: If any compatibility gate fails, preserve the case metrics and do not infer that disabling Macro is sufficient for a clean Vo.Prep -> VoPriPro chain.
  retained_findings:
    - Preserve event detector engagement, event audio attenuation, downstream GR movement, recovery, neutral/phrase false engagement, and sample-rate spread.
  reusable_findings:
    - Event processors should be evaluated for localized cleanup and downstream compatibility separately from phrase-level gain processors.
  revisit_if:
    - Actual VST3 processing materially disagrees with source-code translation.
    - Vo.Prep or VoPriPro event/detector DSP changes materially.
  scope: Vo.Prep Plosive50/Sibilance50/Macro0 -> VoPriPro Natural50.
review_policy:
  required_human_gates:
    - Level-matched real-vocal listening remains mandatory before a perceptual chain recommendation.
    - Actual VST3/Cubase validation remains mandatory before release guidance.
