reasoning:
  - The experiment directly separates phrase-scale tracking from short-event chasing instead of collapsing both into one score.
  - The bounded one-timescale baseline remains competitive and receives the identical synthetic observation stream.
  - Phrase transitions use fixed guard regions, but phrase-contrast error separately checks that slow tracking has not simply flattened the macro dynamics.
  - Downstream variance is treated only as a macro-level compressor proxy, not as proof of subjective naturalness.
  - The first implementation is synthetic and causal with no lookahead, so passing can authorize deeper real-vocal research but not product adoption.
