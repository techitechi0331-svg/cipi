name: Auto Research Gate

on:
  pull_request:
    paths:
      - "automation/**"
      - "research/jobs/**"
      - "research/runs/**"
      - "research/reports/**"
      - "research/knowledge_candidates/**"
      - "research/decisions/**"
      - "research/reviews/**"
      - "tools/validate_research_job.py"
      - "tools/validate_research_result.py"
      - "tools/validate_evidence_candidate.py"
      - "tools/validate_decision_records.py"
      - "tools/validate_review_triage.py"
      - "tools/validate_research_change_scope.py"
      - "tools/test_research_integrity_guards.py"
      - ".github/workflows/auto-research-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-auto-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate research jobs
        run: python tools/validate_research_job.py

      - name: Test append-only research integrity guards
        run: python tools/test_research_integrity_guards.py

      - name: Run deterministic mock worker
        run: |
          rm -rf research/runs/AUTO-SMOKE-001
          python automation/worker/runner.py automation/examples/research_job.yaml --output research/runs/AUTO-SMOKE-001/mock-0001 --run-id mock-0001
          if python automation/worker/runner.py automation/examples/research_job.yaml --output research/runs/AUTO-SMOKE-001/mock-0001 --run-id mock-0001; then
            echo "runner unexpectedly overwrote an existing research run"
            exit 1
          else
            echo "runner overwrite guard: PASS"
          fi

      - name: Exercise deterministic postprocessing
        run: |
          python automation/queue/postprocess.py --job automation/examples/research_job.yaml --run-dir research/runs/AUTO-SMOKE-001/mock-0001
          python tools/validate_research_job.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python automation/review/triage.py --job-id AUTO-SMOKE-001 --run-id mock-0001
          python tools/validate_review_triage.py

      - name: Exercise rejection preservation and decision recording
        run: |
          rm -rf research/runs/AUTO-REJECT-SMOKE-001 research/decisions/AUTO-REJECT-SMOKE-001
          python automation/worker/runner.py automation/examples/rejection_job.yaml --output research/runs/AUTO-REJECT-SMOKE-001/mock-reject-0001 --run-id mock-reject-0001
          python automation/queue/postprocess.py --job automation/examples/rejection_job.yaml --run-dir research/runs/AUTO-REJECT-SMOKE-001/mock-reject-0001
          python tools/validate_decision_records.py
          python automation/review/triage.py --job-id AUTO-REJECT-SMOKE-001 --run-id mock-reject-0001
          python tools/validate_review_triage.py

      - name: Run allowlisted real DSP research adapter
        run: |
          rm -rf research/runs/PEAKBODY-LEGACY-STRESS-001
          python automation/worker/runner.py automation/examples/peakbody_legacy_stress_job.yaml --output research/runs/PEAKBODY-LEGACY-STRESS-001/ci-0001 --run-id ci-0001

      - name: Validate research results and artifact safety
        run: |
          python tools/validate_research_result.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python tools/validate_review_triage.py

      - name: Validate existing CIPI research contract
        run: python tools/validate_research.py

      - name: Enforce worker branch path allowlist
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'research-bot/') }}
        run: python tools/validate_research_change_scope.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
