confirmed_findings:
  - id: VG-AUDIT-S5-STATE-FRAGMENTATION
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      The repository currently contains multiple disconnected notions of the guitar/string:
      VirtualGuitaristEngine drives semantic LivingString/SixStringBank state; GestureAudioBridge
      renders through the older SixStringAudioBank/PluckedStringDelayLoop path; the latest
      PhysicalRealismString/PhysicalRealismSixStringBank candidate is a separate rendering path.
      There is no single authoritative continuous physical state shared by performance,
      articulation and the latest sounding model.
    evidence:
      - Source/Performance/VirtualGuitarist/VirtualGuitaristEngine.cpp
      - Source/PhysicalModel/Strings/LivingString.cpp
      - Source/Performance/Gesture/GestureAudioBridge.cpp
      - Source/PhysicalModel/Audio/SixStringAudioBank.cpp
      - Source/PhysicalModel/Audio/PhysicalRealismString.cpp
      - Source/PhysicalModel/Audio/PhysicalRealismSixStringBank.cpp
    consequence: >-
      Muting, note termination, fretting, slides, vibrato, pick release and other performance
      state cannot causally alter the same acoustic state that produces the R3 waveform.

  - id: VG-AUDIT-S5-R3-NOT-PRODUCT-AUDIO-TRUTH
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      PhysicalRealismString is compiled and rendered as a candidate/test path, but it is not the
      single integrated audio engine owned by VirtualGuitaristEngine. Product/performance state
      and candidate audio remain architecturally split.
    evidence:
      - CMakeLists.txt
      - Tests/Audio/physical_realism_render.cpp
      - Tests/Audio/physical_realism_strum_render.cpp
      - Source/Performance/VirtualGuitarist/VirtualGuitaristEngine.h

  - id: VG-AUDIT-S5-MELON-V2-NOT-AUDIO-SIMULATION
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      MELON guitar_realism_v2_research does not instantiate or simulate a guitar audio/physical
      solver. Candidate measurements are algebraic proxy formulas computed directly from sampled
      parameters and architecture labels. Therefore the current Realism-004 adapter can test
      bounded proxy identifiability and orchestration behavior, but cannot determine which
      physical architecture sounds or behaves more like a real guitar.
    evidence:
      - melon commit cef5668308ad27274ec00b46fdad81577af8d0e2
      - melon/guitar_realism_v2_research.py
    important_detail: >-
      Metrics such as inharmonicity, onset duration, bridge transfer, sympathetic energy,
      dynamic detune and contact event proxy are calculated from candidate parameters rather
      than measured from rendered candidate waveforms or a physical simulation.

  - id: VG-AUDIT-S5-ARCHITECTURE-COMPETITION-BIASED
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      The Realism-v2 phase schedule progressively removes architectures by construction:
      R1 includes three species, R2 keeps PASSIVE_PLUCK_BRIDGE and NONLINEAR_CONTACT_FULL,
      and R3 permits only NONLINEAR_CONTACT_FULL. The best-candidate tie-breaking also rewards
      greater architecture_level. Consequently a final NONLINEAR_CONTACT_FULL result cannot
      be interpreted as an experimentally demonstrated architecture winner.
    evidence:
      - melon/guitar_realism_v2_research.py::_phase
      - melon/guitar_realism_v2_research.py::ARCHITECTURES
      - melon/guitar_realism_v2_research.py best-candidate selection

  - id: VG-AUDIT-S5-OBJECTIVE-NOT-REALISM
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      Realism-004 objective_set currently optimizes mechanism_coverage_penalty,
      architecture_level, estimated CPU cost and estimated memory cost. It contains no
      rendered-audio distance to a real reference and no perceptual objective. The adapter
      correctly declares this evidence synthetic, but its output must not drive architecture
      adoption or mechanism survival decisions as if it were realism evidence.
    evidence:
      - research/autonomous_bridge/tracks/VIRTUAL-GUITAR-PHYSICAL-REALISM-004.yaml
      - melon/guitar_realism_v2_research.py

  - id: VG-AUDIT-S4-INFORMATION-GAIN-SYNTHETIC
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      MELON information_gain_signal is a hand-authored function of the count of architecture
      labels observed, not a measured reduction in uncertainty or reference error. It must be
      renamed/reclassified before being used for research-priority decisions.
    evidence:
      - melon/guitar_realism_v2_research.py

  - id: VG-AUDIT-S5-PERFORMANCE-TO-AUDIO-INFORMATION-LOSS
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      Gesture/Picking exposes force, angle, depth and other player descriptors, but the current
      audio handoff collapses much of this information. PickExcitation produces energy and
      brightness, while GestureAudioBridge forwards excitation energy and pick position;
      brightness is discarded, angle is not used to shape the acoustic excitation, and
      pick depth is not part of the R3 sounding model.
    evidence:
      - Source/Performance/VirtualGuitarist/VirtualGuitaristState.h
      - Source/Performance/Picking/PickingEngine.cpp
      - Source/Performance/Picking/PickExcitation.h
      - Source/Performance/Gesture/GestureAudioBridge.cpp

  - id: VG-AUDIT-S5-ARTICULATION-NOT-R3-ACOUSTIC
    severity: S5_ARCHITECTURE_BLOCKER
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      Articulation and note-off logic modify LivingString semantic damping/state, but
      PhysicalRealismString exposes pluck/process/clear and is not driven by the same lifecycle.
      Therefore left-hand mute, right-hand mute, palm stop, choke, natural release and string
      replacement are not yet causal acoustic interactions in the R3 candidate.
    evidence:
      - Source/Performance/Articulation/ArticulationStateMachine.cpp
      - Source/PhysicalModel/Strings/LivingString.cpp
      - Source/PhysicalModel/Audio/PhysicalRealismString.h

  - id: VG-AUDIT-S4-SIX-STRING-NOT-COUPLED
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      PhysicalRealismSixStringBank owns six independent PhysicalRealismString instances and
      averages their outputs. There is no common bridge network, inter-string energy transfer
      or sympathetic coupling in the product candidate.
    evidence:
      - Source/PhysicalModel/Audio/PhysicalRealismSixStringBank.cpp

  - id: VG-AUDIT-S4-BRIDGE-BODY-NAMES-EXCEED-PHYSICS
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      Current bridgeCoupling is a static modal gain term. Current body behavior is simplified
      coloration using two one-pole states. Neither is evidence of a bidirectional mechanical
      boundary/admittance model.
    evidence:
      - Source/PhysicalModel/Audio/PhysicalRealismString.cpp

  - id: VG-AUDIT-S4-GENERIC-MIDI-NOTE-STRING
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      PhysicalRealismString is parameterized by MIDI note and shared realism parameters, without
      authoritative per-string gauge, tension, material, winding, scale/speaking length, open-vs-
      fretted boundary or string identity. The same pitch is not inherently tied to a physical
      string/fret configuration.
    evidence:
      - Source/PhysicalModel/Audio/PhysicalRealismString.h
      - Source/PhysicalModel/Audio/PhysicalRealismString.cpp

  - id: VG-AUDIT-S4-REALISM-TESTS-ARE-FUNCTIONAL-SMOKES
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      physical_realism_smoke currently verifies finite output, non-zero signal and that late RMS
      is lower than early RMS. It does not test real-guitar realism, pitch trajectory, spectral
      evolution, string identity, position response, contact mechanics or matched-reference error.
    evidence:
      - Tests/Audio/physical_realism_smoke.cpp

  - id: VG-AUDIT-S4-REALTIME-BENCHMARK-WRONG-AUDIO-PATH
    severity: S4_CRITICAL
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      realtime_memory_smoke benchmarks SixStringAudioBank/PluckedStringDelayLoop, not the latest
      PhysicalRealismString R3 candidate and not a future coupled Physical Core. Therefore its
      realtime PASS does not establish realtime feasibility of the current realism candidate.
    evidence:
      - Tests/Performance/realtime_memory_smoke.cpp
      - Source/PhysicalModel/Audio/SixStringAudioBank.h

  - id: VG-AUDIT-S3-R3-SAMPLE-RATE-COVERAGE
    severity: S3_MAJOR
    evidence_class: MEASURED
    verdict: FAIL
    statement: >-
      Current R3 realism smoke/render evidence is centered on 48 kHz. Dedicated 44.1/96 kHz
      realism/stability/performance coverage is not established for the R3 path.
    evidence:
      - Tests/Audio/physical_realism_smoke.cpp
      - Tests/Audio/physical_realism_render.cpp

  - id: VG-AUDIT-S3-OUTPUT-CLAMP-CAN-HIDE-FAILURE
    severity: S3_MAJOR
    evidence_class: INFERRED
    verdict: PARTIAL
    statement: >-
      PhysicalRealismString clamps final output to [-2,2]. A safety clamp is not inherently
      wrong, but without an energy/state invariant and explicit clamp-hit telemetry it can hide
      unstable or over-energized candidate behavior from downstream tests.
    evidence:
      - Source/PhysicalModel/Audio/PhysicalRealismString.cpp

  - id: VG-AUDIT-S4-RAW-GROUND-TRUTH-CONFOUNDER
    severity: S4_CRITICAL
    evidence_class: INFERRED
    verdict: PARTIAL
    statement: >-
      EGFxSet/Guitar-TECHS DI are valuable references for Pickup/Electronics->DI and total
      guitar behavior, but DI inherently includes pickup/electronics observation. They cannot
      by themselves uniquely identify raw-string displacement/contact physics. The validation
      plan must separate mechanism tests from DI end-to-end tests rather than optimizing the
      raw string directly to a confounded DI target.
    basis:
      - VG-CONTINUOUS-PHYSICAL-STATE-BLUEPRINT-20260929-001
      - VG-PHYSICAL-REALISM-EVIDENCE-REFINEMENT-20260929-002

