research_question: Does the append-only Black76 actual-VST3 real-vocal Snapshot-002
  pass the same continuity, clipping, latency, working-unity, provenance, raw-audio-safety
  and checksum-integrity gates after correcting only the CIPI byte-level packaging?
hypothesis: Snapshot-002 will preserve every previously passing Black76 DSP/host-derived
  metric while also passing SHA256 verification because its checksum was computed
  from the exact bytes committed to CIPI.
counter_hypotheses:
- Snapshot-002 still fails checksum verification, indicating the evidence packaging
  repair is incomplete.
- A supposedly unchanged behavioral metric differs, indicating Snapshot-002 is not
  a pure packaging repair.
acceptance_criteria:
- The Snapshot-002 committed checksum ledger verifies the exact committed metrics.csv
  bytes.
- The six-case two-source by three-mode matrix remains complete.
- All numerical fields remain finite at 48 kHz with exactly 6 samples of latency.
- Input peak normalization error remains <= 1e-6 from 0.5.
- Total clipped and non-finite sample counts remain zero and maximum output peak remains
  below 1.0.
- Attack-OFF color gain remains within +/-0.5 dB on both sources.
- Both compression modes retain at least 3 dB attenuation on every source.
- Provenance identifies actual VST3 processing and no raw WAV audio exists in the
  CIPI evidence directory.
rejection_criteria:
- Checksum verification still fails.
- Any previously passing finite-state, clipping, latency, matrix-integrity, provenance,
  working-unity or raw-audio-safety gate regresses.
