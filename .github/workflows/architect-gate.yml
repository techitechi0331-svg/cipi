name: Architect Gate

on:
  pull_request:
    paths:
      - "automation/architect/**"
      - "automation/incubator/**"
      - "research/architect/**"
      - "research/incubator/**"
      - "research/runs/ARCHITECT-*/**"
      - "research/knowledge_candidates/ARCHITECT-*/**"
      - "research/decisions/ARCHITECT-*/**"
      - "tools/validate_architect.py"
      - "tools/validate_incubator.py"
      - "tools/validate_architect_change_scope.py"
      - ".github/workflows/architect-gate.yml"
      - ".github/workflows/free-autonomous-architect.yml"
  push:
    branches: [ main ]
    paths:
      - "automation/architect/**"
      - "automation/incubator/**"
      - "research/architect/**"
      - "research/incubator/**"
      - "research/runs/ARCHITECT-*/**"
      - "research/knowledge_candidates/ARCHITECT-*/**"
      - "research/decisions/ARCHITECT-*/**"
      - "tools/validate_architect.py"
      - "tools/validate_incubator.py"
      - "tools/validate_architect_change_scope.py"
  workflow_dispatch:

jobs:
  validate-architect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate committed Architect and Incubator artifacts
        run: |
          python tools/validate_architect.py
          python tools/validate_incubator.py

      - name: Smoke unresolved/blocker signal extraction
        run: |
          rm -rf /tmp/cipi-signal-smoke
          mkdir -p /tmp/cipi-signal-smoke
          python automation/architect/scan_signals.py --root /tmp/cipi-signal-smoke --max-signals 20
          python tools/validate_architect.py --root /tmp/cipi-signal-smoke
          test "$(find /tmp/cipi-signal-smoke/research/architect/signals -name '*.yaml' | wc -l)" -ge 1
          python automation/architect/discover.py --output-root /tmp/cipi-signal-smoke --max-gaps 10
          test -f /tmp/cipi-signal-smoke/research/architect/gaps/GAP-BREATH-EVENT-DETECTION-001.yaml
          python - <<'PY'
          import yaml
          p=yaml.safe_load(open("/tmp/cipi-signal-smoke/research/architect/gaps/GAP-BREATH-EVENT-DETECTION-001.yaml",encoding="utf-8"))
          assert p["unresolved_signal_count"] >= 1
          print("signal-pressure discovery: PASS")
          PY

      - name: Smoke Research Gap discovery and Pilot
        run: |
          rm -rf /tmp/cipi-architect-smoke
          mkdir -p /tmp/cipi-architect-smoke
          python automation/architect/discover.py --topic nonlinear_continuity_replication --output-root /tmp/cipi-architect-smoke --max-gaps 1
          python tools/validate_architect.py --root /tmp/cipi-architect-smoke
          python automation/architect/pilot.py --proposal /tmp/cipi-architect-smoke/research/architect/proposals/RP-NONLINEAR-CONTINUITY-REPLICATION-001.yaml --output-root /tmp/cipi-architect-smoke --run-id architect-smoke-0001
          python - <<'PY'
          import json, pathlib, yaml
          root=pathlib.Path("/tmp/cipi-architect-smoke")
          manifest=json.loads(next((root/"research/runs").rglob("manifest.json")).read_text())
          metrics=json.loads(next((root/"research/runs").rglob("metrics.json")).read_text())
          kc=yaml.safe_load(next((root/"research/knowledge_candidates").rglob("*.yaml")).read_text())
          decision=yaml.safe_load(next((root/"research/decisions").rglob("*.yaml")).read_text())
          assert manifest["acceptance_met"] is True
          assert metrics["low_level_thd_penalty_db"] >= 20.0
          assert kc["evidence_type"] == "MEASURED"
          assert decision["review_status"] == "PENDING"
          print("architect pilot smoke: PASS")
          PY

      - name: Smoke Plugin Incubator overlap and Adapter Candidate routing
        run: |
          rm -rf /tmp/cipi-incubator-smoke
          mkdir -p /tmp/cipi-incubator-smoke
          python automation/architect/discover.py --topic breath_event_detection --output-root /tmp/cipi-incubator-smoke --max-gaps 1
          python automation/architect/adapter_candidate.py --root /tmp/cipi-incubator-smoke --max-candidates 1
          python automation/incubator/discover.py --proposal /tmp/cipi-incubator-smoke/research/architect/proposals/RP-BREATH-EVENT-DETECTION-001.yaml --output-root /tmp/cipi-incubator-smoke
          python tools/validate_architect.py --root /tmp/cipi-incubator-smoke
          python tools/validate_incubator.py --root /tmp/cipi-incubator-smoke
          python - <<'PY'
          import pathlib,yaml
          root=pathlib.Path("/tmp/cipi-incubator-smoke")
          d=yaml.safe_load(next((root/"research/incubator/decisions").glob("*.yaml")).read_text())
          a=yaml.safe_load(next((root/"research/architect/adapter_candidates").glob("*.yaml")).read_text())
          assert d["decision"] == "MERGE_EXISTING" and d["final"] is False
          assert a["state"] == "DRAFT_REVIEW" and a["executable"] is False
          assert a["automatic_registry_promotion_allowed"] is False
          print("incubator overlap + adapter candidate: PASS")
          PY

      - name: Smoke evidence-gated INCUBATE and isolated prototype
        run: |
          rm -rf /tmp/cipi-incubate-smoke
          mkdir -p /tmp/cipi-incubate-smoke
          python automation/architect/discover.py --topic phrase_envelope_riding --output-root /tmp/cipi-incubate-smoke --max-gaps 1
          python automation/incubator/discover.py --proposal /tmp/cipi-incubate-smoke/research/architect/proposals/RP-PHRASE-ENVELOPE-RIDING-001.yaml --output-root /tmp/cipi-incubate-smoke
          mkdir -p /tmp/cipi-incubate-smoke/research/runs/INCUBATOR-SMOKE/measurement-0001
          echo '{"result":"COMPLETED"}' > /tmp/cipi-incubate-smoke/research/runs/INCUBATOR-SMOKE/measurement-0001/manifest.json
          mkdir -p /tmp/cipi-incubate-smoke/research/incubator/evidence/PLUGIN-RP-PHRASE-ENVELOPE-RIDING-001
          cat > /tmp/cipi-incubate-smoke/research/incubator/evidence/PLUGIN-RP-PHRASE-ENVELOPE-RIDING-001/smoke-pass.yaml <<'YAML'
          schema_version: "1.0"
          plugin_proposal_id: PLUGIN-RP-PHRASE-ENVELOPE-RIDING-001
          source_measurement_run: research/runs/INCUBATOR-SMOKE/measurement-0001
          baseline_improvement_pass: true
          holdout_pass: true
          regression_pass: true
          cpu_pass: true
          latency_pass: true
          overlap_advantage_pass: true
          negative_knowledge_reviewed: true
          raw_audio_persisted: false
          scope: "CI smoke evidence only; not product evidence."
          YAML
          python automation/incubator/evaluate.py --root /tmp/cipi-incubate-smoke --max-candidates 1
          DECISION="$(find /tmp/cipi-incubate-smoke/research/incubator/decisions -name '*-incubate-*.yaml' | head -1)"
          test -n "$DECISION"
          python automation/incubator/prototype.py             --proposal /tmp/cipi-incubate-smoke/research/incubator/proposals/PLUGIN-RP-PHRASE-ENVELOPE-RIDING-001.yaml             --decision "$DECISION"             --output-root /tmp/cipi-incubate-smoke
          python tools/validate_incubator.py --root /tmp/cipi-incubate-smoke
          test -f /tmp/cipi-incubate-smoke/research/incubator/prototypes/PLUGIN-RP-PHRASE-ENVELOPE-RIDING-001/metrics.json

      - name: Validate existing CIPI research contracts
        run: |
          python tools/validate_research_result.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python tools/validate_research_job.py
          python tools/validate_research.py

      - name: Enforce architect-bot append-only scope
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'architect-bot/') }}
        run: python tools/validate_architect_change_scope.py --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
