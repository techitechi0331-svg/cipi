  - "Exactly 27 candidates are present."
  - "At least three finite hard-pass candidates exist."
  - "2 dB Drive has zero hard-pass candidates."
  - "A 4 dB conservative hard-pass profile exists."
  - "A 6 dB balanced hard-pass profile exists with full/baseline LF ratio <= 1.05."
  - "A 6 dB color-contrast hard-pass profile exists with stress THD <= 7 percent and full/baseline LF ratio <= 1.40."
rejection:
