unresolved:
  - Vo.Prep -> VoPriPro integration v2 is REJECTED only for the tested all-modules 50% downstream-benefit/recovery hypothesis: source-derived Plosive/Sibilance controls engaged correctly, but the plosive case improved downstream VoPriPro peak GR by only ~0.013 dB and left ~0.402 dB post-event mean-GR shift. Sibilance, neutral, phrase and sample-rate gates passed. Module-isolation research is next; product ordering is not rejected.
  - Existing Vo.Prep Amount R2-R4 product mappings are not eligible for direct transfer; current VoPriPro AMOUNT remains baseline while its own perceptual uniformity still needs listening/generalisation evidence.
  - Direct fixed 8/70 ms ballistics transfer was rejected by short-transient, 100 ms body, long-body and repeated-phrase gates; current Character timing remains baseline.
  - Direct Vo.Prep Slow-RMS/Fast-Peak detector transfer v1 was rejected by predeclared sustained-body and short-transient gates; current VoPriPro detector remains baseline.
  - Product boundary is now fixed: VoPriPro owns broadband dynamics; Vo.Prep owns problem/event preparation. Transfer candidates still require same-corpus comparison before adoption.
  - Human level-matched KEEP/REVISE/ROLLBACK listening decision is pending for the current main Natural50 A/B pack.
  - The current objective real-vocal snapshot covers four adult HUST_Solfege Twinkle recordings and does not establish universal singer/generalisation claims.
