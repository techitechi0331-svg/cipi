schema_version: "1.0"
job_id: VOCAL-RESONANCE-R4-CLEAN-AUDIT-001
state: QUEUED
track:
  id: VOCAL_RESONANCE_FORMAL
  path: research/plugins/vocal-resonance
research_question: "Which vocal techniques and pitch regimes dominate clean false triggers for the current static safe-negative resonance ranker, and does the current benchmark under-cover high-pitch singing?"
hypothesis: "Clean false triggers will concentrate in one or more specific vocal-technique or high-pitch stress subgroups rather than being uniformly distributed, and a broader disjoint clean cohort will contain enough p90-F0 >=400 Hz cases to measure that behavior."
counter_hypotheses:
  - "False triggers are broadly distributed across techniques and singers, implying the current feature space is globally miscalibrated rather than subgroup-specific."
  - "The available VocalSet audit cohort still does not provide enough high-pitch cases, so a dedicated high-note stress cohort must be designed before high-F0 claims can be tested."
baseline:
  - static_r2_style_safe_negative
variants:
  - broader_disjoint_clean_negative_audit
metrics:
  - overall_clean_false_trigger
  - false_trigger_by_technique
  - false_trigger_by_singer
  - false_trigger_by_pitch_bin
  - technique_false_trigger_spread
  - p90_ge_400_count
  - p90_ge_400_false_trigger
  - label_mapping_resolution
acceptance:
  - "audit contains at least 24 disjoint clean excerpts"
  - "dataset label IDs are resolved to technique names"
  - "at least 4 technique categories are represented"
  - "at least 6 excerpts have voiced F0 p90 >= 400 Hz"
rejection:
  - "fewer than 24 usable clean excerpts"
  - "label mapping cannot be resolved"
  - "fewer than 4 technique categories"
  - "fewer than 6 high-pitch stress excerpts under the predeclared p90 >=400 Hz definition"
max_runs: 1
timeout_minutes: 12
random_seed: 20260930
experiment_adapter: vocal_resonance_clean_negative_audit_v1
allowed_operations:
  - stream_public_vocalset_in_runner_memory
  - derived_metric_write
prohibited_operations:
  - arbitrary_shell
  - main_push
  - confidence_change
  - current_stage_change
  - raw_audio_write
  - paid_api
  - product_release
knowledge_candidate:
  claim: "Clean-vocal false triggers for resonance ranking may be concentrated by vocal technique or pitch regime rather than uniformly distributed."
  evidence_type: HYPOTHESIS
  scope: "Vocal resonance semantic-ranker hard-negative design and subgroup measurement."
  promotion_requested: HYPOTHESIS
