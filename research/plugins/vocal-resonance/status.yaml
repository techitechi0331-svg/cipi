why_next: "R6 rejected run-length-only veto as a validated abstention stage and also exposed an underpowered action-retention metric caused by the current static actuation threshold. Rather than tuning another veto, the next bounded question is whether the current candidate representation contains enough information to distinguish the injected causal target at all."
next_confirmation: "Whether a research-only paired clean/injected oracle can rank the injected target near the top when candidate discovery hits, and how large the gap is between that oracle and single-view inference features. This determines whether the blocker is feature identifiability, label/candidate alignment, or model choice."
