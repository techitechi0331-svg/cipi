decision: ITERATE
review_status: CONFIRMED
rationale: >-
  The evidence-reuse gate passed with intact provenance and predeclared criteria.
  Vo.Prep provides bounded 11-stem evidence for the hybrid detector while the
  current MicroDouble detector still lacks equivalent labelled real-vocal recall
  evidence. This is sufficient to authorize a direct product baseline-vs-candidate
  experiment, but not sufficient to adopt or promote the candidate.
declared_rejection_criteria:
  - Any declared acceptance condition fails.
  - The snapshot checksum fails.
  - Evidence would be interpreted as product adoption rather than permission to run a direct A/B.
triggered_criteria: []
retained_findings:
  - "Vo.Prep hybrid evidence: 11 real-vocal stems, 64% reference recall, 0.02% low-confidence false trigger, 3.1% occupancy."
  - "Vo.Prep source-scope processing remained bounded: 1.33 dB corpus max reduction and 0.14 dB body-region mean movement."
  - "Current MicroDouble baseline remains synthetically sane but lacks equivalent labelled real-vocal recall evidence."
reusable_findings:
  - "A precision-biased high/broad + high/mid energy-ratio detector is a justified candidate for subtle vocal-event protection when false-trigger control matters, but source-plugin evidence should be followed by same-product direct A/B before adoption."
revisit_if:
  - "Direct MicroDouble A/B shows higher false activation on breathy or bright non-sibilant vocals."
  - "Hybrid protection audibly dulls consonants or reduces desired air."
  - "Candidate CPU cost is materially higher without measurable protection benefit."
  - "A broader labelled multilingual corpus contradicts the source Vo.Prep precision bias."
