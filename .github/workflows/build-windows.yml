name: build-windows-vst3

on:
  push:
    branches: [ main ]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: cipi-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Collect VST3 bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bundles = Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3
          if (-not $bundles) {
            throw "No VST3 bundle directories were produced."
          }

          foreach ($bundle in $bundles) {
            $destination = Join-Path artifacts $bundle.Name
            Copy-Item -LiteralPath $bundle.FullName -Destination $destination -Recurse -Force
          }

          Write-Host "Collected VST3 bundles:"
          Get-ChildItem -Path artifacts -Directory -Filter *.vst3 | ForEach-Object {
            Write-Host " - $($_.Name)"
          }

      - name: Upload VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CIPI-Windows-VST3
          path: artifacts
          if-no-files-found: error
