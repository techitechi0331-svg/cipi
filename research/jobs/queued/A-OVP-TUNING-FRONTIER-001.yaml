research_question: "Does the fixed 27-point Original Vocal Pre v0.2 sweep contain reproducible conservative, balanced, and color-contrast profiles suitable for deeper measurement before real-vocal AB?"
hypothesis: "The sweep contains a hard-pass 4 dB conservative profile plus two distinct hard-pass 6 dB profiles: a low-LF-penalty balanced profile and a bounded color-contrast profile."
counter_hypotheses:
  - "The sweep does not contain all three profiles under the fixed rules."
  - "The 2 dB range already produces hard-pass candidates and is sufficient."
