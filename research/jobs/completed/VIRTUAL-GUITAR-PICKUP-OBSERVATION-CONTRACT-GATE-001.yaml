research_question: Is the Pickup Observation boundary supported by measured pickup-position/aperture
  evidence and a physical input that preserves string/fret identity?
hypothesis: Pickup position and aperture must be measured as an observation of physical
  string state, not substituted by post-EQ or MIDI-only identity.
counter_hypotheses:
- Pickup position can be represented as a static EQ preset.
- MIDI pitch alone is sufficient input to the pickup observation layer.
