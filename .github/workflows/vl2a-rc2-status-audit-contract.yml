name: VL2A RC2 Status Audit Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "research/jobs/queued/VL2A-RC2-EVIDENCE-CONTINUITY-001.yaml"
      - "automation/adapter_registry.yaml"
      - "automation/worker/experiments.py"
      - "tools/test_vl2a_rc2_status_audit.py"
      - ".github/workflows/vl2a-rc2-status-audit-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Compile adapter
        run: python -m py_compile automation/worker/experiments.py
      - name: Run VL2A audit fixtures
        run: python -m unittest discover -s tools -p test_vl2a_rc2_status_audit.py
