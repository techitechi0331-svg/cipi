name: Human Gate Decision

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: CIPI project id
        required: true
        type: string
      target_type:
        description: Human Gate target type
        required: true
        type: choice
        options:
          - RESEARCH_JOB
          - AUTONOMOUS_TRACK
      target_id:
        description: Job or autonomous track id
        required: true
        type: string
      gate:
        description: Exact Human Gate name
        required: true
        type: string
      outcome:
        description: Human decision
        required: true
        type: choice
        options:
          - COMPLETE
          - REJECT
          - DEFER
      evidence_ref:
        description: Evidence or verification reference
        required: true
        type: string
      rationale:
        description: Human rationale
        required: true
        type: string
      actor:
        description: Human reviewer identity
        required: true
        type: string
      source:
        description: Submission source
        required: true
        default: DISCORD
        type: choice
        options:
          - DISCORD
          - GITHUB_UI
          - CLI
      source_generation_id:
        description: Continuity generation id seen by reviewer
        required: true
        type: string
      source_state_digest:
        description: Continuity source-state digest seen by reviewer
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: cipi-human-gate-writes
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Record stale-safe Human Gate decision
        id: decision
        shell: bash
        env:
          HG_PROJECT_ID: ${{ inputs.project_id }}
          HG_TARGET_TYPE: ${{ inputs.target_type }}
          HG_TARGET_ID: ${{ inputs.target_id }}
          HG_GATE: ${{ inputs.gate }}
          HG_OUTCOME: ${{ inputs.outcome }}
          HG_EVIDENCE_REF: ${{ inputs.evidence_ref }}
          HG_RATIONALE: ${{ inputs.rationale }}
          HG_ACTOR: ${{ inputs.actor }}
          HG_SOURCE: ${{ inputs.source }}
          HG_GENERATION_ID: ${{ inputs.source_generation_id }}
          HG_STATE_DIGEST: ${{ inputs.source_state_digest }}
          HG_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python automation/human_gate/apply.py \
            --project-id "$HG_PROJECT_ID" \
            --target-type "$HG_TARGET_TYPE" \
            --target-id "$HG_TARGET_ID" \
            --gate "$HG_GATE" \
            --outcome "$HG_OUTCOME" \
            --evidence-ref "$HG_EVIDENCE_REF" \
            --rationale "$HG_RATIONALE" \
            --actor "$HG_ACTOR" \
            --source "$HG_SOURCE" \
            --source-generation-id "$HG_GENERATION_ID" \
            --source-state-digest "$HG_STATE_DIGEST" \
            --run-id "$HG_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate Human Gate records
        run: python automation/human_gate/apply.py --validate-all

      - name: Commit append-only Human Gate decision
        env:
          HG_TARGET_ID: ${{ inputs.target_id }}
          HG_GATE: ${{ inputs.gate }}
        run: |
          git config user.name "cipi-human-gate-bot"
          git config user.email "cipi-human-gate-bot@users.noreply.github.com"
          git add -A -- research/human_gates
          if git diff --cached --quiet; then
            echo "No Human Gate changes."
            exit 0
          fi
          git commit -m "record human gate decision: $HG_TARGET_ID / $HG_GATE"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Re-evaluate global DAG after a completed research-job gate
        if: inputs.outcome == 'COMPLETE' && steps.decision.outputs.operational_effect == 'RESOLVE_RESEARCH_JOB_GATE'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE="$(gh run list --workflow global-dag-orchestrator.yml --limit 20 --json status --jq '[.[] | select(.status==\"queued\" or .status==\"in_progress\")] | length')"
          if [ "$ACTIVE" = "0" ]; then
            gh workflow run global-dag-orchestrator.yml --ref main
          else
            echo "Global DAG already active; no duplicate dispatch."
          fi

      - name: Track-level completion is record-only
        if: inputs.target_type == 'AUTONOMOUS_TRACK' && inputs.outcome == 'COMPLETE'
        run: |
          echo "The human decision was recorded, but autonomous-track replay remains intentionally disabled."
          echo "A separate replay/continuation contract is required before CIPI can resume a stopped track."
