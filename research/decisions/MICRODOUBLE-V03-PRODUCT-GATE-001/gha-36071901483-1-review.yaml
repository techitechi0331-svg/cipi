retained_findings:
  - "v0.3 public 50% absolute mono-minus-stereo RMS delta was 0.014 dB versus 0.083 dB for the v0.2 50% baseline."
  - "v0.3 public 50% stereo RMS was within 0.002 dB of the imported source RMS."
  - "v0.3 100% L/R correlation differed from v0.2 100% by only 0.01191, while its absolute mono-minus-stereo RMS delta was 0.618 dB."
  - "Maximum absolute +/-5-cent pitch error was 0.00391377 cents."
  - "Seek/restart stale-output peak and block-partition difference were both 0 in the imported regression evidence."
  - "The fixed Mud detector negative result is retained: at least 99% strong activation on the five-recording calibration set."
  - "The adaptive Mud detector reduced maximum strong activation to 5.14% on that set while the product synthetic buildup test remained responsive."
  - "Windows VST3 build and pluginval 1.0.4 strictness-5 flags passed."
reusable_findings:
  - "For a one-knob vocal spatial processor, a public midpoint may be calibrated to a substantially subtler internal intensity while preserving a full-strength endpoint; midpoint usability and endpoint capability should be gated separately."
  - "A fixed low-mid/full-band ratio can classify normal singer-dependent spectral balance as a permanent problem; a voice-relative adaptive baseline is a stronger candidate when false-positive control matters."
  - "Transport-discontinuity stale-state tests should be a regression gate for stateful latency-bearing vocal effects."
revisit_if:
  - "Target-machine v0.3 listening rejects the new 50% default or exposes audible chorus, phase, consonant or tonal artifacts."
  - "Cubase Pro 14 exposes state, loop, automation, latency, realtime/offline or compatibility failures."
  - "A broader labelled vocal corpus exceeds the declared adaptive-detector false-trigger tolerance."
  - "A level-matched comparison shows CIPI's exact-mono Side-only topology is perceptually superior to the current two-voice product topology."
