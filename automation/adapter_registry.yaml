schema_version: "1.0"
adapters:
  black76_real_vocal_snapshot_gate_v1:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Validate the imported Black76 actual-VST3 real-vocal derived snapshot for integrity, finite/clipping-free processing, stable latency, practical Attack-OFF unity behavior, and no raw audio persistence."

  black76_real_vocal_snapshot_gate_v2:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Revalidate the append-only Black76 actual-VST3 real-vocal Snapshot-002 after correcting CIPI byte-level checksum packaging; DSP metrics are unchanged."

  peakbody_legacy_model_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Replay stored PeakBody legacy stress research as reproducible negative evidence."
  peakbody_revision02_policy_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Replay PeakBody Revision 02 model policy across sample rates against a fixed-timing simple baseline."
  peakbody_spectral_guard_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Falsify or support a simple AirGuard-style normalized high-band guard against PeakBody crest confounders."
  peakbody_periodicity_guard_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Test whether periodicity protection resolves bright-harmonic false suppression left by the simple spectral guard."
  peakbody_realtime_voicing_bench_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Compare normalized autocorrelation, YIN-CMND confidence, and MPM-NSDF clarity for PeakBody periodicity protection on a deterministic synthetic voicing/noise matrix; no product winner selection."

  peakbody_contextual_noise_guard_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Compare PeakBody strong-periodicity veto against a Vo.Prep-contextual noise-evidence extension on a deterministic synthetic confounder matrix; complex candidate is not automatically preferred."

  original_vocal_pre_measurement_gate_v1:
    tracks:
      - UA610_ORIGINAL_VOCAL_PRE
    max_timeout_minutes: 2
    network_required: false
    purpose: "Verify the preserved Original Vocal Pre v0.1 Windows measurement snapshot, retain negative results, and apply fixed candidate-vs-simple-baseline gates."

  black76_ratio_p2a_compare_v1:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Deterministically compare imported Black76 baseline and P2-A static-ratio evidence against the committed supplemental target."

  black76_linear_detector_compare_v1:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Gate whether the Black76 diagnostic linear full-wave detector plus per-ratio gain/bias can reproduce onset and low/mid/deep static-ratio curvature against committed supplemental evidence."

  black76_detector_curvature_compare_v1:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Gate whether one shared superlinear detector power exponent plus per-ratio gain/bias materially and sufficiently improves Black76 static-ratio curvature over the gamma=1 diagnostic baseline."

  vocal_resonance_motion_coherence_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Stream public VocalSet in runner memory and compare static safe-negative ranking against F0/harmonic-motion coherence without persisting raw audio."

  vl2a_phase01h_snapshot_gate_v1:
    tracks:
      - VL2A_PHASE01H_LINEAMP
    max_timeout_minutes: 2
    network_required: false
    purpose: "Validate the imported VL2A Phase 01-H compiled measurement and objective VocalSet AB snapshots without raw audio or product mutation."

  vocal_resonance_clean_negative_audit_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Audit disjoint VocalSet clean negatives by technique, singer, and F0 quantiles without persisting raw audio."

  vl2a_phase01h_checksum_diagnosis_v1:
    tracks:
      - VL2A_PHASE01H_LINEAMP
    max_timeout_minutes: 2
    network_required: false
    purpose: "Diagnose imported VL2A evidence checksum mismatches and distinguish exact-content changes from line-ending normalization."

  microdouble_product_v03_gate_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Verify the committed Vocal One-Knob Doubler v0.3 product-measurement snapshot against the v0.2 simple baseline and fixed technical gates without raw audio or product mutation."


  vocal_resonance_clean_negative_reaudit_v2:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Independently re-audit disjoint VocalSet clean negatives across exercise families using a conservative YIN-style pitch proxy; persist derived metrics only."

  vo_prep_snapshot_gate_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 2
    network_required: false
    purpose: "Validate the committed Vo.Prep derived-evidence snapshot, preserve negative/unresolved findings, and ensure no raw client audio is imported."

  vocal_resonance_temporal_morphology_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Compare generic temporal candidate morphology against the unchanged static vocal-resonance ranker on injected and independent clean VocalSet evidence."

  voprep_amount_mapping_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Compare user-facing Amount mappings on the frozen Vo.Prep transparent compressor model without raw audio or product mutation."


  vocal_resonance_temporal_morphology_stability_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Falsify the positive R5 morphology result with overlap checks, two injection seeds, feature-family ablation, same-C control and paired external-clean bootstrap."

  voprep_amount_mapping_r2_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Run leak-free Vo.Prep Amount Revision 2 on a pinned public HUST_Solfege LFS object with disjoint selection and final-holdout speakers; persist derived evidence only."
  original_vocal_pre_tuning_frontier_v1:
    tracks:
      - UA610_ORIGINAL_VOCAL_PRE
    max_timeout_minutes: 2
    network_required: false
    purpose: "Reduce the committed Original Vocal Pre v0.2 tuning sweep into deterministic conservative, balanced, and color-contrast profiles without selecting a product winner."

  microdouble_sibilance_reuse_gate_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Gate reuse of the measured Vo.Prep hybrid sibilance detector as a MicroDouble product-experiment candidate against the simpler current detector evidence. This gate authorizes an A/B experiment only; it does not adopt the candidate."

  microdouble_sibilance_r3_snapshot_gate_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Verify the MicroDouble sibilance R1/R2 negative evidence and the predeclared leak-free R3 threshold-selection + holdout result before any product integration."

  microdouble_transient_context_reuse_gate_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Gate whether Vo.Prep plosive-context evidence is sufficient to justify a MicroDouble development experiment as an augmenting context signal, never as a replacement for the current generic transient detector."

  vocal_resonance_run_length_veto_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Evaluate run-length-only morphology strictly as a post-ranker veto/abstention gate over the frozen static vocal-resonance ranker."

  vocal_resonance_identifiability_oracle_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Research-only paired clean/injected causal-oracle audit to diagnose vocal-resonance candidate identifiability versus single-view feature limitations."

  vocal_resonance_local_patch_proxy_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Compare deployable single-view local multi-scale spectro-temporal patch/context features against the frozen static vocal-resonance ranker."

  rp_masking_aware_presence_001_pilot_v1:
    tracks:
      - ARCHITECT_MASKING_AWARE_PRESENCE
    max_timeout_minutes: 5
    network_required: false
    purpose: "Run the reviewed deterministic synthetic masking-aware presence pilot against a static presence-EQ baseline; this is an oracle-style selectivity test only and cannot establish a deployable masking estimator or product claim."

  rp_phrase_envelope_riding_001_pilot_v1:
    tracks:
      - ARCHITECT_PHRASE_ENVELOPE_RIDING
    max_timeout_minutes: 5
    network_required: false
    purpose: "Run the reviewed deterministic causal Phrase Envelope pilot against a bounded one-timescale level baseline; passing authorizes deeper real-vocal research only and cannot establish standalone product value."


  vocal_resonance_transfer_consistency_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Compare deployable fixed-Hz temporal transfer-consistency features against the frozen static vocal-resonance ranker."

  microdouble_transient_necessity_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Reproduce the current MicroDouble generic transient detector and the Vo.Prep plosive-context detector on deterministic stress signals to decide whether augment-only context is necessary before adding product complexity."

# queue-trigger: VO-PREP-AMOUNT-R2-001

  voprep_amount_mapping_r3_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Run leak-free Vo.Prep Amount Revision 3 on streaming VocalSet with disjoint singer selection/final-holdout splits and unchanged product ripple gate."

  voprep_sidechain_hpf_pilot_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Compare OFF versus 40/60/70/80/100 Hz 12 dB/oct detector-only high-pass candidates on a deterministic vocal/plosive/rumble stress matrix; passing authorizes real-vocal research only."

# queue-trigger: VO-PREP-AMOUNT-R3-VOCALSET-001 / eligibility-cache-fix

# queue-trigger: VO-PREP-AMOUNT-R3-VOCALSET-001 / csv-schema-fix

  vocal_resonance_clean_normative_prior_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Evaluate a singer-disjoint clean-vocal normative prior as deployable single-view context for Vocal Resonance semantic ranking."

# queue-trigger: VO-PREP-SC-HPF-PILOT-001 / sample-exact-slice-fix

  vocal_resonance_self_counterfactual_inpainting_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Evaluate same-observation spectral inpainting as a deployable self-counterfactual proxy for the R7 causal resonance delta."

  voprep_amount_mapping_r4_v1:
    tracks:
      - VO_PREP_FORMAL
    max_timeout_minutes: 20
    network_required: true
    purpose: "Compare the rejected R3 fixed-offset Amount baseline against an explicit-Learn one-time Threshold solver on fresh singer-disjoint VocalSet cohorts; passing authorizes red-team only."

  vopripro_detector_transfer_screen_v1:
    tracks:
      - VOPRIPRO_FORMAL
    max_timeout_minutes: 3
    network_required: false
    purpose: "Falsify or qualify transfer of the Vo.Prep Slow-RMS/Fast-Peak fusion into VoPriPro against the current Natural50 detector on a deterministic synthetic stress matrix."

  vopripro_ballistics_transfer_screen_v1:
    tracks:
      - VOPRIPRO_FORMAL
    max_timeout_minutes: 3
    network_required: false
    purpose: "Falsify or qualify transfer of the Vo.Prep 8 ms / 70 ms fixed ballistics into VoPriPro against the current Natural50 20 ms / 110 ms timing under matched detector and gain-computer conditions."
