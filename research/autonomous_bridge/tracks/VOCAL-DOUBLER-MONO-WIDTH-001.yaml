schema_version: "1.0"
track_id: VOCAL-DOUBLER-MONO-WIDTH-001
enabled: true
activation_state: ACTIVE_BOUNDED_SYNTHETIC_TOPOLOGY
root_research_id: MICRODOUBLE_01

research_question: >-
  Given existing Vocal One-Knob Doubler v0.3 product/CIPI evidence and
  v0.4-v0.5 development-branch research, does a bounded theoretical
  antisymmetric-Side delay topology offer a different mono-vs-width
  tradeoff than a positive-center delay proxy, worth falsifying
  separately in the actual product?
hypothesis_id: HYP-DOUBLER-PROTECTED-CENTER-VS-ANTISYMMETRIC-SIDE
hypothesis: >-
  In an isolated deterministic delay-topology model, L=dry+g*S and
  R=dry-g*S will algebraically preserve mono while allowing measurable
  Side energy, unlike ordinary positive-polarity dual-delay copies.
  This mathematical fact is NOT evidence that the side-only architecture
  sounds more natural or should replace the measured v0.3 product engine.
minimum_novelty: 0.10
minimum_improvement: 0.01

product_integration: false
human_gate_required: false
human_gate_conditions:
  - ACTUAL_V05_PRODUCT_DSP_BASELINE_AND_MONO_SIDE_AB
  - ACTUAL_WINDOWS_VST3_BUILD_AND_PLUGINVAL_STRICTNESS5
  - MULTIRATE_BLOCK_AND_TRANSPORT_REGRESSIONS
  - LEVEL_MATCHED_REPRESENTATIVE_REAL_VOCALS
  - VOCAL_NATURALNESS_AND_MONO_LISTENING
  - CUBASE_PRO_14_STATE_AUTOMATION_CPU_LATENCY_REALTIME_OFFLINE
  - PRODUCT_ADOPTION_DECISION
  - VOCAL_ONE_INTEGRATION_DECISION
  - FINAL_RELEASE

authority_boundaries:
  automatic_final_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
  melon_continuation_is_proposal_only: true
  cipi_evidence_authority: true

dedup_baseline:
