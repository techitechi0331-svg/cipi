research_question: Can a lightweight normative prior learned only from clean training
  singers provide deployable single-view information that materially closes the R7
  causal-oracle ranking gap without increasing independent clean-vocal false triggers?
hypothesis: Across both predeclared seeds, adding clean-trained frequency-conditioned
  robust rarity features to the frozen static candidate representation will improve
  conditional Top-5 by at least 0.08, close at least 15 percent of the R7 oracle gap,
  preserve strong-effect conditional Top-5 within 0.05, and not worsen external clean
  false-trigger by more than 0.025.
counter_hypotheses:
- Natural singer-to-singer spectral diversity is too large for a lightweight normative
  prior to add stable information.
- The prior learns corpus-specific normality and worsens unseen-singer clean false
  triggers.
- The R7 information gap requires an actual within-source counterfactual and cannot
  be approximated by population priors.
acceptance_criteria:
- 'for each seed: prior is fit only on predeclared training singers'
- 'for each seed: conditional Top-5 >= static + 0.08'
- 'for each seed: R7 oracle gap closure >= 0.15'
- 'for each seed: strong-effect conditional Top-5 >= static - 0.05'
- 'for each seed: external clean false-trigger <= static + 0.025'
- 'for each seed: generator ceiling >= 0.80'
rejection_criteria:
- any seed has prior singer leakage
- any seed conditional Top-5 improvement < 0.08
- any seed oracle gap closure < 0.15
- any seed strong-effect conditional Top-5 regresses by more than 0.05
- any seed external clean false-trigger worsens by more than 0.025
