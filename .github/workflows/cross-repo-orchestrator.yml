name: Cross-Repo Orchestrator

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "automation/cross_repo/**"
      - "tools/validate_cross_repo.py"
      - "tools/test_cross_repo_orchestrator.py"
      - "RULES/CROSS_REPO_ORCHESTRATION.md"
      - ".github/workflows/cross-repo-orchestrator.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: cipi-cross-repo-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CIPI_CROSS_REPO_TOKEN: ${{ secrets.CIPI_CROSS_REPO_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate Cross-Repo contracts
        run: |
          python tools/validate_cross_repo.py
          python tools/test_cross_repo_orchestrator.py
          python tools/validate_autonomy_state.py
          python tools/test_autonomy_stack.py

      - name: Reconcile, observe, resume and dispatch
        id: orchestrate
        run: python automation/cross_repo/orchestrate.py --github-output "$GITHUB_OUTPUT"

      - name: Validate generated autonomy state
        if: steps.orchestrate.outputs.configured == 'true' && steps.orchestrate.outputs.changed == 'true'
        run: |
          python tools/validate_cross_repo.py
          python tools/validate_autonomy_state.py

      - name: Commit append-only Cross-Repo state
        if: steps.orchestrate.outputs.configured == 'true' && steps.orchestrate.outputs.changed == 'true'
        run: |
          git config user.name "cipi-cross-repo-bot"
          git config user.email "cipi-cross-repo-bot@users.noreply.github.com"
          git add -A -- research/cross_repo
          if [ -d research/jobs/queued ]; then
            git add -A -- research/jobs/queued
          fi
          if git diff --cached --quiet; then
            echo "No persistent Cross-Repo changes."
          else
            git commit -m "update cross-repo orchestration state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Re-dispatch Global DAG after Cross-Repo state changed
        if: steps.orchestrate.outputs.configured == 'true' && steps.orchestrate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTIVE="$(gh run list --workflow global-dag-orchestrator.yml --limit 20 --json status --jq '[.[] | select(.status=="queued" or .status=="in_progress")] | length')"
          if [ "$ACTIVE" = "0" ]; then
            gh workflow run global-dag-orchestrator.yml --ref main
          else
            echo "Global DAG already active; changed Cross-Repo state will be visible on its next pass."
          fi

      - name: Re-dispatch No-Wait scheduler when an external wait resumed
        if: steps.orchestrate.outputs.configured == 'true' && steps.orchestrate.outputs.resumed_jobs != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run no-wait-orchestrator.yml --ref main

      - name: Token not configured
        if: steps.orchestrate.outputs.configured != 'true'
        run: echo "Cross-Repo Orchestrator is installed but disabled until CIPI_CROSS_REPO_TOKEN is configured."
