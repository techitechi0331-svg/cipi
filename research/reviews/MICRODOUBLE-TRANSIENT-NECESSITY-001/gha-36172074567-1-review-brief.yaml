research_question: Does the current MicroDouble generic transient detector leave enough
  controlled P/B burst coverage unprotected to justify adding a specialised plosive-context
  augmentation experiment?
hypothesis: The generic detector will detect the P/B onset but cover less than 70%
  of the 120 ms controlled burst, while the Vo.Prep-derived context detector will
  strongly identify the burst and preserve the declared negative stress separations.
counter_hypotheses:
- The generic transient detector already covers at least 70% of the controlled P/B
  burst, so augmentation is unnecessary complexity.
- The specialist context detector fails the declared low-vowel/proximity/fry separation
  checks.
- The specialist context detector also fires on the bright consonant case, making
  P/B specificity too weak.
acceptance_criteria:
- Generic plosive peak must be at least 0.50, proving baseline onset detection exists.
- Generic plosive event occupancy above 0.50 must be below 70 percent; otherwise augmentation
  is unnecessary.
- Plosive-context peak on the controlled burst must be at least 0.90.
- Low-vowel and proximity context peaks must each be at most 0.40.
- Fry context peak must remain below 0.75.
- Growl context peak must remain at or above 0.75, preserving the known false-positive
  risk explicitly.
- Bright consonant generic transient peak must be at least 0.70.
- Bright consonant plosive-context peak must remain below 0.75.
rejection_criteria:
- Any declared acceptance condition fails.
- The current generic detector already provides at least 70 percent controlled burst
  coverage.
- The known growl false-positive risk is omitted.
