research_question: >-
  Can a phased richer physical-string model reduce the human-perceived synthetic character
  of Virtual Guitar single notes while preserving the directionally positive strum behavior?

hypothesis_id: HYP-VIRTUAL-GUITAR-PHYSICAL-REALISM-V03
hypothesis: >-
  Three semantically explicit bounded phases—broad, narrow, and refined—covering
  frequency-dependent damping, dispersion/inharmonicity, pick excitation, and bridge/body
  coupling can produce a stronger implementation candidate than the V01 delay loop, after
  which human listening and real-audio comparison remain mandatory.

