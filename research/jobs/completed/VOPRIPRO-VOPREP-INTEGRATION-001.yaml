    and revise the boundary, stress signal, or product interaction before opening
    actual VST3/real-vocal integration.
  retained_findings:
  - Preserve every passed and failed gate by case and sample rate.
  - Preserve module activation magnitudes and downstream VoPriPro GR deltas.
  reusable_findings:
  - Cross-product preparation chains should be screened for neutral false engagement,
    targeted event benefit, post-event recovery, phrase-level movement, and sample-rate
