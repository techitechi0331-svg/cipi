research_question: Does the current Vo.Prep 50% Plosive/Macro/Sibilance chain reduce
  targeted downstream VoPriPro Natural50 reactions without introducing material neutral-signal
  or phrase-level double-processing in a deterministic source-code-translation screen?
hypothesis: Vo.Prep will remain near-neutral on steady vocal material, reduce VoPriPro
  event-driven peak GR on plosive/sibilance cases, and improve phrase spread modestly
  without materially shifting downstream GR after the event.
counter_hypotheses:
- Vo.Prep falsely engages on neutral sustained vocal material and materially changes
  downstream VoPriPro GR.
- Vo.Prep does not reduce plosive- or sibilance-driven VoPriPro GR enough to justify
  the extra stage.
- Vo.Prep event processing leaves a material downstream GR offset after the event.
- Macro Level changes phrase dynamics too much or too little to support the intended
  division of responsibility.
- Cross-product behavior is materially sample-rate dependent.
acceptance_criteria:
- All generated preprocessed samples and downstream gain-reduction trajectories are
  finite.
- Neutral sustained material changes downstream mean GR by no more than 0.25 dB.
- Neutral sustained material causes no more than 0.25 dB Plosive/Sibilance event reduction.
- Plosive Guard engages by at least 0.25 dB on the plosive stress case.
- Vo.Prep improves downstream VoPriPro plosive-event peak GR by at least 0.10 dB.
- Post-plosive downstream mean-GR shift is no more than 0.35 dB.
- Sibilance Guard engages by at least 0.15 dB on the sibilance stress case.
- Vo.Prep improves downstream VoPriPro sibilance-event peak GR by at least 0.02 dB.
- Post-sibilance downstream mean-GR shift is no more than 0.35 dB.
- Macro Level moves the phrase-step case by at least 0.10 dB.
- Phrase RMS spread improves by at least 0.05 dB and no more than 1.50 dB.
- Preprocessed downstream peak-GR sample-rate spread across 44.1/48/96 kHz is no more
  than 0.15 dB.
rejection_criteria:
- Any acceptance condition fails.
