schema_version: "1.0"
track_id: VOCAL-RIDER-REALVOCAL-001
enabled: true
activation_state: ACTIVE_MEASUREMENT
root_research_id: VOCAL_RIDER_01

research_question: >-
  Can the Vocal Rider v0.1 boost-only sample-aligned Headroom Guard and
  proposed Amount50 v0.3 trajectory reduce local phrase-level variation
  without >0 dBFS samples, Amount0 changes, musical section flattening,
  or damage to breaths, consonants, plosives and phrase tails?
hypothesis_id: HYP-VOCAL-RIDER-SAFE-LEVELING-001
hypothesis: >-
  A bounded local-median gain rider with the aligned boost-only safety
  guard can preserve zero-clipping, delayed-unity Amount0 and intended
  phrase dynamics while improving correction depth. Product validation
  requires dedicated real-vocal and Windows VST3 evidence.
minimum_novelty: 0.10
minimum_improvement: 0.01
product_integration: false
human_gate_required: false
human_gate_conditions:
  - LEVEL_MATCHED_HUMAN_LISTENING
  - CUBASE_PRO_14_HOST_CONFIRMATION
  - GUI_EDITOR_CONFIRMATION
  - PRODUCT_ADOPTION_DECISION
  - RELEASE_DECISION

authority_boundaries:
  automatic_final_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
  melon_continuation_is_proposal_only: true
  cipi_evidence_authority: true

dedup_baseline:
  source_repo: techitechi0331-svg/vocal_rider
  source_head: bc346336b5a0cca105e9462468cdea2b53ea3f6d
  evidence_snapshot: research/experiments/VocalRider/status.yaml
  candidate_branch: amount50-v03
  candidate_pull_request: 2
  do_not_reopen:
    - AMOUNT0_DELAY_ONLY_BASELINE
    - BOOST_ONLY_GUARD_CONTRACT
    - FIRST_12_FILE_HOLDOUT
    - FRESH_V03_PRE_GUARD_CHECKPOINT
  rejected_directions:
    - PROMOTE_V03_FROM_PRE_GUARD_CLIPPING_RUN
    - REUSE_PRIOR_HOLDOUT_FOR_FINAL_ACCEPTANCE
    - RELAX_PREDECLARED_THRESHOLDS_AFTER_TEST
    - TREAT_MELON_PROXY_AS_VOCAL_RIDER_REAL_AUDIO_EVIDENCE
    - AUTO_PRODUCT_RELEASE

budget:
  max_loop_depth: 3
  max_runs: 3
  max_total_experiments: 3
  max_candidates: 24
  max_runtime: 300
  max_same_hypothesis_retry: 2
  max_same_architecture_retry: 2
  max_no_improvement_runs: 2

