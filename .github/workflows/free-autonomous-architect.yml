name: Free Autonomous Research Architect

on:
  push:
    branches: [ main ]
    paths:
      - "automation/architect/**"
      - "automation/incubator/**"
      - ".github/workflows/free-autonomous-architect.yml"
  schedule:
    - cron: "43 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cipi-free-autonomous-architect
  cancel-in-progress: false

jobs:
  discover-one-bounded-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Extract unresolved research-gap signals
        id: signals
        run: python automation/architect/scan_signals.py --max-signals 8 --github-output "$GITHUB_OUTPUT"

      - name: Discover bounded research gaps
        id: discover
        run: python automation/architect/discover.py --max-gaps 3 --github-output "$GITHUB_OUTPUT"

      - name: Generate one bounded Adapter Candidate specification
        id: adapter_candidate
        run: python automation/architect/adapter_candidate.py --max-candidates 1 --github-output "$GITHUB_OUTPUT"

      - name: Run one allowlisted Pilot when available
        id: pilot
        if: steps.discover.outputs.top_pilot_proposal != ''
        env:
          PROPOSAL: ${{ steps.discover.outputs.top_pilot_proposal }}
        run: |
          RUN_ID="architect-${GITHUB_SHA:0:12}"
          python automation/architect/pilot.py --proposal "$PROPOSAL" --run-id "$RUN_ID" --github-output "$GITHUB_OUTPUT"

      - name: Route one product opportunity through Incubator
        id: incubator
        if: steps.discover.outputs.top_plugin_proposal != ''
        env:
          PROPOSAL: ${{ steps.discover.outputs.top_plugin_proposal }}
        run: python automation/incubator/discover.py --proposal "$PROPOSAL" --github-output "$GITHUB_OUTPUT"

      - name: Evaluate one measured Plugin candidate
        id: evaluate
        run: python automation/incubator/evaluate.py --max-candidates 1 --github-output "$GITHUB_OUTPUT"

      - name: Run isolated prototype only after evidence-gated INCUBATE
        if: steps.evaluate.outputs.incubate_decision_path != ''
        env:
          PLUGIN_PROPOSAL: ${{ steps.evaluate.outputs.plugin_proposal_path }}
          INCUBATE_DECISION: ${{ steps.evaluate.outputs.incubate_decision_path }}
        run: python automation/incubator/prototype.py --proposal "$PLUGIN_PROPOSAL" --decision "$INCUBATE_DECISION"

      - name: Validate Architect, Incubator and existing research contracts
        run: |
          python tools/validate_architect.py
          python tools/validate_incubator.py
          python tools/validate_research_result.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python tools/validate_research_job.py
          python tools/validate_research.py

      - name: Detect generated work
        id: changes
        env:
          TOP_GAP: ${{ steps.discover.outputs.top_gap_id }}
          ADAPTER_CANDIDATE: ${{ steps.adapter_candidate.outputs.adapter_candidate_id }}
          INCUBATE_COUNT: ${{ steps.evaluate.outputs.incubate_count }}
          SIGNAL_COUNT: ${{ steps.signals.outputs.signal_count }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          WORK_KEY="$TOP_GAP"
          if [ -z "$WORK_KEY" ]; then WORK_KEY="$ADAPTER_CANDIDATE"; fi
          if [ -z "$WORK_KEY" ] && [ "$INCUBATE_COUNT" != "0" ]; then WORK_KEY="INCUBATE"; fi
          if [ -z "$WORK_KEY" ] && [ "$SIGNAL_COUNT" != "0" ]; then WORK_KEY="GAP-SIGNALS"; fi
          if [ -z "$WORK_KEY" ]; then WORK_KEY="ARCHITECT-WORK"; fi
          echo "work_key=$WORK_KEY" >> "$GITHUB_OUTPUT"
          echo "bot_branch=architect-bot/discovery/gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Commit bounded Architect evidence
        if: steps.changes.outputs.has_changes == 'true'
        id: commit
        env:
          BOT_BRANCH: ${{ steps.changes.outputs.bot_branch }}
          PILOT_JOB: ${{ steps.pilot.outputs.pilot_job_id }}
        run: |
          git config user.name "cipi-architect-bot"
          git config user.email "cipi-architect-bot@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git add -A research/architect research/incubator
          if [ -n "$PILOT_JOB" ]; then
            git add -A "research/runs/$PILOT_JOB"
            git add -A "research/knowledge_candidates/$PILOT_JOB"
            git add -A "research/decisions/$PILOT_JOB"
          fi
          git commit -m "submit autonomous architect evidence: ${{ steps.changes.outputs.work_key }}"
          python tools/validate_architect_change_scope.py --base origin/main --head HEAD
          git push --set-upstream origin "$BOT_BRANCH"
          echo "branch=$BOT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open Architect review PR
        id: open_pr
        continue-on-error: true
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.commit.outputs.branch }}
          WORK_KEY: ${{ steps.changes.outputs.work_key }}
        run: |
          gh pr create --base main --head "$BOT_BRANCH" --title "Autonomous architect evidence: $WORK_KEY" --body "Bounded zero-paid CIPI Research Architect pass. It may add non-executable unresolved/blocker signals, at most three catalog-backed Research Gaps, one non-executable Adapter Candidate, one allowlisted pilot, one Plugin Incubator routing decision, and at most one evidence-gated non-final INCUBATE prototype. Unknown themes cannot execute arbitrary generated code. No production repository, release, adapter-registry self-mutation, Cubase/listening closure, PROMOTE or CONFIRMED action is automatic."

      - name: Create review issue when Actions PR creation is disabled
        if: steps.changes.outputs.has_changes == 'true' && steps.open_pr.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.commit.outputs.branch }}
          WORK_KEY: ${{ steps.changes.outputs.work_key }}
        run: |
          gh issue create --title "Autonomous architect ready: $WORK_KEY" --body "A bounded Architect wave is ready on branch $BOT_BRANCH. Review signals, gaps/proposals, Adapter Candidate specifications, research evidence and any evidence-gated isolated prototype. Production adoption remains review-only."

      - name: No new architect work
        if: steps.changes.outputs.has_changes != 'true'
        run: echo "No new bounded Architect or Incubator evidence was generated."
