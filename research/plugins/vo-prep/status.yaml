  - Plosive 0.70 must pass the locked phone-aligned real-singing R3 relevance/false-trigger screen before any product threshold proposal.
  - Sibilance 0.60 must pass the locked phone-aligned real-singing R3 relevance/false-trigger screen before any product threshold proposal.
  - A phone-aligned singing source with clearly acceptable use terms must be available before automated R3 corpus execution; NUS-48E is not auto-downloaded while its applicable use terms remain insufficiently verified for this product-development context.
  - Actual Vo.Prep -> VoPriPro VST3 binary-chain execution is blocked until the CIPI Actions cross-repository credential can read both private product repositories.
  - Cross-module interaction still needs broader real-vocal validation after the actual VST3 deterministic chain gate.
  - Cubase Pro 14 release-candidate validation is pending.
  - Only derived measurements, never client recordings, may be committed.

