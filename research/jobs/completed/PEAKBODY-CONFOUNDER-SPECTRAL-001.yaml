schema_version: '1.0'
job_id: PEAKBODY-CONFOUNDER-SPECTRAL-001
state: COMPLETED
track:
  id: PEAKBODY_01
  path: research/experiments/PeakBody
research_question: Is an AirGuard-style normalized high-band guard alone sufficient
  to stop PeakBody broadband crest from treating sibilance and breath-like noise as
  peak-preservation events without damaging voiced harmonic transients?
hypothesis: A simple normalized high-band guard can reduce sibilant/breath false peak-preservation
  to 25 percent or less of baseline while retaining at least 85 percent of bright
  high-F0 harmonic transient activation.
counter_hypotheses:
- Bright high-F0 harmonic material has enough high-band energy to be mistaken for
  sibilance by the spectral-only guard.
- The guard reduces standard voiced transient preservation.
- The guard changes steady-vowel behavior or low-frequency plosive-like transients.
- The guard behaves inconsistently across sample rates.
baseline:
- peakbody_revision02_broadband_crest
variants:
- airguard_style_spectral_ratio_guard
metrics:
- noise_false_preserve_ratio_max
- standard_voiced_retention_min
- bright_high_f0_retention_min
- steady_mean_t_delta_max
- plosive_retention_min
- matrix_complete
- all_numeric_finite
acceptance:
- all numeric outputs are finite
- all seven synthetic confounder cases are present at 44.1/48/96/192 kHz
- sibilant/breath candidate high-transient activation is no more than 25 percent of
  broadband-crest baseline
- standard low/high voiced transient activation retains at least 90 percent of broadband-crest
  baseline
- bright high-F0 harmonic transient activation retains at least 85 percent of broadband-crest
  baseline
- steady-vowel mean transient factor changes by no more than 0.05
- low-frequency plosive-like transient activation retains at least 85 percent of broadband-crest
  baseline
rejection:
- any acceptance invariant fails
- the required confounder/sample-rate matrix is incomplete
max_runs: 1
timeout_minutes: 5
random_seed: 2026092501
experiment_adapter: peakbody_spectral_guard_stress_v1
allowed_operations:
- read_repo_measurement_script
- execute_allowlisted_adapter
- write_derived_measurements
prohibited_operations:
- arbitrary_shell
- network_write
- raw_audio_commit
- main_push
- confidence_change
- stage_change
- knowledge_promotion
- product_release
rejection_record:
  reason: If the declared gate fails, the simple normalized high-band guard is insufficient
    for the tested PeakBody confounder scope and must not be promoted as a vocal-safe
    detector guard.
  retained_findings:
  - Preserve the full per-case/per-sample-rate measurements, including whichever voiced
    or noise-like class caused rejection.
  - A successful noise reduction result does not override a bright-voiced false suppression.
  reusable_findings:
  - Spectral balance alone may be insufficient to distinguish noise-like sibilance
    from bright harmonic high-register singing.
  revisit_if:
  - A periodicity/voicing protection term is added.
  - A stronger harmonic-motion or F0-aware feature becomes available.
  scope: Synthetic PeakBody confounder stress only.
lineage:
  related_jobs:
  - PEAKBODY-REV02-POLICY-001
continuation:
  on_reject:
  - automation/job_templates/PEAKBODY-CONFOUNDER-PERIODICITY-002.yaml
  on_accept: []
