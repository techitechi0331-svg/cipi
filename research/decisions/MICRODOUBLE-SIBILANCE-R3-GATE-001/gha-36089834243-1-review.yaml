rationale: >-
  The predeclared threshold family preserved R1/R2 negative evidence, selected
  activation 0.62 by the declared highest-passing rule, and reproduced every
  technical gate on a disjoint five-file holdout. This is sufficient to
  authorize development-branch integration of the sibilance detector only.
  It is not sufficient for product release or CONFIRMED shared knowledge.
declared_rejection_criteria:
  - Any declared acceptance condition fails.
  - Negative results are missing or rewritten.
  - The frozen threshold differs from the predeclared highest-passing rule.
triggered_criteria: []
retained_findings:
  - "R1 remains MEASURED FAIL because processing strength was incorrectly used as a recall proxy."
  - "R2 activation 0.65 remains MEASURED FAIL: 5.728143 percentage-point recall gap exceeded the fixed 5-point limit."
  - "R3 activation 0.64 remains failed evidence."
  - "R3 activation 0.62 and 0.60 passed selection; the conservative highest-passing rule froze 0.62."
  - "Frozen 0.62 holdout recall was 94.744268% versus baseline 97.464097%."
  - "Frozen 0.62 holdout non-event occupancy was 0.364273% versus baseline 10.083470%."
  - "Frozen 0.62 holdout maximum onset was 23.310658 ms."
reusable_findings:
  - "Detector event recall and processing strength must be evaluated as separate quantities for precision-biased adaptive vocal protection."
  - "When a transfer candidate narrowly misses a gate, a small predeclared parameter family plus disjoint holdout can test calibration without silently weakening the original acceptance criterion."
revisit_if:
  - "Post-integration product regressions fail."
  - "Real-vocal renders reveal dulling, air loss, consonant pumping or worse phase/level behavior."
  - "Target-machine listening rejects the candidate."
  - "A broader labelled multilingual corpus contradicts the controlled injected-event result."
