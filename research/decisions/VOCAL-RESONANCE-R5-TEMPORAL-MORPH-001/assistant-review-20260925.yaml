rationale: R5 materially reduced measured clean false triggers while preserving Top-5 and strong-effect Top-5, but did not improve ranking and may be confounded by regularization/threshold selection, source overlap, seed choice, or bundled morphology features.
scope: Temporal morphology as semantic-ranker context/abstention evidence only; no product promotion.
declared_rejection_criteria: []
triggered_criteria: []
retained_findings:
- Temporal morphology Top-5 equaled static R2 at 25.0 percent.
- Strong-effect Top-5 equaled static R2 at 33.33 percent.
- Internal clean false trigger decreased from 37.5 to 12.5 percent.
- External clean false trigger decreased from 17.5 to 0 percent in the measured R5 cohort.
reusable_findings:
- Context features can improve abstention without improving target ranking; the two objectives must be measured separately.
- Clean false-trigger improvements must be audited for cohort overlap and calibration/hyperparameter confounds before promotion.
revisit_if:
- A leakage-free, multi-seed, same-C ablation fails to reproduce the abstention improvement.
