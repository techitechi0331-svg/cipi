schema_version: "1.0"
job_id: VL2A-PHASE01H-SNAPSHOT-GATE-001
state: QUEUED
track:
  id: VL2A_PHASE01H_LINEAMP
  path: research/plugins/vl2a
research_question: "Does the imported Phase 01-H compiled and objective-vocal evidence remain internally consistent enough to pass the line-amplifier machine gate before human listening?"
hypothesis: "The reduced Phase 01-H line amplifier will reproduce the declared compiled FR/output-impedance/stability gates and the isolated VocalSet AB will preserve identical compressor max-GR across all paired renders."
counter_hypotheses:
  - "The imported snapshot is corrupted or incomplete."
  - "The candidate fails one or more predeclared compiled block gates."
  - "The paired vocal renders show a compressor GR mismatch, indicating the AB is not isolated to the line amplifier."
baseline:
  - historical_line_amp
variants:
  - phase01h_line_amp
metrics:
  - checksum_ok
  - fr_max_abs_30_15k_db
  - thd_low_level_below_mid_and_high
  - zout_min_ohm
  - zout_max_ohm
  - sample_rate_gain_spread_db
  - stress_all_finite
  - cpu_realtime_factor_at_192k
  - ab_case_count
  - ab_min_correlation
  - ab_max_matched_peak_delta_db
  - ab_gr_pair_max_abs_diff_db
  - raw_audio_present
acceptance:
  - "all imported CSV files match the committed SHA256 ledger"
  - "30 Hz through 15 kHz compiled magnitude response stays within +/-0.1 dB"
  - "1 kHz THD remains finite and rises from the tiny-signal point toward the 0 dBFS test instead of retaining the old fixed low-level floor"
  - "estimated secondary source impedance stays within 145..155 ohms"
  - "44.1..192 kHz 1 kHz gain spread is <=0.01 dB"
  - "all declared stress rows remain finite"
  - "standalone block benchmark is >=100x realtime at 192 kHz in the recorded benchmark environment"
  - "all 9 expected breathy/straight/forte x PR0/50/75 AB cases are present"
  - "minimum matched-pair correlation is >=0.995"
  - "maximum matched-candidate peak delta is <=0.5 dB"
  - "paired Baseline/Candidate max-GR difference is <=0.000001 dB"
  - "no raw WAV audio exists in the CIPI VL2A evidence snapshot"
rejection:
  - "any checksum, compiled gate, AB-integrity gate, finiteness gate, or raw-audio safety gate fails"
max_runs: 1
timeout_minutes: 2
random_seed: 3310201
experiment_adapter: vl2a_phase01h_snapshot_gate_v1
allowed_operations:
  - read_committed_vl2a_measurement_snapshot
  - verify_sha256
  - compute_declared_metrics
  - write_derived_measurements
prohibited_operations:
  - arbitrary_shell
  - network_access
  - network_write
  - main_push
  - knowledge_promotion
  - raw_audio_write
  - product_release
knowledge_candidate:
  claim: "In the imported VL2A Phase 01-H evidence, a reduced line-amplifier replacement can satisfy the compiled block gates while preserving identical max gain reduction in line-amplifier-isolated VocalSet renders, enabling objective isolation before human level-matched listening."
  evidence_type: MEASURED
  scope: "VL2A Phase 01-H imported compiled measurement snapshot and nine VocalSet objective AB cases only; this does not establish subjective preference or LA-2A hardware identity."
  promotion_requested: PROVISIONAL
