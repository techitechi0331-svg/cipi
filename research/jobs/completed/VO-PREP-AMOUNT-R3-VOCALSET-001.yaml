knowledge_candidate:
  claim: A speaker-disjoint selection safety margin can make a mathematically linear
    DesiredGR-scaling Amount control generalize across a second independent public
    singing corpus without relaxing the frozen Vo.Prep ripple gate.
  evidence_type: HYPOTHESIS
  scope: Vo.Prep Amount Revision 3 using eight disjoint VocalSet singers, two qualifying
    files per singer, frozen 4-second Learn-and-Lock, 8/70 ms ballistics, and unchanged
    final 0.080 dB ripple gate.
  promotion_requested: PROVISIONAL
