measured_or_observed:
  - id: OBS-VG-REALISM-V11-CODE
    evidence_class: MEASURED
    statement: >-
      Current product-repo candidate PhysicalRealismString is a 24-mode modal oscillator model with
      frequency-dependent modal decay, static dispersion, a pluck-position comb, a deterministic
      short noise transient, simple bridge gain, and simplified two-state body coloration.
    files:
      - Source/PhysicalModel/Audio/PhysicalRealismString.h
      - Source/PhysicalModel/Audio/PhysicalRealismString.cpp

  - id: OBS-VG-LIVING-STRING-CODE
    evidence_class: MEASURED
    statement: >-
      LivingString currently stores persistent state, ring/mute state, excitation history and scalar
      damping/energy, but its physical state is still much simpler than a full distributed vibrating
      string and is not yet a complete coupled guitar-body/string/contact simulation.
    files:
      - Source/PhysicalModel/Strings/LivingString.h
      - Source/PhysicalModel/Strings/LivingString.cpp

  - id: OBS-VG-GESTURE-CODE
    evidence_class: MEASURED
    statement: >-
      GestureEngine currently uses bounded deterministic timing/force/angle envelopes for strokes and
      control descriptors for left-hand shifts. These are useful causal controls but are not yet a
      physically solved player-string contact model.
    files:
      - Source/Performance/Gesture/GestureEngine.h
      - Source/Performance/Gesture/GestureEngine.cpp

  - id: OBS-VG-FINGERING-CODE
    evidence_class: MEASURED
    statement: >-
      FingeringSolver currently selects standard-tuning string/fret positions using a simple movement
      cost and 24-fret bound. It does not yet model hand anatomy, chord-specific fretboard strategy,
      string choice timbre, position preference, or phrase-level guitarist intent at production depth.
    files:
      - Source/Performance/Fingering/FingeringSolver.h
      - Source/Performance/Fingering/FingeringSolver.cpp

  - id: OBS-VG-HUMAN-REALISM-V11
    evidence_class: HUMAN_LISTENING
    statement: "The latest rendered Realism-v1.1 candidate was judged far below the final target."
    source: research/plugins/virtual-guitar/human-evidence/VG-HUMAN-LISTENING-20260929-002.yaml

