schema_version: "1.0"
adapters:
  peakbody_legacy_model_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Replay stored PeakBody legacy stress research as reproducible negative evidence."
  original_vocal_pre_measurement_gate_v1:
    tracks:
      - UA610_ORIGINAL_VOCAL_PRE
    max_timeout_minutes: 2
    network_required: false
    purpose: "Verify the preserved Original Vocal Pre v0.1 Windows measurement snapshot, retain negative results, and apply fixed candidate-vs-simple-baseline gates."

  vl2a_phase01h_snapshot_gate_v1:
    tracks:
      - VL2A_PHASE01H_LINEAMP
    max_timeout_minutes: 2
    network_required: false
    purpose: "Validate the imported VL2A Phase 01-H compiled measurement and objective VocalSet AB snapshots without raw audio or product mutation."
