schema_version: "1.0"
job_id: VIRTUAL-GUITAR-PICKUP-ELECTRONICS-STRAT-001
state: QUEUED
priority: 55

track:
  id: VIRTUAL_GUITAR_PICKUP_ELECTRONICS_RESEARCH
  path: research/plugins/virtual-guitar/research-tracks

research_phase: RESEARCH_ONLY
activation_contract_ref: PICKUP-ELECTRONICS-ACTIVATION-GATES-002

research_question: >-
  Without waiting for Reference DI convergence, what pickup observation, magnetic transduction,
  pickup electrical-network, SSS/HSS switching and volume/tone/selector model classes are
  physically/electrically justified for the first STRAT_STYLE family?

hypothesis: >-
  Pickup/Electronics research can progress independently from final Physical Guitar product
  convergence when it is kept at research/reference-model level. Product integration remains
  separately gated by stable upstream observation and electrical-port contracts.

counter_hypotheses:
  - Pickup observation requires a different authoritative string state than the current architecture can expose.
  - Simple RLC pickup models are insufficient across the required operating domain.
  - SSS and HSS require materially different boundaries that cannot share a versioned interface.
  - Cable/load interaction materially changes conclusions enough that isolated pickup ranking is misleading.

baseline:
  - existing Physical Realism evidence retained without modification
  - no adopted Pickup/Electronics product layer
  - Reference DI explicitly treated as downstream of Guitar Electrical Port

variants:
  - STRAT_STYLE_SSS
  - STRAT_STYLE_HSS_BRIDGE_HUMBUCKER
  - LINEAR_MAGNETIC_TRANSDUCTION_CANDIDATE
  - SPATIAL_APERTURE_CANDIDATE
  - PASSIVE_NETWORK_MODEL_CANDIDATES

metrics:
  - pickup_observation_position_dependence
  - harmonic_structure_change_by_pickup_position
  - source_impedance_vs_frequency
  - resonance_frequency
  - resonance_q
  - volume_tone_selector_load_sensitivity
  - sss_hss_boundary_compatibility
  - deterministic_reference_output
  - evidence_provenance_completeness

acceptance:
  - research evidence is classified SOURCE_FACT/MEASURED/INFERRED/HYPOTHESIS/REJECTED
  - pickup observation is not implemented as a post-EQ preset
  - pickup electrical model complexity is selected by measurement/falsification rather than assumption
  - SSS and HSS remain explicit research configurations
  - HSS bridge preserves a future Coil Split extension point without fixing final topology
  - Reference DI is not used as an upstream prerequisite
  - no product repository write occurs under this job

rejection:
  - generic EQ is presented as magnetic pickup physics
  - unknown electrical values are invented
  - Reference DI is treated as pre-pickup truth
  - downstream Amp/Cab/Mic coloration is used to validate pickup realism
  - research attempts product adoption without explicit integration authority

depends_on_jobs: []

activation_contract:
  current_state_semantics: >-
    Research is READY under PICKUP-ELECTRONICS-ACTIVATION-GATES-002. This job is research-only
    and must not write product DSP. Product integration is a separate dependency-gated job.
  must_not_preempt:
    - VIRTUAL-GUITAR-PHYSICAL-REALISM-004

max_runs: 3
timeout_minutes: 20

allowed_operations:
  - inspect_current_physical_guitar_evidence
  - research_pickup_observation_models
  - research_magnetic_transduction_models
  - research_pickup_electrical_network_models
  - research_sss_hss_topologies
  - research_volume_tone_selector_loading
  - design_electrical_test_harness
  - design_reference_models
  - write_cipi_research_evidence

prohibited_operations:
  - product_repository_write
  - interrupt_realism_004
  - auto_promote_subjective_tone_claim
  - auto_release
  - implement_final_coil_split_calibration_without_new_evidence
  - declare_reference_di_converged

review_policy:
  required_human_gates:
    - FINAL_SUBJECTIVE_PICKUP_TONE
    - REAL_DI_AB_BEFORE_PRODUCT_ADOPTION
    - COIL_SPLIT_PRODUCT_ADOPTION_WHEN_LATER_IMPLEMENTED

authority_boundaries:
  automatic_product_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false

knowledge_candidate:
  claim: >-
    Pickup/Electronics research is causally upstream of Reference DI and may proceed before
    product integration while remaining authority-bounded.
  evidence_type: INFERRED
  promotion_requested: NONE
