research_question: Can a causal dual-timescale phrase estimator reduce phrase-scale
  vocal level error without chasing short consonant/breath events more than a bounded
  one-timescale baseline?
hypothesis: A clipped-innovation dual-timescale estimator will reduce steady phrase-level
  error and downstream macro-level variance while materially reducing short-event
  movement and preserving phrase contrast.
counter_hypotheses:
- The one-timescale baseline performs equivalently once phrase transitions are excluded
  from the steady-state error metric.
- The slower candidate only appears stable because it flattens true phrase-to-phrase
  contrast.
- Short-event protection comes at the cost of excessive phrase tracking error.
acceptance_criteria:
- Synthetic phrase/event matrix is complete and all outputs are finite.
- Candidate phrase-level MAE is <= 65 percent of baseline.
- Candidate maximum short-event movement is <= 3.0 dB and <= 50 percent of baseline.
- Candidate downstream macro-level variance is <= 50 percent of baseline.
- Candidate phrase-contrast error is <= 0.8 dB.
rejection_criteria:
- Candidate phrase-level MAE exceeds 65 percent of baseline.
- Candidate maximum short-event movement exceeds 3.0 dB or 50 percent of baseline.
- Candidate downstream macro-level variance exceeds 50 percent of baseline.
- Candidate phrase-contrast error exceeds 0.8 dB.
