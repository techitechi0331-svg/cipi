research_question: Does exact injected-target Top-K materially overstate the candidate-frequency
  accuracy needed for a narrow resonance-suppression action?
hypothesis: 'Across both predeclared seeds, static Top-5 candidates will produce action-equivalent
  target attenuation substantially more often than they exactly contain the injected
  target: at Q=12 a fixed -2 dB candidate-centered cut will yield >=1 dB target attenuation
  in at least 70 percent of generator-hit cases, exceed exact Top-5 hit rate by at
  least 20 percentage points, preserve at least 70 percent action-equivalent coverage
  on strong-effect cases, and achieve at least 60 percent median attenuation relative
  to the nearest-candidate oracle. Q=8 and Q=20 must each retain at least a 10-point
  action-equivalence gain over exact hit rate.'
counter_hypotheses:
- Exact target membership is a good proxy for useful frequency placement; action-equivalent
  hit rate is not materially higher.
- Only broad Q settings make near misses useful, so exact semantic ranking remains
  necessary for selective suppression.
- Strong-effect cases still require exact target ranking even if weak cases tolerate
  nearby candidates.
acceptance_criteria:
- 'for each seed at static Top-5 Q=12: action-equivalent rate >= 0.70'
- 'for each seed at static Top-5 Q=12: action-equivalent minus exact hit >= 0.20'
- 'for each seed at static Top-5 Q=12: strong action-equivalent rate >= 0.70'
- 'for each seed at static Top-5 Q=12: median oracle-relative attenuation >= 0.60'
- 'for each seed at static Top-5 Q=8: action-equivalent minus exact hit >= 0.10'
- 'for each seed at static Top-5 Q=20: action-equivalent minus exact hit >= 0.10'
rejection_criteria:
- any seed fails any primary or Q-sensitivity criterion
