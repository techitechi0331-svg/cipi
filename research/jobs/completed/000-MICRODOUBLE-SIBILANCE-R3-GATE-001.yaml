- product_release
knowledge_candidate:
  claim: In the controlled MicroDouble transfer study, separating detection from protection
    strength and calibrating only the hybrid detector activation threshold to 0.62
    produced a candidate that passed predeclared selection and disjoint holdout gates
    while preserving prior negative results.
  evidence_type: MEASURED
  scope: Controlled public-vocal plus deterministic injected-event protocol only;
    product integration, subjective naturalness, multilingual sibilance generalization,
    Cubase verification and release remain unproven.
  promotion_requested: PROVISIONAL
review_policy:
  required_human_gates:
  - Review R1/R2 negative-result preservation before development integration.
  - Product regressions and listening after integration.
