schema_version: '1.0'
job_id: VOCAL-RESONANCE-R5B-MORPH-STABILITY-001
state: COMPLETED
track:
  id: VOCAL_RESONANCE_FORMAL
  path: research/plugins/vocal-resonance
research_question: Does the R5 temporal-morphology clean-abstention improvement survive
  source-overlap auditing, a second injection seed, feature-family ablation, and a
  same-C control?
hypothesis: Full morphology will preserve Top-5 and strong-effect Top-5 while reducing
  external clean false triggers on both seeds, including when morphology is trained
  with the same regularization C selected by the static ranker.
counter_hypotheses:
- R5's 0% external-clean false trigger is partly or wholly caused by source overlap.
- The apparent improvement is seed/schedule-specific and does not replicate.
- The improvement comes from a different selected C or threshold rather than morphology.
- Only one morphology subfamily carries the effect, or the bundled result is unstable.
baseline:
- static_r2_style_safe_negative
variants:
- run_length_morphology
- distribution_morphology
- full_temporal_morphology_tuned_C
- full_temporal_morphology_same_static_C
metrics:
- top3
- top5
- mrr
- top5_effect_gte3
- internal_clean_false_trigger
- external_clean_false_trigger
- source_overlap_count
- paired_external_fpr_difference
- paired_external_bootstrap_95
- paired_improvement_regression_counts
acceptance:
- source basename overlap count = 0 on both seeds
- full morphology Top-5 >= static Top-5 on both seeds
- full morphology strong-effect Top-5 >= static on both seeds
- full morphology external clean false-trigger <= static - 0.10 on both seeds
- same-C full morphology Top-5 >= static on both seeds
- same-C full morphology strong-effect Top-5 >= static on both seeds
- same-C full morphology external clean false-trigger <= static - 0.05 on both seeds
- paired bootstrap upper bound for candidate-minus-static external FPR <= 0 on both
  seeds for tuned and same-C morphology
rejection:
- any source basename overlap is detected
- Top-5 or strong-effect Top-5 regresses on either seed
- external clean false-trigger improvement fails the declared margin on either seed
- same-C control fails the declared margin or ranking-preservation criteria
- paired external-clean bootstrap upper bound is positive on either seed
max_runs: 1
timeout_minutes: 20
random_seed: 20261004
experiment_adapter: vocal_resonance_temporal_morphology_stability_v1
allowed_operations:
- stream_public_vocalset_in_runner_memory
- controlled_eq_injection
- derived_metric_write
- deterministic_bootstrap
prohibited_operations:
- arbitrary_shell
- main_push
- confidence_change
- current_stage_change
- raw_audio_write
- paid_api
- product_release
knowledge_candidate:
  claim: Generic temporal morphology provides a leakage-free and calibration-robust
    clean-vocal abstention benefit without semantic-ranking regression.
  evidence_type: HYPOTHESIS
  scope: Vocal resonance semantic-ranker candidate context.
  promotion_requested: HYPOTHESIS
latest_run: gha-36080499046-1
