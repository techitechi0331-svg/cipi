milestones:
  - Candidate-discovery synthetic development and locked holdout.
  - Real-vocal controlled-injection gate on 20 identifiable VocalSet singers.
  - Preliminary per-singer-skip confirmation cohort retained as historical evidence.
  - Stricter explicit-exclusion real-vocal confirmation cohort verified.
  - Candidate budget K=20 locked for current discovery scaffold.
  - Candidate budget K=15 rejected for current discovery scaffold.
  - Semantic Ranker v0.4 measured NO-GO.
  - Pairwise Semantic Ranker v0.4R.1 measured and rejected.
  - Causal safe-negative Ranker v0.4R.2 improved Top-5 but remained NO-GO.
  - Motion-coherence Ranker v0.4R.3 measured and rejected.
  - Clean-negative Audit-001 measured strong technique/singer variation; the earlier lip-trill-specific failure clue did not reproduce.
  - Temporal Morphology R5 preserved Top-5/strong-effect Top-5 while materially reducing measured clean false triggers; retained only as a falsification candidate.
  - R5b multi-seed/same-C/ablation stability audit rejected the full Temporal Morphology bundle as unstable across seeds.
  - R6 run-length post-ranker veto failed its predeclared two-seed retention gate and is rejected as a validated abstention stage.
  - R7 identifiability oracle passed its diagnostic gate and isolated a large single-view information gap.
  - R8 local-patch single-view proxy failed its predeclared two-seed retention gate and is rejected.

unresolved:
  - Semantic ranking has not yet separated unwanted resonance from legitimate harmonics/formants/consonants.
  - Merge-20 superiority over Local-20 is unconfirmed; strict confirmation measured both at 85 percent recall.
  - High-F0/formant-overlap semantic ambiguity remains.
  - Clean hard-negative false-trigger behavior remains too high to authorize suppression DSP.
  - Strong-effect target ranking remains below the research gate.
  - The tested v0.4R.3 motion-coherence bundle regressed ranking and is rejected; other temporal evidence remains unproven.
  - Legacy ACF upper-quantile pitch estimates are not accepted as high-pitch ground truth; Re-audit-002 obtained a usable YIN-style high-pitch subset and did not find elevated false triggers there.
  - Technique-specific protection is not supported by the independent re-audit; the remaining false-trigger problem is treated as a generic candidate-context problem.
  - R5b found zero source overlap, but the full morphology benefit did not survive the second injection seed and therefore is rejected as a full ranker feature bundle.
  - Run-length-only morphology reduced clean false triggers in R5b, but R6 veto reproduced only a 2.5-point external-clean reduction on seed 20261003 and therefore failed the 5-point minimum.
  - R6 target-action retention was underpowered: locked-test baseline target actions were 1 and 0 across the two seeds, with 0 strong-effect actions in both; the apparent 100-percent retention is not accepted as meaningful protection evidence.
  - R7 oracle conditional Top-5 reached 100.0 percent and 92.59 percent across the two seeds versus 26.67 percent and 40.74 percent for the frozen single-view static ranker.
  - R7 oracle strong-effect conditional Top-5 reached 100 percent on both seeds, while the frozen static ranker reached 36.36 percent and 28.57 percent.
  - The R7 paired clean/injected oracle is research-only and cannot be used directly in the final plugin; the unresolved blocker is finding deployable single-view proxies for the causal delta signal.
  - R8 local-patch conditional Top-5 was unchanged at 26.67 percent on seed 20261003 and regressed from 40.74 to 37.04 percent on seed 20261013.
  - R8 local-patch external clean false-trigger worsened from 17.5 to 32.5 percent and from 25.0 to 42.5 percent, so raw local patch/curvature/shoulder features are rejected for this scope.
  - R5 did not improve Top-5/Top-3/MRR enough to satisfy the semantic-ranking product gate.
  - Suppression topology, maximum cut, and frequency-dependent ballistics are not numerically specified.

next_stage: research
why_next: "R8 showed that static local patch shape does not recover the R7 causal-information gap and substantially worsens clean-vocal false triggers. The next bounded question is whether a fixed-Hz resonance leaves a more distinctive time-consistent relative-gain signature against its local spectral neighborhood than natural moving harmonics/formants do."
next_confirmation: "Whether single-view temporal transfer-consistency features at a fixed candidate frequency improve conditional Top-5 across both seeds, close part of the R7 oracle gap, and preserve external clean false-trigger performance."
blockers:
  - No production suppressor or VST3 until MODULE 1 semantic ranking passes.
