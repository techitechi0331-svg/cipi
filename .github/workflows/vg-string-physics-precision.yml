name: Virtual Guitar String Physics Precision

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "CIPI action id"
        required: true
      melon_sha:
        description: "Validated MELON precision-analysis SHA"
        required: true

permissions:
  contents: read

concurrency:
  group: vg-string-physics-precision-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  precision:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout pinned MELON
        id: melon
        uses: actions/checkout@v4
        with:
          repository: techitechi0331-svg/melon
          ref: ${{ inputs.melon_sha }}
          path: _melon
          token: ${{ secrets.CIPI_CROSS_REPO_TOKEN }}
          persist-credentials: false

      # Python's full installer modifies HKLM on Windows self-hosted runners.
      # Use the official embeddable distribution in RUNNER_TEMP instead.
      - name: Prepare isolated Python 3.12.10 without registry writes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
          # Published on the official Python 3.12.10 release page.
          $expectedMd5 = "fe8ef205f2e9c3ba44d0cf9954e1abd3"
          $pythonRoot = Join-Path $env:RUNNER_TEMP "vg-python-3.12.10"
          $archive = Join-Path $env:RUNNER_TEMP "vg-python-3.12.10.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actualMd5 = (Get-FileHash -Path $archive -Algorithm MD5).Hash.ToLowerInvariant()
          if ($actualMd5 -ne $expectedMd5) {
            throw "Python archive checksum mismatch"
          }
          New-Item -ItemType Directory -Force -Path $pythonRoot | Out-Null
          Expand-Archive -Path $archive -DestinationPath $pythonRoot -Force
          $python = Join-Path $pythonRoot "python.exe"
          if (-not (Test-Path $python)) { throw "Portable Python executable missing" }
          # This research task uses stdlib only; include MELON in Python's
          # isolated module search path without enabling global site packages.
          @("python312.zip", ".", (Join-Path $env:GITHUB_WORKSPACE "_melon")) |
            Set-Content -Path (Join-Path $pythonRoot "python312._pth") -Encoding ascii
          $version = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "Python 3.12.10") {
            throw "Portable Python version check failed: $version"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $pythonRoot

      - name: Verify exact MELON SHA
        shell: pwsh
        run: |
          if ("${{ steps.melon.outputs.commit }}" -ne "${{ inputs.melon_sha }}") {
            throw "MELON SHA mismatch"
          }

      - name: Run precision unit tests
        working-directory: _melon
        shell: pwsh
        run: |
          python -m unittest tests.test_egfxset_string_physics_precision -v

      - name: Analyze EGFxSet same-MIDI string physics
        working-directory: _melon
        shell: pwsh
        run: |
          $cache = Join-Path $env:USERPROFILE ".melon\egfxset-cache"
          $out = Join-Path $env:GITHUB_WORKSPACE "results\string-physics-precision"
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python -m melon.egfxset_string_physics_precision --cache-root "$cache" --output-dir "$out"

      - name: Enforce evidence boundary
        shell: pwsh
        run: |
          python -c "import json,pathlib; p=pathlib.Path(r'results/string-physics-precision/string-physics-precision-evidence.json'); d=json.loads(p.read_text()); assert d['evidence_ready'] is True; assert d['valid_coordinate_count']==4; b=d['interpretation_boundary']; assert b['exact_string_gauge_is_known'] is False; assert b['pickup_amplitude_is_raw_string_truth'] is False; assert b['product_candidate_adopted'] is False; assert d['authority']['product_repository_write'] is False; print('VG_STRING_PHYSICS_PRECISION=PASS')"
          $forbidden = Get-ChildItem -Path "results\string-physics-precision" -Recurse -File | Where-Object { $_.Extension -match '^[.](wav|flac|aif|aiff|mp3|zip)$' }
          if ($forbidden) { throw "Raw/media artifact persistence is forbidden" }

      - name: Upload precision evidence
        uses: actions/upload-artifact@v4
        with:
          name: vg-string-physics-precision-${{ inputs.job_id }}-${{ github.run_id }}
          path: results/string-physics-precision/*.json
          if-no-files-found: error
          retention-days: 30
