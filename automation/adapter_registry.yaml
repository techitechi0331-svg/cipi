schema_version: "1.0"
adapters:
  peakbody_legacy_model_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Replay stored PeakBody legacy stress research as reproducible negative evidence."
  peakbody_revision02_policy_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Replay PeakBody Revision 02 model policy across sample rates against a fixed-timing simple baseline."
  peakbody_spectral_guard_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Falsify or support a simple AirGuard-style normalized high-band guard against PeakBody crest confounders."
  peakbody_periodicity_guard_stress_v1:
    tracks:
      - PEAKBODY_01
    max_timeout_minutes: 5
    network_required: false
    purpose: "Test whether periodicity protection resolves bright-harmonic false suppression left by the simple spectral guard."
  original_vocal_pre_measurement_gate_v1:
    tracks:
      - UA610_ORIGINAL_VOCAL_PRE
    max_timeout_minutes: 2
    network_required: false
    purpose: "Verify the preserved Original Vocal Pre v0.1 Windows measurement snapshot, retain negative results, and apply fixed candidate-vs-simple-baseline gates."

  black76_ratio_p2a_compare_v1:
    tracks:
      - 1176_FAMILY_FORMAL
    max_timeout_minutes: 5
    network_required: false
    purpose: "Deterministically compare imported Black76 baseline and P2-A static-ratio evidence against the committed supplemental target."

  vocal_resonance_motion_coherence_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Stream public VocalSet in runner memory and compare static safe-negative ranking against F0/harmonic-motion coherence without persisting raw audio."

  vl2a_phase01h_snapshot_gate_v1:
    tracks:
      - VL2A_PHASE01H_LINEAMP
    max_timeout_minutes: 2
    network_required: false
    purpose: "Validate the imported VL2A Phase 01-H compiled measurement and objective VocalSet AB snapshots without raw audio or product mutation."

  vocal_resonance_clean_negative_audit_v1:
    tracks:
      - VOCAL_RESONANCE_FORMAL
    max_timeout_minutes: 12
    network_required: true
    purpose: "Audit disjoint VocalSet clean negatives by technique, singer, and F0 quantiles without persisting raw audio."

  vl2a_phase01h_checksum_diagnosis_v1:
    tracks:
      - VL2A_PHASE01H_LINEAMP
    max_timeout_minutes: 2
    network_required: false
    purpose: "Diagnose imported VL2A evidence checksum mismatches and distinguish exact-content changes from line-ending normalization."

  microdouble_product_v03_gate_v1:
    tracks:
      - MICRODOUBLE_01
    max_timeout_minutes: 3
    network_required: false
    purpose: "Verify the committed Vocal One-Knob Doubler v0.3 product-measurement snapshot against the v0.2 simple baseline and fixed technical gates without raw audio or product mutation."
