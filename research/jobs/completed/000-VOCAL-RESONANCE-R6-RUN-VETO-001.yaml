schema_version: '1.0'
job_id: VOCAL-RESONANCE-R6-RUN-VETO-001
state: COMPLETED
track:
  id: VOCAL_RESONANCE_FORMAL
  path: research/plugins/vocal-resonance
research_question: Can run-length-only temporal morphology work as a separate post-ranker
  veto/abstention gate that reduces clean-vocal false triggers without reordering
  candidates or vetoing true injected resonances?
hypothesis: Across both predeclared injection seeds, a validation-selected run-length
  veto will reduce independent clean false-trigger rate by at least 5 percentage points
  while retaining at least 95 percent of baseline target actions and strong-effect
  target actions.
counter_hypotheses:
- The R5b run-length benefit was caused by ranking interactions and disappears when
  morphology is isolated as a veto.
- A veto that materially reduces clean false triggers also rejects too many true resonance
  actions.
- The clean false-trigger reduction is seed-specific and does not reproduce across
  both predeclared seeds.
baseline:
- unchanged_static_r2_ranker_no_veto
variants:
- run_length_only_post_ranker_veto
metrics:
- external_clean_false_trigger
- paired_external_clean_difference
- target_action_keep
- strong_action_keep
- ranking_order_unchanged
- source_overlap_count
- static_top5
- static_strong_top5
acceptance:
- 'for each seed: source overlap count == 0'
- 'for each seed: ranking order is unchanged'
- 'for each seed: veto external clean false-trigger <= baseline - 0.05'
- 'for each seed: paired external-clean bootstrap upper bound <= 0'
- 'for each seed: target action keep >= 0.95'
- 'for each seed: strong-effect target action keep >= 0.95'
- 'for each seed: veto creates zero new external clean false triggers'
rejection:
- any seed fails the 5 percentage point clean false-trigger reduction
- any seed target action keep < 0.95
- any seed strong-effect action keep < 0.95
- candidate ranking is changed
- source overlap is detected
max_runs: 1
timeout_minutes: 20
random_seed: 20261023
experiment_adapter: vocal_resonance_run_length_veto_v1
allowed_operations:
- stream_public_vocalset_in_runner_memory
- controlled_eq_injection
- derived_metric_write
prohibited_operations:
- arbitrary_shell
- main_push
- confidence_change
- current_stage_change
- raw_audio_write
- paid_api
- product_release
knowledge_candidate:
  claim: Run-length morphology may be useful as a separate post-ranker abstention/veto
    signal even when it is not stable enough to modify semantic ranking scores.
  evidence_type: HYPOTHESIS
  scope: Vocal resonance clean-false-trigger control after a frozen semantic candidate
    ranker.
  promotion_requested: HYPOTHESIS
latest_run: gha-36142911813-1
