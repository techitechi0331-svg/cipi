unresolved:
  - Breath events and breathy voiced phonation must be separated reliably.
  - Singing-specific false positives on sibilance, fricatives, room noise, and consonants are not measured.
  - Accompanied-vocal / bleed robustness is unknown.
  - The appropriate action is not yet selected: attenuation, dynamic spectral shaping, or event-level gain envelope.
  - Intentional expressive breaths need a preservation rule rather than blanket removal.

next_stage: review
why_next: "Singing-specific breath-event data and breathy-phonation acoustic measures are available; the next step is to separate the two problems and compare lightweight realtime detector features."
next_confirmation: "Whether pause context, periodicity, spectral shape, and temporal envelope can identify unvoiced breath events without suppressing voiced breathy singing."

blockers:
