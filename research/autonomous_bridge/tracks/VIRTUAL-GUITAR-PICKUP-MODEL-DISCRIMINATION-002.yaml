research_question: >-
  Can bounded synthetic experiments prove that the planned measurements can distinguish
  point versus finite-aperture pickup observation, low-order versus higher-order pickup
  electrical model classes, and cable/load interaction without selecting a hardware
  model winner from synthetic data?

hypothesis_id: HYP-VG-PICKUP-MODEL-DISCRIMINATION
hypothesis: >-
  A synthetic method-identifiability experiment can validate whether the measurement
  design has enough discriminating power to justify acquisition of real/source-backed
  pickup, cable and load evidence. Passing this track must stop the synthetic loop and
  must not adopt a pickup model, component values, tone, or product DSP.

