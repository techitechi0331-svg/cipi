schema_version: "1.0"
job_id: PEAKBODY-PLOSIVE-PROTECTION-001
state: QUEUED
track:
  id: PEAKBODY_01
  path: research/experiments/PeakBody
research_question: "Can independent plosive-context protection restore weakly periodic plosive transients while preserving the strong-periodicity veto's noise rejection, and is full Vo.Prep v2.2 contextual probability materially better than a single LF-concentration feature?"
hypothesis: "At least one plosive-protection candidate will restore synthetic plosive retention to >=0.85 without sacrificing voiced/noise safety; the full contextual detector will only remain a candidate if it materially outperforms the simpler LF-concentration veto."
counter_hypotheses:
  - "Simple LF concentration will over-protect LF-contaminated sibilance."
  - "Full contextual plosive probability will not detect the PeakBody synthetic plosive strongly enough."
  - "Both candidates will restore plosives but damage sibilance/breath rejection."
  - "The rejected strong-periodicity-veto predecessor will remain the only way to preserve private noise rejection, requiring a different architecture."
baseline:
  - rejected_strong_periodicity_veto_without_plosive_protection
variants:
  - simple_lf_concentration_plosive_veto
  - full_voprep_contextual_plosive_veto
metrics:
  - standard_voiced_retention_min
  - bright_high_retention_min
  - noisy_voiced_retention_min
  - noise_false_preserve_ratio_max
  - lf_contaminated_sibilant_retention_max
  - plosive_retention_min
  - steady_mean_t_delta_max
  - low_nontarget_mean_t_delta_max
  - low_nontarget_protection_max
  - plosive_simple_evidence_min
  - plosive_full_evidence_min
  - all_finite
  - full_vs_simple
  - qualified_candidates
acceptance:
  - "at least one of the two plosive-protection candidates satisfies every locked synthetic hard gate"
  - "standard voiced retention minimum is at least 0.90"
  - "bright/startup voiced retention minimum is at least 0.95"
  - "6 dB SNR noisy-voiced retention minimum is at least 0.90"
  - "sibilant/breath/long-S false-preservation maximum is no more than 0.25"
  - "LF-contaminated sibilant false-preservation maximum is no more than 0.35"
  - "low-frequency plosive retention minimum is at least 0.85"
  - "steady-vowel mean transient-factor delta is no more than 0.03"
  - "all outputs are finite"
rejection:
  - "neither simple LF-concentration nor full contextual plosive protection passes every locked synthetic hard gate"
max_runs: 1
timeout_minutes: 5
random_seed: 2026092603
experiment_adapter: peakbody_plosive_protection_v1
allowed_operations:
  - read_repo_measurement_script
  - execute_allowlisted_adapter
  - write_derived_measurements
prohibited_operations:
  - arbitrary_shell
  - network_write
  - raw_audio_commit
  - main_push
  - confidence_change
  - stage_change
  - knowledge_promotion
  - product_release
knowledge_candidate:
  claim: "PeakBody should separate harmonic/voiced protection from plosive-context protection; full contextual plosive detection is only justified if it measurably outperforms a simple LF-concentration veto."
  evidence_type: MEASURED
  scope: "Deterministic synthetic PeakBody independent plosive-protection matrix only."
  promotion_requested: PROVISIONAL
lineage:
  related_jobs:
    - PEAKBODY-CONTEXTUAL-NOISE-GUARD-001
    - PEAKBODY-CONFOUNDER-PERIODICITY-002
    - PEAKBODY-PRIVATE-VOCAL-GUARD-001
