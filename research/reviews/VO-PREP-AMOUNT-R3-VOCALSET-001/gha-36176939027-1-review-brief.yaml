research_question: Can a predeclared DesiredGR-scaling Amount mapping with a selection-side
  ripple safety margin pass the unchanged Vo.Prep real-vocal gates on a completely
  different VocalSet singer corpus after Amount R2 narrowly failed HUST holdout ripple?
hypothesis: At least one target100 value among 5.0, 5.2, 5.3, 5.4, and 5.5 dB will
  pass all original Amount safety gates plus a 0.075 dB selection ripple margin on
  four VocalSet selection singers, and the frozen selected candidate will then pass
  the unchanged 0.080 dB ripple gate and all other original gates on four different
  VocalSet holdout singers.
counter_hypotheses:
- No candidate passes the stricter selection-margin gate.
- A candidate passes selection but fails the untouched VocalSet holdout, showing the
  R2 near-miss was not solved robustly.
- Lowering target100 enough to pass ripple causes the Amount 100 mean-GR lower bound
  to fail.
- DesiredGR scaling remains too ripple-sensitive across singers even when its mathematical
  Amount response is linear.
acceptance_criteria:
- Candidate target values and offsets are fixed before VocalSet evaluation.
- Selection uses exactly f1, f2, m1, and m2 with two qualifying files per singer.
- Final holdout uses exactly f3, f4, m3, and m4 with two qualifying files per singer.
- No singer appears in both selection and final holdout.
- Selection candidate must pass every original Amount gate with GR ripple tightened
  to no more than 0.075 dB.
- Among selection-margin passers, choose the highest target100 value before opening
  final holdout.
- Amount 0 final holdout produces exact zero gain reduction.
- Amount 25 final-holdout mean GR is between 0.75 and 2.25 dB and p95 GR is no more
  than 4.0 dB.
- Amount 50 final-holdout mean GR is between 2.5 and 3.75 dB, p95 GR is no more than
  6.0 dB, and fraction above 10 dB is no more than 0.5 percent.
- Amount 75 final-holdout mean GR is between 3.75 and 5.5 dB and p99 GR is no more
  than 9.0 dB.
- Amount 100 final-holdout mean GR is between 5.0 and 7.0 dB, p99 GR is no more than
  10.0 dB, and fraction above 10 dB is no more than 2 percent.
- Every nonzero final-holdout Amount has aggregate GR ripple no more than 0.080 dB.
- Final-holdout cross-singer mean-GR standard deviation at Amount 50 is no more than
  1.0 dB.
- Final-holdout mean and p95 gain reduction remain monotonic with Amount.
- Raw VocalSet audio is not persisted into CIPI artifacts.
rejection_criteria:
- No candidate passes all selection-margin gates.
- The frozen selected candidate fails any unchanged original gate on the untouched
  final holdout singers.
- Any required singer has fewer than two qualifying files.
- Any selection/final-holdout singer overlap occurs.
- Raw public audio is persisted into the evidence branch.
