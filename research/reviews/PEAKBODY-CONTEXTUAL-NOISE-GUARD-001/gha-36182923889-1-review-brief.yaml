research_question: Can replacing proportional periodicity discount with a strong-periodicity
  veto improve PeakBody noise-like rejection without harming bright/noisy voiced or
  plosive preservation, and does adding Vo.Prep contextual sibilance probability justify
  its extra complexity?
hypothesis: The simple strong-periodicity veto will satisfy the locked synthetic safety
  gates; contextual sibilance evidence will only be retained if it adds at least a
  meaningful extra improvement without harming another hard gate.
counter_hypotheses:
- Strong-periodicity veto will over-suppress plosives or noisy voiced material.
- Contextual sibilance evidence will suppress bright vowels or noisy voiced material.
- The complex contextual detector will not materially improve on the simpler veto.
acceptance_criteria:
- at least one candidate satisfies every locked synthetic hard gate
- standard voiced retention minimum is at least 0.90
- bright/startup voiced retention minimum is at least 0.95
- 6 dB SNR noisy-voiced retention minimum is at least 0.90
- sibilant/breath/long-S false-preservation maximum is no more than 0.25
- plosive retention minimum is at least 0.85
- steady-vowel mean transient-factor delta is no more than 0.03
- all outputs are finite
rejection_criteria:
- neither simple_veto nor context_veto satisfies every locked synthetic hard gate
