research_question: Can vocal presence be increased from masking context without becoming
  a static high-mid boost?
hypothesis: A bounded context-dependent presence law can retain most of a static presence-EQ
  masking-proxy benefit while avoiding unnecessary movement when the vocal is already
  unmasked.
counter_hypotheses:
- Level-matched static presence EQ is equally selective once the movement budget is
  matched.
- The contextual law collapses toward a near-static boost across the declared matrix.
- Reducing non-target movement sacrifices too much masked-case proxy improvement.
acceptance_criteria:
- Synthetic matrix is complete and all numeric outputs are finite.
- Candidate retains at least 80 percent of static-EQ masked proxy improvement.
- Candidate mean non-target movement is <= 1.0 dB.
- Candidate non-target movement is <= 35 percent of static-EQ non-target movement.
- Candidate masked-case mean gain is >= 0.50 dB.
- Candidate gain standard deviation is >= 0.50 dB so the law has not collapsed to
  a static boost.
- Candidate maximum gain is <= 3.0 dB.
rejection_criteria:
- Candidate retains less than 80 percent of static-EQ masked proxy improvement.
- Candidate non-target movement exceeds 1.0 dB or 35 percent of the static baseline.
- Candidate collapses toward a static gain law or exceeds the declared 3 dB movement
  budget.
