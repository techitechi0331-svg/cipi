claim: Bounded event duration is a useful defensive pattern for short vocal-event detectors because it prevents sustained special phonation from remaining under continuous event-specific gain reduction after an onset-like false trigger.
evidence_type: INFERRED
scope: Inference from Vo.Prep Plosive 120 ms and Sibilance 350 ms safeguards plus synthetic stress tests; appropriate cap duration is detector- and product-specific.
