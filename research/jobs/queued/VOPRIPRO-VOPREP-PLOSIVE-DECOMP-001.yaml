  - VOPRIPRO-VOPREP-INTEGRATION-002
track:
  id: VOPRIPRO_FORMAL
  path: research/plugins/vopripro
research_question: Is the failed v2 plosive post-event interaction primarily attributable to Macro Level rather than Plosive Guard itself, while Plosive-only processing remains localized and near-neutral to downstream VoPriPro Natural50 gain reduction?
hypothesis: On the source-derived plosive positive control, Plosive-only processing will audibly-relevantly attenuate the event while keeping VoPriPro event/post-event GR nearly unchanged, whereas Macro-only processing will account for most of the v2 combined post-event GR shift.
counter_hypotheses:
  - Plosive Guard itself causes the material post-event VoPriPro GR shift.
  - Plosive Guard materially changes VoPriPro event peak GR despite the 80 Hz sidechain HPF.
  - Macro Level does not account for most of the combined post-event shift.
  - Plosive and Macro interact non-additively enough that simple module attribution is invalid.
  - The decomposition is materially sample-rate dependent.
baseline:
  - dry_into_vopripro_natural50
variants:
  - plosive_only_into_vopripro_natural50
  - macro_only_into_vopripro_natural50
  - plosive_macro_into_vopripro_natural50
metrics:
  - all_finite
  - plosive_only_min_probability
  - plosive_only_min_reduction_db
  - plosive_only_min_event_audio_rms_attenuation_db
  - plosive_only_max_abs_event_vopripro_peak_gr_change_db
  - plosive_only_max_abs_post_event_vopripro_mean_gr_delta_db
  - plosive_only_max_abs_pre_event_audio_rms_delta_db
  - macro_only_min_abs_post_event_vopripro_mean_gr_delta_db
  - macro_only_min_abs_macro_gain_db
  - plosive_macro_min_macro_residual_fraction
  - plosive_macro_max_additive_residual_db
  - plosive_macro_post_event_shift_sr_spread_db
acceptance:
  - All generated samples and VoPriPro gain-reduction trajectories are finite.
  - Plosive-only positive-control probability reaches at least 0.80 at every tested sample rate.
  - Plosive-only reduction reaches at least 0.50 dB at every tested sample rate.
  - Plosive-only event RMS attenuation is at least 0.25 dB at every tested sample rate.
  - Plosive-only absolute VoPriPro event peak-GR change is no more than 0.10 dB.
  - Plosive-only absolute post-event VoPriPro mean-GR shift is no more than 0.15 dB.
  - Plosive-only pre-event audio RMS movement is no more than 0.10 dB.
  - Macro-only absolute post-event VoPriPro mean-GR shift is at least 0.25 dB.
  - Macro-only maximum gain movement reaches at least 0.50 dB.
  - Macro-only shift accounts for at least 75 percent of the Plosive+Macro post-event shift magnitude.
  - The residual from additive Plosive plus Macro attribution is no more than 0.10 dB.
  - Plosive+Macro post-event shift spread across 44.1/48/88.2/96 kHz is no more than 0.05 dB.
rejection:
  - Any localization, attribution, finite-state, or sample-rate gate fails.
max_runs: 1
