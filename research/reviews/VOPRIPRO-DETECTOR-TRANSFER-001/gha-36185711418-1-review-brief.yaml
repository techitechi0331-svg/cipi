research_question: Does the Vo.Prep-derived Slow-RMS/Fast-Peak fusion deserve a same-corpus
  real-vocal VoPriPro experiment when compared with the current Natural50 detector
  under otherwise matched compressor conditions?
hypothesis: The Vo.Prep-derived max(Slow RMS, Fast Peak - 6 dB) detector will preserve
  sustained-body control while avoiding materially greater short-transient, plosive-like,
  sibilant-like, or breath-noise gain reduction than the current VoPriPro Natural50
  35/65 Peak/RMS detector.
counter_hypotheses:
- The transfer candidate produces materially more short-transient gain reduction than
  the current VoPriPro detector.
- The transfer candidate increases gain reduction on problem-event proxies enough
  to worsen false-trigger risk.
- The transfer candidate fails to preserve comparable sustained-body control after
  equal reference calibration.
- The transfer candidate exhibits material sample-rate dependence.
acceptance_criteria:
- All generated detector and gain-reduction values are finite.
- Sustained-body active mean GR differs from the current detector by no more than
  0.25 dB after equal 3 dB reference calibration.
- Candidate extra peak GR on 10 ms and 30 ms transient proxies is no more than +0.25
  dB versus the current detector.
- Candidate extra peak GR on plosive-like, sibilant-like and breath-noise proxies
  is no more than +0.50 dB versus the current detector.
- On the body-plus-transient case, candidate peak GR remains at least 50 percent of
  the current detector peak GR so the detector has not collapsed into body-only behavior.
- Candidate peak-GR sample-rate spread across 44.1/48/96/192 kHz is no more than 0.10
  dB.
rejection_criteria:
- Any numeric trajectory is non-finite.
- Sustained-body active mean GR differs by more than 0.25 dB after equal reference
  calibration.
- Candidate adds more than 0.25 dB peak GR on either short-transient proxy.
- Candidate adds more than 0.50 dB peak GR on a problem-event proxy.
- Candidate body-plus-transient peak GR falls below 50 percent of the current detector.
- Candidate peak-GR sample-rate spread exceeds 0.10 dB.
