schema_version: '1.0'
job_id: VO-PREP-AMOUNT-R5-SOFT-RANGE-001
state: QUEUED
track:
  id: VO_PREP_FORMAL
  path: research/plugins/vo-prep
research_question: Can a simple smooth post-ballistics GR Range repair the R4 high-Amount ripple failure without changing the frozen Vo.Prep detector, 1.5:1/18 dB curve, 8/70 ms ballistics, or explicit Learn-time Threshold solve?
hypothesis: At least one ceiling among 10, 9, or 8 dB with a 6 dB unity region will pass all original Amount gates and the 0.075 dB selection ripple ceiling on f7/f8/m7/m8, improve Amount-100 ripple by at least 15 percent versus the no-Range R4 baseline, preserve gain invariance, and then pass the unchanged 0.080 dB final ripple gate on fresh f9/m9/m10/m11 holdout singers.
counter_hypotheses:
  - Soft Range does not reduce ripple enough without reopening ballistics.
  - Range strong enough to pass ripple damages the 25/50/75 Amount mapping.
  - Range causes cross-singer inconsistency or high-GR safety problems.
  - The no-Range R4 baseline remains the better simplicity/quality trade-off.
baseline:
  - R4 explicit Learn-time Threshold solve with no GR Range.
variants:
  - Smooth Range start 6 dB, asymptotic ceiling 10 dB.
  - Smooth Range start 6 dB, asymptotic ceiling 9 dB.
  - Smooth Range start 6 dB, asymptotic ceiling 8 dB.
metrics:
  - baseline_amount100_ripple_db
  - selected_candidate
  - selected_ceiling_db
  - candidate_summary
  - holdout_accessed
  - holdout_passes
  - holdout_amount100_ripple_db
  - range_start_db
  - raw_audio_persisted
acceptance:
  - Selection uses only f7, f8, m7 and m8 with two qualifying files per singer.
  - Fresh holdout uses only f9, m9, m10 and m11 with two qualifying files per singer.
  - Holdout audio is not streamed or decoded until a candidate passes every selection, complexity and gain-invariance gate.
  - Amount 0 is exact bypass.
  - Amount 25 mean GR is 0.75 to 2.25 dB and p95 is no more than 4 dB.
  - Amount 50 mean GR is 2.5 to 3.75 dB, p95 is no more than 6 dB and fraction above 10 dB is no more than 0.5 percent.
  - Amount 75 mean GR is 3.75 to 5.5 dB and p99 is no more than 9 dB.
  - Amount 100 mean GR is 5.0 to 7.0 dB, p99 is no more than 10 dB and fraction above 10 dB is no more than 2 percent.
  - Selection aggregate ripple is no more than 0.075 dB at every nonzero Amount.
  - Final holdout aggregate ripple is no more than 0.080 dB at every nonzero Amount.
  - Cross-singer mean-GR standard deviation at Amount 50 is no more than 1.0 dB.
  - Mean and p95 GR are monotonic with Amount.
  - Selection mapping RMSE is no more than 0.50 dB.
  - Final holdout mapping RMSE is no more than 0.65 dB.
  - Learn-solver residual is no more than 0.02 dB.
  - Selected candidate improves Amount-100 ripple by at least 15 percent versus R4 no-Range baseline.
  - Gain-invariance Threshold and post-lock mean-GR errors are each no more than 0.005 dB across +/-12 dB.
  - Among passing candidates choose the highest ceiling, preserving the least intrusive Range.
  - Raw VocalSet audio is not persisted into CIPI artifacts.
rejection:
  - No Range candidate passes every selection and complexity gate.
  - Passing requires relaxing a predeclared gate.
  - Fresh holdout fails any unchanged product gate.
  - Holdout data is accessed before selection is frozen.
  - Raw public audio is persisted.
max_runs: 1
timeout_minutes: 20
random_seed: 20260926
experiment_adapter: voprep_amount_mapping_r5_v1
allowed_operations:
  - stream_public_audio_to_runner_memory
  - execute_allowlisted_adapter
  - write_derived_measurements
prohibited_operations:
  - arbitrary_shell
  - raw_audio_persistence
  - main_push
  - confidence_change
  - current_stage_change
  - automatic_promotion
  - product_dsp_mutation
  - product_release
knowledge_candidate:
  claim: A smooth high-GR Range may repair high-Amount time-domain ripple without reopening a validated compressor core.
  evidence_type: HYPOTHESIS
  scope: Frozen Vo.Prep transparent core with explicit Learn solve; selection f7/f8/m7/m8 and fresh holdout f9/m9/m10/m11.
  promotion_requested: HYPOTHESIS
review_policy:
