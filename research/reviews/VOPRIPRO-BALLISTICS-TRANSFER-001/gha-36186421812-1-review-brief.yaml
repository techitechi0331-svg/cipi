research_question: Should the Vo.Prep fixed 8 ms attack / 70 ms release pair advance
  to same-corpus real-vocal VoPriPro testing against current Natural50 20/110 ms timing?
hypothesis: The 8/70 ms candidate will improve 100 ms body convergence and release
  recovery without materially increasing 10-30 ms transient GR, long-body deviation,
  repeated-phrase ripple, or sample-rate dependence.
counter_hypotheses:
- The faster attack over-compresses 10-30 ms transients.
- The faster release increases phrase-to-phrase GR modulation.
- The candidate does not improve 100 ms body control enough to justify the timing
  change.
acceptance_criteria:
- All trajectories are finite.
- 10 ms extra peak GR <= 0.35 dB.
- 30 ms extra peak GR <= 0.50 dB.
- 100 ms extra peak GR >= 0.25 dB.
- 800 ms active mean GR difference <= 0.15 dB.
- Repeated-phrase ripple increase <= 0.10 dB.
- 200 ms release residual is no more than 0.05 dB above baseline.
- Peak-GR sample-rate spread <= 0.10 dB.
rejection_criteria:
- Any acceptance condition fails.
