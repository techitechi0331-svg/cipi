      - amount0_exact_delay_only
      - no_proxy_quality_promotion
      - no_auto_product_adoption
      - keep_human_host_gates
    experiment_type: VOCAL_RIDER_GAIN_CONTROL_PROXY_SCREEN
    scope:
      - vocal_rider
      - gain_trajectory
      - headroom_safety

