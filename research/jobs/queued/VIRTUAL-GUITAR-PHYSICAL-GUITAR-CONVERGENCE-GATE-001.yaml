schema_version: "1.0"
job_id: VIRTUAL-GUITAR-PHYSICAL-GUITAR-CONVERGENCE-GATE-001
state: QUEUED
priority: 90
track:
  id: VIRTUAL-GUITAR-PHYSICAL-GUITAR-CONVERGENCE-GATE-001
  path: research/plugins/virtual-guitar/research-tracks
research_phase: INTEGRATION_PREREQUISITE_GATE
research_question: >-
  Does the measured v1.1 physical-guitar baseline preserve string/fret identity strongly
  enough to permit downstream Pickup/Electronics product integration research?
hypothesis: >-
  The physical model is integration-ready only if same-MIDI notes produced from different
  string/fret coordinates are not collapsed to identical output.
counter_hypotheses:
  - MIDI pitch alone is sufficient physical identity.
  - String/fret identity may be repaired downstream in Pickup/Electronics.
baseline:
  - completed VIRTUAL-GUITAR-V11-BASELINE-MEASURE-001 evidence
variants:
  - CURRENT_V11_PHYSICAL_GUITAR_BASELINE
metrics:
  - same_midi_identity_collapse_count
  - deterministic_repeatability
acceptance:
  - completed baseline evidence exists
  - deterministic repeatability passes
  - no same-MIDI string/fret identity collapse remains
rejection:
  - any same-MIDI string/fret pair renders byte-identical output
  - baseline evidence is missing or invalid
max_runs: 1
timeout_minutes: 5
experiment_adapter: virtual_guitar_physical_convergence_gate_v1
allowed_operations:
  - inspect_committed_baseline_evidence
  - write_gate_evidence
prohibited_operations:
  - product_repository_write
  - automatic_product_integration
  - automatic_knowledge_promotion
authority_boundaries:
  automatic_product_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
