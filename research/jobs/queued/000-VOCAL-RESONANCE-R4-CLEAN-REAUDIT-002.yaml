schema_version: '1.0'
job_id: VOCAL-RESONANCE-R4-CLEAN-REAUDIT-002
state: QUEUED
track:
  id: VOCAL_RESONANCE_FORMAL
  path: research/plugins/vocal-resonance
research_question: Does the clean false-trigger technique concentration replicate on excerpts excluded from Audit-001 and across multiple exercise families, and does a conservative YIN-style pitch proxy provide credible high-pitch coverage?
hypothesis: The fast-piano/fast-forte clean false-trigger concentration will remain at least 15 percentage points above the other represented techniques on an independent exercise-balanced cohort, while conservative pitch analysis will retain at least six reliable p90-F0 >=400 Hz excerpts.
counter_hypotheses:
- The apparent technique concentration was specific to the Audit-001 arpeggio/singer sample and collapses on an independent exercise-balanced cohort.
- Singer identity explains more of the false-trigger variation than technique family.
- The legacy ACF high-pitch coverage was dominated by octave/search-boundary errors and conservative pitch analysis yields too few high-pitch cases.
baseline:
- static_r2_style_safe_negative_frozen_from_audit001
variants:
- independent_exercise_balanced_clean_reaudit
metrics:
- overall_clean_false_trigger
- false_trigger_by_technique
- false_trigger_by_singer
- false_trigger_by_exercise_family
- technique_false_trigger_spread
- fast_piano_forte_minus_other
- yin_p90_ge_400_count
- yin_p90_ge_400_false_trigger
- old_acf_p90_ge900_count
- old_acf_p95_ge900_count
- acf_yin_disagreement_gt300c
- prior_excerpt_overlap_count
acceptance:
- audit contains at least 24 clean excerpts
- at least 4 technique categories are represented
- at least 2 exercise families are represented
- at least 20 excerpts have YIN-proxy reliable fraction >=0.35
- at least 6 excerpts have YIN-proxy p90-F0 >=400 Hz
- no selected basename overlaps Audit-001
rejection:
- fewer than 24 usable clean excerpts
- fewer than 4 techniques
- fewer than 2 exercise families
- fewer than 20 YIN-resolved excerpts
- fewer than 6 YIN-proxy p90-F0 >=400 Hz excerpts
- any basename overlaps Audit-001
max_runs: 1
timeout_minutes: 12
random_seed: 20261002
experiment_adapter: vocal_resonance_clean_negative_reaudit_v2
allowed_operations:
- stream_public_vocalset_in_runner_memory
- yin_proxy_pitch_measurement
- derived_metric_write
prohibited_operations:
- arbitrary_shell
- main_push
- confidence_change
- current_stage_change
- raw_audio_write
- paid_api
- product_release
knowledge_candidate:
  claim: Clean false-trigger concentration by vocal technique persists across independent exercise-balanced real-vocal excerpts when pitch coverage is measured with a conservative YIN-style proxy.
  evidence_type: HYPOTHESIS
  scope: Vocal resonance semantic-ranker hard-negative design and subgroup measurement.
  promotion_requested: HYPOTHESIS
