schema_version: "1.0"
job_id: VIRTUAL-GUITAR-PICKUP-ELECTRONICS-STRAT-001
state: QUEUED
priority: 55

track:
  id: VIRTUAL_GUITAR_PICKUP_ELECTRONICS_RESEARCH
  path: research/plugins/virtual-guitar/research-tracks

research_phase: RESEARCH_EVIDENCE_FOUNDATION
activation_contract_ref: PICKUP-ELECTRONICS-ACTIVATION-GATES-002
experiment_adapter: virtual_guitar_pickup_electrical_foundation_v1

research_question: >-
  Without waiting for Reference DI convergence, is there sufficient source-backed evidence
  to define competing Pickup Observation, magnetic-transduction, pickup-electrical,
  SSS/HSS and cable/load model classes and a falsifiable measurement plan without
  prematurely adopting any one model?

hypothesis: >-
  Manufacturer topology documents plus peer-reviewed pickup/cable research are sufficient
  to establish a bounded research foundation while explicitly retaining both low-order
  equivalent-circuit and higher-order counter-hypotheses for later measurement.

counter_hypotheses:
  - Available sources are too specimen-specific or secondary to support a bounded research foundation.
  - A low-order lumped pickup model is already proven sufficient and no higher-order counter-hypothesis is needed.
  - A distributed pickup model is already proven necessary and simpler candidates can be discarded without testing.
  - Cable/load interaction is negligible enough to omit from the Guitar Electrical Port contract.
  - Reference DI must exist before Pickup/Electronics research can begin.

baseline:
  - existing Physical Realism evidence retained without modification
  - no adopted Pickup/Electronics product layer
  - no adopted pickup circuit model
  - no adopted cable constants
  - Reference DI explicitly treated as downstream of Guitar Electrical Port

variants:
  - POINT_VS_FINITE_APERTURE_OBSERVATION
  - LINEAR_VS_DISTANCE_DEPENDENT_MAGNETIC_TRANSDUCTION
  - LOW_ORDER_VS_HIGHER_ORDER_PICKUP_NETWORK
  - SSS_VS_HSS_TOPOLOGY
  - CAPACITANCE_DOMINANT_VS_FULL_RLC_CABLE_SENSITIVITY

metrics:
  - source_hierarchy_coverage
  - manufacturer_topology_coverage
  - peer_reviewed_pickup_model_coverage
  - peer_reviewed_cable_loading_coverage
  - higher_order_counter_hypothesis_coverage
  - evidence_classification_coverage
  - candidate_model_class_coverage
  - rejected_shortcut_coverage
  - authority_boundary_integrity

acceptance:
  - at least two manufacturer topology sources cover SSS and HSS
  - peer-reviewed evidence covers pickup observation/transduction/electrical behavior
  - peer-reviewed evidence covers passive guitar cable/load interaction
  - credible counter-evidence prevents low-order RLC from being declared final by assumption
  - competing candidate model classes remain explicit
  - Reference DI is not used as an upstream prerequisite
  - no specimen-specific Fender value is universalized
  - no product repository write or tone/fidelity adoption occurs

rejection:
  - source hierarchy is insufficient for a bounded measurement plan
  - generic EQ is presented as magnetic pickup physics
  - cable is reduced to post-EQ without network-equivalence evidence
  - low-order or distributed pickup architecture is preselected without falsification
  - unknown electrical values are invented
  - Reference DI is treated as pre-pickup truth
  - downstream Amp/Cab/Mic coloration is used to validate pickup realism
  - research attempts product adoption without explicit integration authority

depends_on_jobs: []

activation_contract:
  current_state_semantics: >-
    Research is READY under PICKUP-ELECTRONICS-ACTIVATION-GATES-002. This first run validates
    the evidence foundation and competing model classes only. It must not write product DSP.
    Measurement/model-discrimination work follows as a separate bounded continuation.
  must_not_preempt:
    - VIRTUAL-GUITAR-PHYSICAL-REALISM-004

max_runs: 3
timeout_minutes: 20

allowed_operations:
  - inspect_current_physical_guitar_evidence
  - inspect_committed_manufacturer_and_peer_reviewed_source_records
  - classify_pickup_observation_models
  - classify_magnetic_transduction_models
  - classify_pickup_electrical_network_models
  - classify_sss_hss_topologies
  - classify_cable_load_interaction_models
  - design_falsifiable_measurement_requirements
  - write_cipi_research_evidence

prohibited_operations:
  - product_repository_write
  - interrupt_realism_004
  - adopt_final_pickup_model
  - freeze_unsourced_component_values
  - auto_promote_subjective_tone_claim
  - auto_release
  - implement_final_coil_split_calibration_without_new_evidence
  - declare_reference_di_converged

review_policy:
  required_human_gates:
    - FINAL_SUBJECTIVE_PICKUP_TONE
    - REAL_DI_AB_BEFORE_PRODUCT_ADOPTION
    - COIL_SPLIT_PRODUCT_ADOPTION_WHEN_LATER_IMPLEMENTED

authority_boundaries:
  automatic_product_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false

knowledge_candidate:
  claim: >-
    Pickup/Electronics research is causally upstream of Reference DI and can begin from a
    source-backed multi-model evidence foundation while product integration remains gated.
  evidence_type: INFERRED
  scope: "Research-order, candidate-model and measurement-planning semantics only; not a tone/fidelity claim."
  promotion_requested: HYPOTHESIS
