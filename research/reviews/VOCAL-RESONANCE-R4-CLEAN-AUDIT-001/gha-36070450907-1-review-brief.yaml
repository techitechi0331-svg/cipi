research_question: Which vocal techniques and pitch regimes dominate clean false triggers
  for the current static safe-negative resonance ranker, and does the current benchmark
  under-cover high-pitch singing?
hypothesis: Clean false triggers will concentrate in one or more specific vocal-technique
  or high-pitch stress subgroups rather than being uniformly distributed, and a broader
  disjoint clean cohort will contain enough p90-F0 >=400 Hz cases to measure that
  behavior.
counter_hypotheses:
- False triggers are broadly distributed across techniques and singers, implying the
  current feature space is globally miscalibrated rather than subgroup-specific.
- The available VocalSet audit cohort still does not provide enough high-pitch cases,
  so a dedicated high-note stress cohort must be designed before high-F0 claims can
  be tested.
acceptance_criteria:
- audit contains at least 24 disjoint clean excerpts
- dataset label IDs are resolved to technique names
- at least 4 technique categories are represented
- at least 6 excerpts have voiced F0 p90 >= 400 Hz
rejection_criteria:
- fewer than 24 usable clean excerpts
- label mapping cannot be resolved
- fewer than 4 technique categories
- fewer than 6 high-pitch stress excerpts under the predeclared p90 >=400 Hz definition
