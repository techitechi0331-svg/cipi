  A complete integrity-checked 690-note EGFxSet clean manifest with extracted per-capture acoustic
  features can provide MEASURED reference evidence for model-vs-real A/B without treating dataset
  normalization, synthetic proxy scores, or a different guitar family as hardware fidelity truth.

