schema_version: "1.0"
job_id: PEAKBODY-CONFOUNDER-PERIODICITY-002
state: QUEUED
track:
  id: PEAKBODY_01
  path: research/experiments/PeakBody
research_question: "Can a periodicity-protected normalized high-band guard reduce noise-like crest confounders without suppressing bright high-F0 harmonic transients?"
hypothesis: "Adding a periodicity/voicing protection term to the normalized high-band guard will retain at least 85 percent of bright high-F0 transient activation while still reducing sibilant/breath false peak-preservation to 25 percent or less of the broadband-crest baseline."
counter_hypotheses:
  - "Periodicity protection restores bright harmonic transients but also protects noise-like events too strongly."
  - "The periodicity proxy is unstable across sample rates."
  - "The combined guard materially changes steady-vowel behavior."
  - "Low-frequency plosive-like transients are incorrectly suppressed."
baseline:
  - peakbody_revision02_broadband_crest
  - spectral_only_highband_guard
variants:
  - spectral_highband_guard_with_periodicity_protection
metrics:
  - noise_false_preserve_ratio_max
  - standard_voiced_retention_min
  - bright_high_f0_retention_min
  - steady_mean_t_delta_max
  - plosive_retention_min
  - voiced_periodicity_min
  - noise_periodicity_max
  - matrix_complete
  - all_numeric_finite
acceptance:
  - "all numeric outputs are finite"
  - "all seven synthetic confounder cases are present at 44.1/48/96/192 kHz"
  - "sibilant/breath candidate high-transient activation is no more than 25 percent of broadband-crest baseline"
  - "standard low/high voiced transient activation retains at least 90 percent of broadband-crest baseline"
  - "bright high-F0 harmonic transient activation retains at least 85 percent of broadband-crest baseline"
  - "steady-vowel mean transient factor changes by no more than 0.05"
  - "low-frequency plosive-like transient activation retains at least 85 percent of broadband-crest baseline"
rejection:
  - "any acceptance invariant fails"
  - "the required confounder/sample-rate matrix is incomplete"
max_runs: 1
timeout_minutes: 5
random_seed: 2026092502
experiment_adapter: peakbody_periodicity_guard_stress_v1
allowed_operations:
  - read_repo_measurement_script
  - execute_allowlisted_adapter
  - write_derived_measurements
prohibited_operations:
  - arbitrary_shell
  - network_write
  - raw_audio_commit
  - main_push
  - confidence_change
  - stage_change
  - knowledge_promotion
  - product_release
knowledge_candidate:
  claim: "In the tested synthetic scope, periodicity protection can prevent an AirGuard-style high-band guard from mistaking bright harmonic vocal transients for sibilant/breath-like noise while retaining noise rejection."
  evidence_type: HYPOTHESIS
  scope: "PeakBody synthetic confounder model across 44.1/48/96/192 kHz; not a real-vocal or product detector claim."
  promotion_requested: HYPOTHESIS
lineage:
  related_jobs:
    - PEAKBODY-REV02-POLICY-001
    - PEAKBODY-CONFOUNDER-SPECTRAL-001
