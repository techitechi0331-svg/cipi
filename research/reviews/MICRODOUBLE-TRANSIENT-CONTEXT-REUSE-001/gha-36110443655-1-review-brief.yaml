research_question: Is the measured Vo.Prep plosive-context detector sufficiently evidenced
  and bounded to justify a MicroDouble experiment as an augmenting P/B context signal
  while retaining the current generic transient detector unchanged?
hypothesis: The Vo.Prep contextual plosive detector can be tested as an auxiliary
  modifier because it separates a synthetic plosive burst from sustained low-vowel/proximity/fry
  stress cases and produces bounded processing, while the existing generic transient
  detector remains necessary for non-P/B consonant/onset protection.
counter_hypotheses:
- The plosive detector evidence is too context-specific for transfer.
- Known growl-onset false positives make even auxiliary use unjustified.
- Processing/body movement is too large for subtle double protection.
- The current generic transient detector should be replaced rather than retained.
acceptance_criteria:
- Committed metrics snapshot SHA256 must match.
- Current generic transient onset response must remain >=0.90 and steady response
  <=0.10; the candidate is never authorized as a replacement.
- Candidate source evidence must include at least 10 real-vocal stems.
- Candidate plosive burst probability must be >=0.90.
- Candidate sustained low-vowel and proximity probabilities must each be <=0.40.
- Candidate fry probability must remain below its 0.75 activation threshold.
- Known growl-onset probability must remain at or above activation, explicitly preserving
  the false-positive risk rather than hiding it.
- Candidate body-region mean movement must be <=0.25 dB and event-band mean reduction
  <=1.50 dB in its source scope.
- All four downstream compressor proxy improvements must be >=0.30 dB.
- Current baseline must still lack equivalent labelled contextual false-positive evidence,
  otherwise this reuse gate cannot choose a transfer experiment.
rejection_criteria:
- Any declared acceptance condition fails.
- The candidate is interpreted as permission to replace the generic transient detector.
- The known growl-onset risk is omitted or reclassified away.
