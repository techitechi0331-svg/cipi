  - R5b found zero source overlap, but the full morphology benefit did not survive the second injection seed and therefore is rejected as a full ranker feature bundle.
  - Run-length-only morphology reduced clean false triggers in R5b, but R6 veto reproduced only a 2.5-point external-clean reduction on seed 20261003 and therefore failed the 5-point minimum.
  - R6 target-action retention was underpowered: locked-test baseline target actions were 1 and 0 across the two seeds, with 0 strong-effect actions in both; the apparent 100-percent retention is not accepted as meaningful protection evidence.
  - R5 did not improve Top-5/Top-3/MRR enough to satisfy the semantic-ranking product gate.
  - Suppression topology, maximum cut, and frequency-dependent ballistics are not numerically specified.

