research_question: Can a deployable same-observation spectral-inpainting counterfactual
  approximate the R7 paired causal delta and materially improve semantic candidate
  ranking without increasing independent clean-vocal false triggers?
hypothesis: Across both predeclared seeds, observed-minus-inpainted counterfactual
  features will improve conditional Top-5 by at least 0.08, close at least 15 percent
  of the R7 oracle gap, preserve strong-effect conditional Top-5 within 0.05, and
  not worsen external clean false-trigger by more than 0.025.
counter_hypotheses:
- Spectral inpainting is only a reparameterization of local prominence and adds no
  stable information beyond the frozen static ranker.
- The reconstructed pseudo-clean is biased by natural formant/harmonic slopes and
  increases clean-vocal false triggers.
- The R7 causal information fundamentally depends on a true paired observation and
  cannot be approximated from same-observation context.
acceptance_criteria:
- 'for each seed: source overlap count == 0'
- 'for each seed: conditional Top-5 >= static + 0.08'
- 'for each seed: R7 oracle gap closure >= 0.15'
- 'for each seed: strong-effect conditional Top-5 >= static - 0.05'
- 'for each seed: external clean false-trigger <= static + 0.025'
- 'for each seed: generator ceiling >= 0.80'
rejection_criteria:
- any seed has source overlap
- any seed conditional Top-5 improvement < 0.08
- any seed oracle gap closure < 0.15
- any seed strong-effect conditional Top-5 regresses by more than 0.05
- any seed external clean false-trigger worsens by more than 0.025
