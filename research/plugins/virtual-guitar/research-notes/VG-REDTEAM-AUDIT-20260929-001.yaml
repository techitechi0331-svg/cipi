    evidence_class: MEASURED
    statement: >-
      CIPI correctly keeps automatic product adoption, automatic promotion and product writes
      disabled for Realism-004 and explicitly requires Human Listening, real-audio A/B and
      later host confirmation.

  - id: VG-AUDIT-POS-HUMAN-REJECTION-PRESERVED
    evidence_class: MEASURED
    statement: >-
      The FAR_BELOW_TARGET Human Gate result for Realism-v1.1 is preserved and was not overwritten
      by CI success or by the newer architecture research.

  - id: VG-AUDIT-POS-CONTINUOUS-STATE-BLUEPRINT
    evidence_class: INFERRED
    statement: >-
      The new CIPI continuous physical-state blueprint identifies the central duplicate-physical-
      truth problem and proposes an evidence-aligned migration toward one authoritative per-string
      physical state.

  - id: VG-AUDIT-POS-MELON-EVIDENCE-LABEL
    evidence_class: MEASURED
    statement: >-
      MELON explicitly labels v2 outputs as synthetic architecture-identifiability evidence and
      disables fidelity/listening/product authority. The principal defect is not false labeling;
      it is that the current proxy experiment is too weak and structurally biased to determine
      mechanism survival or architecture superiority.

