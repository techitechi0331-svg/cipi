knowledge_candidate:
  claim: The v2 plosive recovery failure may be attributed primarily to Macro Level only if Plosive-only remains localized and near-neutral to VoPriPro while Macro-only explains most of the combined post-event shift.
  evidence_type: HYPOTHESIS
  scope: Source-derived synthetic plosive positive-control module decomposition only.
  promotion_requested: HYPOTHESIS
rejection_record:
  reason: If the decomposition gates fail, preserve the exact module contributions and do not infer a Macro confounder or change product thresholds.
  retained_findings:
    - Preserve Plosive-only event attenuation and downstream VoPriPro GR movement.
    - Preserve Macro-only gain movement and post-event VoPriPro GR shift.
    - Preserve combined path and additive-residual measurements by sample rate.
  reusable_findings:
    - Cross-stage interaction failures should be decomposed by module before changing product boundaries.
    - A problem-event processor may be complementary even when it does not materially reduce a downstream detector already protected against that event class.
  revisit_if:
    - Actual VST3 measurements materially disagree with source-code translation.
    - Vo.Prep Macro or Plosive DSP changes materially.
    - VoPriPro sidechain/detector behavior changes materially.
  scope: Vo.Prep Plosive/Macro decomposition feeding VoPriPro Natural50.
review_policy:
