measured:
  - Macro Boundary R1 improved median 2 s phrase spread by 0.3953 dB and median 1 s spread by 0.2595 dB on 11 anonymized private-vocal excerpts.
  - Macro Boundary R1 changed downstream VoPriPro mean GR by only 0.0230 dB median; worst mean-GR retention was 99.33%.
  - Macro Boundary R1 failed absolute 50 ms spread, 10 ms p99 peak, and Macro p95 movement gates and remains preserved as negative final-proof evidence.
  - Macro Boundary R2 passed all predeclared short-term shape diagnostics; 10 ms crest-p95 change was 0.00171 dB median / 0.00349 dB worst.
  - Macro Boundary R2 p99 gain excursion was approximately 0.015 / 0.075 / 0.150 dB over 10 / 50 / 100 ms.

unresolved:
  - Integrated level-matched listening is still required before final Macro/Phrase product lock.
  - Plosive Guard false-positive/false-negative behavior needs broader low-vowel, fry, growl, proximity, repeated-plosive and long-LF-note coverage.
  - Sibilance Guard false-positive/false-negative behavior needs broader bright-vowel, air, breath, falsetto, upper-register and distorted-vocal coverage.
  - Vo.Prep -> VoPriPro downstream integration needs formal double-processing and detector-interaction validation.
  - Cross-module interaction needs broader real-vocal validation.
  - Cubase Pro 14 release-candidate validation is pending.
  - Only derived measurements, never client recordings, may be committed.

