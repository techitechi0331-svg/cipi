measured:
  - Macro Boundary R1 improved median 2 s phrase spread by 0.3953 dB and median 1 s spread by 0.2595 dB on 11 anonymized private-vocal excerpts.
  - Macro Boundary R1 changed downstream VoPriPro mean GR by only 0.0230 dB median; worst mean-GR retention was 99.33%.
  - Macro Boundary R1 failed absolute 50 ms spread, 10 ms p99 peak, and Macro p95 movement gates and remains preserved as negative final-proof evidence.
  - Macro Boundary R2 passed all predeclared short-term shape diagnostics; 10 ms crest-p95 change was 0.00171 dB median / 0.00349 dB worst.
  - Macro Boundary R2 p99 gain excursion was approximately 0.015 / 0.075 / 0.150 dB over 10 / 50 / 100 ms.
  - Plosive Guard threshold-only R2 selected 0.70 as the highest synthetic candidate passing recall, declared-negative occupancy, duration, sample-rate and input-scale gates; this is a real-vocal validation candidate only, not a product threshold change.
  - Sibilance Guard threshold-only R2 selected 0.60 as the highest synthetic candidate passing S/SH/CH/T recall, declared-negative occupancy, duration, sample-rate and input-scale gates; 0.58 also passed but was intentionally not selected.
  - Phone-aligned real-vocal R3 protocol and derived-metrics-only harness are merged to CIPI main; product thresholds remain frozen at Plosive 0.75 and Sibilance 0.65.
  - Actual Vo.Prep VST3 -> VoPriPro VST3 binary-chain protocol, JUCE 9.0.2 headless host and CI workflow are merged to CIPI main.
  - Actual VST3 chain workflow run 36238279417 correctly returned the safe BLOCKED_EXTERNAL path because CIPI_CROSS_REPO_TOKEN is not configured; no binary compatibility claim was made.

unresolved:
