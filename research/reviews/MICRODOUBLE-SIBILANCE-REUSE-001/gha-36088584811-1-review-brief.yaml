research_question: Is the measured Vo.Prep hybrid high/broad + high/mid sibilance
  detector sufficiently evidenced and bounded to justify a direct MicroDouble product
  A/B against the current simpler high/broad detector?
hypothesis: The Vo.Prep hybrid detector has enough real-vocal precision-biased evidence
  and bounded processing to justify implementation as an experimental MicroDouble
  candidate, while the current detector remains the simple baseline.
counter_hypotheses:
- The hybrid detector does not have enough real-vocal recall evidence to justify added
  complexity.
- Its false-trigger or occupancy behavior is too high for a subtle doubler protection
  stage.
- Its measured processing moves vocal body too much for a wet-only protective role.
- The current simple detector already has sufficient labelled real-vocal evidence,
  making reuse unnecessary.
acceptance_criteria:
- Committed metrics snapshot SHA256 must match.
- Candidate evidence must contain at least 10 real-vocal stems.
- Candidate reference recall must be at least 60 percent.
- Candidate low-confidence false-trigger rate must be at most 0.10 percent.
- Candidate active occupancy must be at most 5 percent.
- Candidate corpus maximum reduction must be at most 1.5 dB in its source Vo.Prep
  scope.
- Candidate body-region mean movement must be at most 0.20 dB in its source Vo.Prep
  scope.
- Current MicroDouble baseline must still pass its synthetic neutral/high-frequency
  discrimination sanity checks.
- Current MicroDouble baseline must still lack equivalent labelled real-vocal recall
  evidence; otherwise this reuse gate is not sufficient to choose between them.
rejection_criteria:
- Any declared acceptance condition fails.
- The snapshot checksum fails.
- Evidence would be interpreted as product adoption rather than permission to run
  a direct A/B.
