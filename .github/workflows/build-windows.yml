name: build-windows-vst3

on:
  push:
    branches: [ main ]
    paths:
      - "CMakeLists.txt"
      - "src/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

concurrency:
  group: cipi-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 4

      - name: Collect VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.vst3 | ForEach-Object {
            Copy-Item $_.FullName -Destination artifacts -Recurse -Force
          }

      - name: Upload VST3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CIPI-Windows-VST3
          path: artifacts
          if-no-files-found: error
