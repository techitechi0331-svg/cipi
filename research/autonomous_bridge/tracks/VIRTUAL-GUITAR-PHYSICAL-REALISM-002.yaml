schema_version: "1.0"
track_id: VIRTUAL-GUITAR-PHYSICAL-REALISM-002
enabled: true
root_research_id: VIRTUAL-GUITAR-PHYSICAL-REALISM-002

research_question: >-
  Can the Virtual Guitar physical-audio substrate reduce the clearly perceived synthetic
  character of single notes while preserving the directionally positive strum behavior?

hypothesis_id: HYP-VIRTUAL-GUITAR-PHYSICAL-REALISM-V02
hypothesis: >-
  A richer bounded physical-string model that adds frequency-dependent damping,
  dispersion/inharmonicity, improved pick excitation, and bridge/body coupling can
  improve single-note realism beyond the V01 deterministic delay loop without
  regressing timing, stability, or realtime safety.

trigger_evidence:
  - research/plugins/virtual-guitar/human-evidence/VG-HUMAN-LISTENING-20260927-001.yaml

human_gate_required: true
human_gate_conditions:
  - HUMAN_LISTENING
  - REAL_AUDIO_AB
  - CUBASE_HOST_CONFIRMATION
  - PRODUCT_ADOPTION_DECISION

authority_boundaries:
  automatic_final_decision: false
  automatic_knowledge_promotion: false
  product_repository_write: false
  melon_continuation_is_proposal_only: true
  cipi_evidence_authority: true

research_priorities:
  - SINGLE_NOTE_TIMBRAL_REALISM
  - SPECTRAL_EVOLUTION_OVER_DECAY
  - PICK_TRANSIENT_REALISM
  - STRING_DISPERSION_AND_INHARMONICITY
  - BRIDGE_BODY_COUPLING_PROXY
  - PRESERVE_STRUM_TIMING_DIRECTION

do_not_overclaim:
  - The user feedback is not a matched real-guitar A/B.
  - The existing V01 delay loop remains a research substrate, not a realistic guitar model.
  - Strum being directionally better does not authorize product adoption.

budget:
  max_loop_depth: 4
  max_runs: 4
  max_total_experiments: 4
  max_candidates: 48
  max_runtime: 600
  max_same_hypothesis_retry: 4
  max_same_architecture_retry: 3
  max_no_improvement_runs: 3

initial_experiment:
  experiment_id: EXP-VIRTUAL-GUITAR-PHYSICAL-REALISM-R1
  experiment_type: MODEL_CLASS_DISCRIMINATION
  expected_information_gain: 0.95
  scope:
    - virtual_guitar
    - physical_audio
    - single_note_realism
    - spectral_decay
    - excitation
    - dispersion
  inputs:
    seed: 2026092707
    population: 8
    generations: 2
    max_candidates: 16
    max_runtime_seconds: 120
    stage2_limit: 4
    stage2_archive_limit: 4
    stage2_epsilon_range_fraction: 0.03
    stage2_epsilon_spread_multiplier: 0.5
    stage3_limit: 1
    workers: 1
    preflight_mode: fast

efficiency_policy:
  policy_id: VIRTUAL-GUITAR-EFFICIENCY-V2.3
  policy_version: "2.3"
  state: REQUIRED
  max_guitar_runner_jobs: 1
  batch_class: CHEAP
  max_memory_mb: 1024
  candidate_timeout_seconds: 5
  full_regression_at_epoch_end: true
  selective_test_mapping: true
  current_main_recheck_required: true
