research_question: When candidate discovery hits the injected resonance, does a research-only
  paired clean/injected causal oracle rank that target near the top, and how large
  is the gap versus single-view inference features?
hypothesis: If single-view feature information is the main blocker, the causal oracle
  will achieve conditional Top-5 >= 0.80 and strong-effect conditional Top-5 >= 0.85
  on both seeds, with at least a 0.20 conditional Top-5 gain over the frozen static
  ranker.
counter_hypotheses:
- Even paired clean/injected deltas cannot reliably rank the target, indicating candidate
  alignment, label construction, or object representation is the main blocker.
- The oracle improves only one seed, indicating unstable candidate geometry rather
  than a stable single-view feature gap.
- Audit coverage is too sparse to distinguish these explanations.
acceptance_criteria:
- 'for each seed: generator ceiling >= 0.80'
- 'for each seed: at least 24 locked test cases'
- 'for each seed: at least 20 target candidate rows'
rejection_criteria:
- audit coverage is insufficient on either seed
