schema_version: "1.0"
job_id: MICRODOUBLE-SIBILANCE-REUSE-001
state: QUEUED
track:
  id: MICRODOUBLE_01
  path: research/experiments/MicroDouble
research_question: "Is the measured Vo.Prep hybrid high/broad + high/mid sibilance detector sufficiently evidenced and bounded to justify a direct MicroDouble product A/B against the current simpler high/broad detector?"
hypothesis: "The Vo.Prep hybrid detector has enough real-vocal precision-biased evidence and bounded processing to justify implementation as an experimental MicroDouble candidate, while the current detector remains the simple baseline."
counter_hypotheses:
  - "The hybrid detector does not have enough real-vocal recall evidence to justify added complexity."
  - "Its false-trigger or occupancy behavior is too high for a subtle doubler protection stage."
  - "Its measured processing moves vocal body too much for a wet-only protective role."
  - "The current simple detector already has sufficient labelled real-vocal evidence, making reuse unnecessary."
baseline:
  - current MicroDouble v0.3 high-band to broadband energy-ratio detector
variants:
  - Vo.Prep Sibilance Guard v2.3 hybrid high/broad + high/mid evidence candidate
metrics:
  - snapshot_checksum_ok
  - candidate_has_real_vocal_evidence
  - candidate_real_vocal_stem_count
  - candidate_reference_recall_pct
  - candidate_low_conf_false_trigger_pct
  - candidate_active_occupancy_pct
  - candidate_corpus_max_reduction_db
  - candidate_body_mean_movement_db
  - candidate_precision_bias_ok
  - candidate_processing_bounded
  - baseline_synthetic_sane
  - baseline_real_labeled_gap
acceptance:
  - "Committed metrics snapshot SHA256 must match."
  - "Candidate evidence must contain at least 10 real-vocal stems."
  - "Candidate reference recall must be at least 60 percent."
  - "Candidate low-confidence false-trigger rate must be at most 0.10 percent."
  - "Candidate active occupancy must be at most 5 percent."
  - "Candidate corpus maximum reduction must be at most 1.5 dB in its source Vo.Prep scope."
  - "Candidate body-region mean movement must be at most 0.20 dB in its source Vo.Prep scope."
  - "Current MicroDouble baseline must still pass its synthetic neutral/high-frequency discrimination sanity checks."
  - "Current MicroDouble baseline must still lack equivalent labelled real-vocal recall evidence; otherwise this reuse gate is not sufficient to choose between them."
rejection:
  - "Any declared acceptance condition fails."
  - "The snapshot checksum fails."
  - "Evidence would be interpreted as product adoption rather than permission to run a direct A/B."
max_runs: 1
timeout_minutes: 3
random_seed: 20260925
experiment_adapter: microdouble_sibilance_reuse_gate_v1
allowed_operations:
  - read_committed_snapshot
  - deterministic_compare
  - write_research_evidence
prohibited_operations:
  - arbitrary_shell
  - network_write
  - raw_audio_persistence
  - main_push
  - confidence_change
  - current_stage_change
  - automatic_promotion
  - product_dsp_mutation
  - product_release
knowledge_candidate:
  claim: "The Vo.Prep hybrid high/broad + high/mid detector has enough bounded real-vocal evidence to be tested as a MicroDouble sibilance-protection candidate against the current simple detector."
  evidence_type: HYPOTHESIS
  scope: "Evidence-reuse decision only; direct MicroDouble A/B, subjective naturalness, multilingual generalization and product adoption remain unproven."
  promotion_requested: PROVISIONAL
review_policy:
  required_human_gates:
    - Direct MicroDouble baseline-vs-candidate product experiment before adoption.
continuation:
  on_accept: []
  on_reject: []
lineage:
  supersedes: []
  related_jobs:
    - MICRODOUBLE-V03-PRODUCT-GATE-001
  related_decisions:
    - "MICRODOUBLE-V03-PRODUCT-GATE-001:gha-36071901483-1:review-01"
