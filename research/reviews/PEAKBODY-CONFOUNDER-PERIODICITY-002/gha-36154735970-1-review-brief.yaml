research_question: Can a periodicity-protected normalized high-band guard reduce noise-like
  crest confounders without suppressing bright high-F0 harmonic transients?
hypothesis: Adding a periodicity/voicing protection term to the normalized high-band
  guard will retain at least 85 percent of bright high-F0 transient activation while
  still reducing sibilant/breath false peak-preservation to 25 percent or less of
  the broadband-crest baseline.
counter_hypotheses:
- Periodicity protection restores bright harmonic transients but also protects noise-like
  events too strongly.
- The periodicity proxy is unstable across sample rates.
- The combined guard materially changes steady-vowel behavior.
- Low-frequency plosive-like transients are incorrectly suppressed.
acceptance_criteria:
- all numeric outputs are finite
- all seven synthetic confounder cases are present at 44.1/48/96/192 kHz
- sibilant/breath candidate high-transient activation is no more than 25 percent of
  broadband-crest baseline
- standard low/high voiced transient activation retains at least 90 percent of broadband-crest
  baseline
- bright high-F0 harmonic transient activation retains at least 85 percent of broadband-crest
  baseline
- steady-vowel mean transient factor changes by no more than 0.05
- low-frequency plosive-like transient activation retains at least 85 percent of broadband-crest
  baseline
rejection_criteria:
- any acceptance invariant fails
- the required confounder/sample-rate matrix is incomplete
