research_question: Does the current Vo.Prep Plosive Guard v2.2 contextual detector
  preserve short plosive-event recall while rejecting LF non-plosive confounders materially
  better than a simple 20-80 Hz LF-onset detector?
hypothesis: The current onset + LF/Mid + LF/Broad contextual detector will detect
  nominal/strong/repeated plosives across supported sample rates while producing substantially
  less false event occupancy on low-vowel, proximity, fry, growl, long-LF, low-male,
  bright-female, breath and ordinary word-onset stress cases than the LF-only baseline.
counter_hypotheses:
- The contextual detector loses too much true-plosive recall or reacts too slowly.
- Growl/fry/low-vowel/proximity onsets still trigger enough context events that the
  added detector complexity is not justified.
- Detector decisions vary materially with sample rate or +/-12 dB input scaling.
acceptance_criteria:
- Context positive detection fraction is >= 0.90 across plosive_soft/plosive_nominal/plosive_strong/plosive_repeated
  and 44.1/48/96 kHz.
- Nominal, strong and repeated plosives are detected at every tested sample rate.
- Both events in the repeated-plosive case are detected at every tested sample rate.
- Worst nominal/strong first-onset latency is <= 20 ms.
- Mean false event occupancy over declared negative cases is <= 5% and worst negative
  occupancy is <= 12%.
- Context mean false occupancy is <= 35% of the LF-only baseline mean false occupancy.
- Maximum contiguous context event duration is <= 125 ms.
- Maximum context probability spread across 44.1/48/96 kHz is <= 0.06.
- Across -12/0/+12 dB scaling on nominal plosive, low vowel and growl, max context
  probability spread is <= 0.05 and occupancy spread <= 3 percentage points.
- All derived values remain finite.
rejection_criteria:
- Any declared acceptance condition fails.
- Passing requires relaxing a predeclared detector, occupancy, latency, duration,
  sample-rate or scale-invariance gate.
- Raw audio is persisted or product DSP is mutated.
