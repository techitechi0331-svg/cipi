schema_version: "1.0"
job_id: BLACK76-RATIO-P2A-SUFFICIENCY-001
state: QUEUED
track:
  id: 1176_FAMILY_FORMAL
  path: research/reference_devices/1176
research_question: "Is the Black76 P2-A detector-drive-only change sufficient to fix both threshold ordering and static-ratio slopes against the committed supplemental LN-era target?"
hypothesis: "P2-A is sufficient: correcting detector drive should fix threshold ordering and materially improve the 4/8/12/20 static-ratio slopes."
counter_hypotheses:
  - "P2-A fixes threshold ordering but leaves deep-GR ratio slopes largely unchanged, so another detector/FET/loop interaction is required."
baseline:
  - black76_baseline
variants:
  - black76_p2a
metrics:
  - candidate_threshold_order_correct
  - candidate_onset_mae_db
  - candidate_ratio_log_rmse
  - ratio_error_improvement_percent
  - candidate_deep_ratio_fraction_min_12_20
acceptance:
  - "Candidate threshold order is correct."
  - "Candidate onset MAE is <= 1.0 dB."
  - "Candidate ratio log-RMSE is <= 0.30."
  - "Candidate ratio error improves by at least 15 percent versus baseline."
  - "Candidate deep-ratio fraction for 12:1 and 20:1 is at least 0.70 of target."
rejection:
  - "Candidate fixes onset ordering but ratio-slope error remains materially outside acceptance."
  - "Deep 12:1 or 20:1 ratio remains below 70 percent of the target."
max_runs: 1
timeout_minutes: 5
random_seed: 7600331
experiment_adapter: black76_ratio_p2a_compare_v1
allowed_operations:
  - read_committed_ratio_csv
  - deterministic_numeric_comparison
prohibited_operations:
  - arbitrary_shell
  - network_access
  - network_write
  - main_push
  - raw_audio_read
  - confidence_change
  - current_stage_change
knowledge_candidate:
  claim: "Black76 P2-A detector-drive correction can fix threshold ordering without being sufficient to recover steep high-ratio static slopes."
  evidence_type: MEASURED
  scope: "Black76 Rev E Priority-2 P2-A against the committed supplemental LN-era static-curve target."
  promotion_requested: PROVISIONAL
continuation:
  on_accept: []
  on_reject: []

retry_nonce: 1
