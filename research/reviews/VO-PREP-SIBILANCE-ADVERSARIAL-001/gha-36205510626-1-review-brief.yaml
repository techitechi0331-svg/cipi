  decision_id: VO-PREP-SIBILANCE-ADVERSARIAL-001:gha-36205510626-1:auto
  decision: REJECT
  rationale: If any predeclared gate fails, retain the failed phoneme/confounder cases
    as negative evidence and keep the current product baseline unchanged pending bounded
    refinement.
  review_gaps:
  - triggered_criteria_need_adapter_or_review
  retained_findings:
  - Per-case probability, occupancy, onset, duration, sample-rate and scale-invariance
    measurements.
  - Simple absolute high-band baseline results and current contextual detector results.
  reusable_findings:
  - Which bright/noisy vocal conditions remain inseparable from controlled sibilance
    under the current feature family.
  - Whether ratio-domain detector behavior remains stable across level scaling and
    sample rates.
  revisit_if:
  - A bounded contextual-feature or threshold refinement directly targets the failed
    confounder without weakening S/SH/CH/T detection.
  - Real-vocal evidence contradicts the synthetic stress ranking.
