melon_objective_audit:
  verdict: FAIL
  current_architecture_labels:
    - DUAL_POLARIZATION_WAVEGUIDE
    - PASSIVE_PLUCK_BRIDGE
    - NONLINEAR_CONTACT_FULL
  problem_1: >-
    These are not clean mutually exclusive architectures. Two-polarization propagation,
    player-string contact, nonlinear fret contact, bridge scattering and sympathetic coupling
    are potentially complementary mechanisms in one hybrid solver.
  problem_2: >-
    _measure() computes feature proxies algebraically from candidate parameters rather than
    measuring executable solver state/audio.
  problem_3: >-
    Search phases prune candidates by construction until R3 contains only NONLINEAR_CONTACT_FULL.
  problem_4: >-
    Best-candidate ordering explicitly rewards greater architecture_level.
  problem_5: >-
    estimated_ops_per_sample and state-memory values are fixed architecture lookup estimates,
    not measured implementation cost.
  problem_6: >-
    information_gain_signal is a hand-authored function of architecture-label count rather than
    uncertainty reduction, reference discrimination or measured information gain.
  consequence: >-
    Keep v2 adapter as an orchestration/proxy canary if useful, but do not use its ranking to
    reject mechanisms or select the production physical architecture.

