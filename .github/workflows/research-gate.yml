name: Research Gate

on:
  push:
    paths:
      - "RULES/**"
      - "research/**"
      - "tools/validate_research.py"
      - ".github/workflows/research-gate.yml"
  pull_request:
    paths:
      - "RULES/**"
      - "research/**"
      - "tools/validate_research.py"
      - ".github/workflows/research-gate.yml"
  workflow_dispatch:

jobs:
  validate-research-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validator dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate research state contract
        run: python tools/validate_research.py
