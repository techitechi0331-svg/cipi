name: Free Autonomous Research Architect

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: cipi-free-autonomous-architect
  cancel-in-progress: false

jobs:
  discover-one-bounded-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependency
        run: python -m pip install PyYAML==6.0.2

      - name: Validate current contracts
        run: |
          python tools/validate_research.py
          python tools/validate_architect.py
          python tools/validate_incubator.py

      - name: Extract unresolved research-gap signals
        id: signals
        run: python automation/architect/scan_signals.py --max-signals 8 --github-output "$GITHUB_OUTPUT"

      - name: Discover bounded Research Gaps
        id: discover
        run: python automation/architect/discover.py --max-gaps 3 --github-output "$GITHUB_OUTPUT"

      - name: Run one allowlisted architect pilot
        if: steps.discover.outputs.top_pilot_proposal != ''
        id: pilot
        env:
          PROPOSAL: ${{ steps.discover.outputs.top_pilot_proposal }}
        run: |
          RUN_ID="gha-architect-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python automation/architect/pilot.py --proposal "$PROPOSAL" --output-root . --run-id "$RUN_ID" --github-output "$GITHUB_OUTPUT"

      - name: Route one product-relevant opportunity
        if: steps.discover.outputs.top_plugin_proposal != ''
        id: incubator
        env:
          PROPOSAL: ${{ steps.discover.outputs.top_plugin_proposal }}
        run: python automation/incubator/discover.py --proposal "$PROPOSAL" --output-root . --github-output "$GITHUB_OUTPUT"

      - name: Validate generated evidence
        run: |
          python tools/validate_architect.py
          python tools/validate_incubator.py
          python tools/validate_research_result.py
          python tools/validate_evidence_candidate.py
          python tools/validate_decision_records.py
          python tools/validate_research_job.py
          python tools/validate_research.py

      - name: Detect generated changes
        id: changed
        run: |
          if git status --porcelain -- research/architect research/incubator research/runs research/knowledge_candidates research/decisions | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit append-only architect evidence
        if: steps.changed.outputs.has_changes == 'true'
        id: commit
        env:
          BOT_BRANCH: architect-bot/discovery/gha-${{ github.run_id }}-${{ github.run_attempt }}
          PILOT_JOB: ${{ steps.pilot.outputs.pilot_job_id }}
        run: |
          git config user.name "cipi-architect-bot"
          git config user.email "cipi-architect-bot@users.noreply.github.com"
          git switch -c "$BOT_BRANCH"
          git add -A research/architect research/incubator
          if [ -n "$PILOT_JOB" ]; then
            git add -A "research/runs/$PILOT_JOB"
            git add -A "research/knowledge_candidates/$PILOT_JOB"
            git add -A "research/decisions/$PILOT_JOB"
          fi
          git commit -m "submit autonomous research architecture wave"
          python tools/validate_architect_change_scope.py --base origin/main --head HEAD
          git push --set-upstream origin "$BOT_BRANCH"
          echo "branch=$BOT_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open architect evidence pull request
        id: open_pr
        continue-on-error: true
        if: steps.changed.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create --base main --head "$BOT_BRANCH"             --title "Autonomous Research Architect discovery wave"             --body "Bounded zero-paid CIPI Research Architect wave. It extracted unresolved/blocker signals, created at most three executable-or-NEEDS_ADAPTER Research Gap/Proposal candidates, executed at most one allowlisted pilot, and routed at most one product opportunity through the Plugin Incubator. Unknown topics never execute arbitrary generated code. Production plug-in source, official repositories, releases, Cubase gates and knowledge CONFIRMED states remain review-only."

      - name: Create review issue when Actions PR creation is disabled
        if: steps.changed.outputs.has_changes == 'true' && steps.open_pr.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh issue create             --title "Autonomous Research Architect ready: discovery wave"             --body "A bounded Research Architect wave is available on branch $BOT_BRANCH. Review the new Research Gap Signals, Gap/Proposal candidates, optional allowlisted pilot evidence and Plugin Incubator routing. Unknown research code was not generated or executed. Production adoption remains review-only."

      - name: No new architect work
        if: steps.changed.outputs.has_changes != 'true'
        run: echo "No new bounded Research Gap, signal or Incubator evidence was generated."
