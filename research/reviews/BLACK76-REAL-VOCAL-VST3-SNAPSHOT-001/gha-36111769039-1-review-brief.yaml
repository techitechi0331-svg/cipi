research_question: Does the provenance-clean Black76 actual-VST3 real-vocal snapshot
  satisfy the predeclared numerical continuity, clipping, latency, working-unity,
  active-processing, provenance, and raw-audio-safety gates?
hypothesis: The current Black76 working build processes both public vocal/voice sources
  through the actual VST3 with finite output, no clipping, stable latency, practical
  Attack-OFF unity behavior, and active compression in all declared modes.
counter_hypotheses:
- One or more source/mode renders contain non-finite values, clipping, inconsistent
  latency, or unexpected working-point gain.
- The snapshot is incomplete, provenance is inconsistent, or raw vocal audio was accidentally
  persisted in CIPI.
acceptance_criteria:
- The six-case two-source by three-mode matrix is complete.
- All numerical fields are finite at 48 kHz.
- All cases report exactly 6 samples of VST3 latency.
- Input peak normalization error is <= 1e-6 from 0.5.
- Total clipped and non-finite sample counts are zero and maximum output peak remains
  below 1.0.
- Attack-OFF color gain stays within +/-0.5 dB on both sources.
- Both compression modes show at least 3 dB attenuation on every source.
- Product artifact provenance is consistent and the snapshot identifies actual VST3
  processing.
- No raw WAV audio exists under the CIPI evidence path.
rejection_criteria:
- Any finite-state, clipping, latency, matrix-integrity, provenance, or raw-audio-safety
  gate fails.
- Attack-OFF working-point gain leaves the +/-0.5 dB real-audio tolerance.
