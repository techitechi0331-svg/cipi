gap_analysis:
  high_priority_missing_physics:
    - id: GAP-001
      mechanism: "distributed string propagation / traveling-wave behavior"
      why: >-
        A fixed bank of modal oscillators can express resonances but does not by itself reproduce all
        causal spatial behavior of a picked/fretted string, reflection timing, or position-dependent
        observation/excitation.
    - id: GAP-002
      mechanism: "two-polarization string motion and coupling"
      why: "Real string motion is not adequately represented as one scalar vibration axis."
    - id: GAP-003
      mechanism: "dynamic pick-string contact and release"
      why: >-
        Current short synthetic transient is not a solved interaction among pick stiffness, depth,
        angle, velocity, compliance, friction/contact and release.
    - id: GAP-004
      mechanism: "fret/finger/neck collision and stopping physics"
      why: >-
        Missing contact mechanics prevent realistic buzz/rattle, stopping-finger effects, nonlinear
        pitch glide, damping changes and articulation-dependent transients.
    - id: GAP-005
      mechanism: "bridge scattering and six-string sympathetic coupling"
      why: >-
        Current bridgeCoupling is a static modal gain term; it is not a time-domain multi-string
        energy-transfer network.
    - id: GAP-006
      mechanism: "guitar structure/body/neck impedance"
      why: >-
        Current body coloration is simplified filtering, not a measured/modelled structural impedance
        and energy-return system.
    - id: GAP-007
      mechanism: "per-string physical identity"
      why: >-
        Gauge, tension, scale length, core/winding construction, damping and open-vs-fretted boundary
        conditions need explicit research instead of treating notes as generic modal presets.
    - id: GAP-008
      mechanism: "Strat pickup transduction and electronics"
      why: >-
        A Strat-style DI target requires position-dependent magnetic pickup sensing, SSS/HSS architecture,
        pickup height/position, coil/electrical loading and tone/volume/cable behavior. This is downstream
        of basic physical-string convergence but still inside the final Guitar-Lab DI scope.
    - id: GAP-009
      mechanism: "performance-state-to-physics coupling"
      why: >-
        Gesture, LivingString, fingering and audio realism currently exist as partly separate abstractions;
        production realism requires the player's left/right-hand state to continuously drive the same
        physical string state.
    - id: GAP-010
      mechanism: "real-audio-constrained validation"
      why: >-
        Internal proxies can verify mechanism activation but cannot establish audible guitar fidelity.
        Matched real DI measurements and Human Listening remain mandatory.

next_research_order:
  - priority: 1
    action: >-
      Reconcile and activate Realism-004 only after verifying the validated MELON v2 adapter and CIPI
      authority state. Do not infer activation from CI success alone.
  - priority: 2
    action: >-
      Run bounded architecture discrimination across dual-polarization, passive pluck/bridge and
      nonlinear-contact-full species. Keep product integration OFF.
  - priority: 3
    action: >-
      Add real-audio reference adapter using Guitar-TECHS DI isolated notes in runner cache only.
      Measure attack spectrum, harmonic decay by frequency, inharmonicity, onset duration, short-term
      pitch glide/dynamic detune and time-varying spectral centroid. Metrics narrow candidates but do
      not replace listening.
  - priority: 4
    action: >-
      Research actual Strat-style physical constants and geometry before committing product constants:
      scale length, representative string sets/gauges/material, tensions, pickup sensing positions,
      pickup height/loading and SSS/HSS topology. Classify every value as SOURCE_FACT / MEASURED /
      INFERRED / HYPOTHESIS.
  - priority: 5
    action: >-
      Integrate left/right-hand gestures into the physical solver: pick contact/release, muting,
      hammer/pull/slide, bend/vibrato, fret collision and continuous note termination.
  - priority: 6
    action: >-
      Build multi-string bridge/body coupling and sympathetic resonance, then repeat real-DI and
      Human Gate tests.
  - priority: 7
    action: >-
      Only after basic physical guitar and DI convergence gates are explicitly completed, activate
      Strat Pickup/Electronics research (SSS/HSS, future coil split extension point).
  - priority: 8
    action: >-
      Keep Amp/Cab and Mic outside the current Guitar-Lab realism loop. Integrate them later only
      through versioned boundaries and matched stage-by-stage listening.

