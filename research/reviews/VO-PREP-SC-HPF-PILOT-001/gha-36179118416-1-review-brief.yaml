research_question: Can a simple detector-only 12 dB/oct high-pass reduce low-frequency
  rumble/plosive-driven gain reduction without materially under-compressing low male
  vowels or weakening consonant/sibilant event capture in the frozen Vo.Prep transparent
  compressor?
hypothesis: At least one cutoff among 40, 60, 70, 80, or 100 Hz will reduce synthetic
  rumble-driven excess GR by at least 50 percent and plosive excess GR by at least
  15 percent while preserving low-male body GR within 0.30 dB, female body GR within
  0.15 dB, and consonant/sibilant event GR to at least 90 percent of the OFF baseline.
counter_hypotheses:
- OFF remains the best evidence/complexity trade-off because useful low-frequency
  vocal body is reduced before false LF triggering is meaningfully improved.
- HPF ringing/transient behavior increases event GR or creates sample-rate instability.
- Only cutoffs high enough to damage low male vocals meet the rumble/plosive goals.
acceptance_criteria:
- Synthetic matrix is evaluated at 44.1, 48, and 96 kHz.
- Mean rumble-driven excess-GR reduction is at least 50 percent versus OFF.
- Mean plosive excess-GR reduction is at least 15 percent versus OFF.
- Mean low-male body-GR loss is no more than 0.30 dB versus OFF.
- Mean female body-GR absolute change is no more than 0.15 dB versus OFF.
- Consonant event-GR retention is at least 90 percent of OFF.
- Sibilant event-GR retention is at least 90 percent of OFF.
- Low-male body-GR delta sample-rate spread is no more than 0.10 dB.
- The selected cutoff is the lowest cutoff that passes every gate.
rejection_criteria:
- No cutoff passes every preservation and false-trigger reduction gate.
- Any candidate is non-finite or unstable across the declared sample rates.
- Passing requires relaxing a predeclared preservation gate.
