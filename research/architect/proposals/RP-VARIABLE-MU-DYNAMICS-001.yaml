research_question: Which variable-mu control and timing mechanisms are necessary before
  a reusable vocal-oriented model can be justified?
hypothesis: A level-dependent gain law plus program-dependent control behavior will
  outperform a fixed-ratio static baseline on declared variable-mu reference behaviors.
counter_hypotheses:
- A conventional soft-knee compressor is sufficient for the target behaviors.
baseline:
- soft_knee_compressor
variants:
- variable_mu_graybox
metrics:
- static_curve_error
- program_dependence_error
- thd_vs_gr
acceptance:
- Gray-box candidate reduces declared reference error across static and dynamic tests.
rejection:
- Added model complexity does not reduce reference error.
