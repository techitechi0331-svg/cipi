research_question: Can deployable single-view fixed-Hz temporal transfer-consistency
  features recover a material fraction of the R7 causal-oracle ranking gap without
  increasing independent clean-vocal false triggers?
hypothesis: Across both predeclared seeds, time-consistent center-vs-neighborhood
  relative-gain features will improve conditional Top-5 by at least 0.08 over the
  frozen static ranker, close at least 15 percent of the R7 oracle gap, preserve strong-effect
  conditional Top-5 within 0.05, and not worsen external clean false-trigger by more
  than 0.05.
counter_hypotheses:
- Natural formants/harmonics can be equally time-consistent at fixed Hz, so transfer-consistency
  adds no separability.
- The feature family improves one seed only and is not stable.
- Transfer-consistency overfires on legitimate stable vocal resonances and worsens
  clean false triggers.
acceptance_criteria:
- 'for each seed: conditional Top-5 >= static + 0.08'
- 'for each seed: R7 oracle gap closure >= 0.15'
- 'for each seed: strong-effect conditional Top-5 >= static - 0.05'
- 'for each seed: external clean false-trigger <= static + 0.05'
- 'for each seed: generator ceiling >= 0.80'
rejection_criteria:
- any seed conditional Top-5 improvement < 0.08
- any seed oracle gap closure < 0.15
- any seed strong-effect conditional Top-5 regresses by more than 0.05
- any seed external clean false-trigger worsens by more than 0.05
