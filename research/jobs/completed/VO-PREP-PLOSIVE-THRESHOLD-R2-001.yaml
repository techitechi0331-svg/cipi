schema_version: '1.0'
job_id: VO-PREP-PLOSIVE-THRESHOLD-R2-001
state: COMPLETED
priority: 99
track:
  id: VO_PREP_FORMAL
  path: research/plugins/vo-prep
research_question: Can a small activation-threshold calibration recover soft and repeated
  plosive recall for the frozen Vo.Prep v2.2 contextual detector without giving back
  its measured synthetic false-positive margin?
hypothesis: The highest passing threshold in the predeclared 0.72/0.70 family will
  recover plosive_soft and both repeated events while preserving nominal/strong latency,
  zero-or-near-zero negative occupancy, sample-rate stability and +/-12 dB input-scale
  invariance.
counter_hypotheses:
- Threshold-only calibration cannot recover the second repeated plosive because local-baseline/re-arm
  behavior, not activation threshold, is limiting recall.
- Lowering activation enough to recover soft/repeated events creates false detections
  on long-LF, proximity, fry or growl negatives.
- A passing threshold is not stable across 44.1/48/96 kHz or +/-12 dB input scaling.
baseline:
- Current v2.2 feature family with activation 0.75, release 0.55 and 120 ms cap.
variants:
- Same frozen feature family, activation 0.72, release 0.55, 120 ms cap.
- Same frozen feature family, activation 0.70, release 0.55, 120 ms cap.
metrics:
- positive_detection_fraction
- soft_detected_all_sr
- nominal_detected_all_sr
- strong_detected_all_sr
- repeated_two_events_all_sr
- max_positive_onset_latency_ms
- negative_occupancy_mean_pct
- negative_occupancy_max_pct
- false_occupancy_ratio
- max_probability_sample_rate_spread
- max_active_duration_ms
- max_input_scale_probability_spread
- max_input_scale_occupancy_spread_pct
acceptance:
- Select the highest activation threshold that passes every gate.
- Positive detection fraction is >= 0.90.
- Soft, nominal and strong cases are detected at every tested sample rate.
- Both repeated-plosive events are detected at every tested sample rate.
- Worst positive first-onset latency is <= 20 ms.
- Mean negative occupancy is <= 1% and worst negative occupancy is <= 5%.
- Candidate mean negative occupancy is <= 35% of the unchanged LF-only baseline mean.
- Maximum event duration is <= 125 ms.
- Maximum probability spread across 44.1/48/96 kHz is <= 0.06.
- Across -12/0/+12 dB scaling, maximum probability spread is <= 0.05 and occupancy
  spread <= 3 percentage points.
rejection:
- Neither 0.72 nor 0.70 passes every gate.
- Passing requires adding a new feature, changing release/cap, or relaxing a predeclared
  gate.
- Raw audio is persisted or product DSP is mutated.
max_runs: 1
timeout_minutes: 5
random_seed: 20260926
experiment_adapter: voprep_plosive_threshold_r2_v1
allowed_operations:
- deterministic_synthetic_signal_generation
- deterministic_detector_replay
- bounded_threshold_family_comparison
- derived_metric_export
prohibited_operations:
- network_write
- arbitrary_shell
- raw_audio_persistence
- product_dsp_mutation
- main_push
- confidence_change
- current_stage_change
- automatic_promotion
- product_release
knowledge_candidate:
  claim: A small activation-threshold calibration may recover soft/repeated plosive
    recall without changing the Vo.Prep contextual feature family.
  evidence_type: HYPOTHESIS
  scope: Vo.Prep Plosive Guard v2.2 deterministic R2 calibration only; real-vocal
    validation remains required.
  promotion_requested: HYPOTHESIS
rejection_record:
  reason: If the bounded threshold family cannot pass all recall and false-positive
    gates, threshold-only tuning is insufficient and the failure must be retained
    before studying re-arm/local-baseline changes.
  retained_findings:
  - All candidate-by-case detection, occupancy, event-count, latency, duration, sample-rate
    and scale-invariance metrics.
  - The unchanged 0.75 baseline and LF-only negative baseline.
  reusable_findings:
  - Whether a conservative contextual detector can be safely recalibrated before adding
    new features.
  revisit_if:
  - A bounded re-arm/local-baseline study directly targets the remaining repeated-event
    failure.
  - Real-vocal evidence contradicts the synthetic threshold ordering.
  scope: Vo.Prep Plosive Guard threshold-only R2 calibration.
