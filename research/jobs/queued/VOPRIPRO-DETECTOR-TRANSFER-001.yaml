schema_version: "1.0"
job_id: VOPRIPRO-DETECTOR-TRANSFER-001
state: QUEUED
track:
  id: VOPRIPRO_FORMAL
  path: research/plugins/vopripro
research_question: "Does the Vo.Prep-derived Slow-RMS/Fast-Peak fusion deserve a same-corpus real-vocal VoPriPro experiment when compared with the current Natural50 detector under otherwise matched compressor conditions?"
hypothesis: "The Vo.Prep-derived max(Slow RMS, Fast Peak - 6 dB) detector will preserve sustained-body control while avoiding materially greater short-transient, plosive-like, sibilant-like, or breath-noise gain reduction than the current VoPriPro Natural50 35/65 Peak/RMS detector."
counter_hypotheses:
  - "The transfer candidate produces materially more short-transient gain reduction than the current VoPriPro detector."
  - "The transfer candidate increases gain reduction on problem-event proxies enough to worsen false-trigger risk."
  - "The transfer candidate fails to preserve comparable sustained-body control after equal reference calibration."
  - "The transfer candidate exhibits material sample-rate dependence."
baseline:
  - current_vopripro_natural50_detector
variants:
  - voprep_slow_rms_fast_peak_minus6_fusion
metrics:
  - all_finite
  - sustained_body_max_abs_active_mean_delta_db
  - short_transient_max_extra_peak_gr_db
  - problem_event_max_extra_peak_gr_db
  - body_plus_transient_min_peak_gr_ratio
  - candidate_max_peak_gr_sample_rate_spread_db
acceptance:
  - "All generated detector and gain-reduction values are finite."
  - "Sustained-body active mean GR differs from the current detector by no more than 0.25 dB after equal 3 dB reference calibration."
  - "Candidate extra peak GR on 10 ms and 30 ms transient proxies is no more than +0.25 dB versus the current detector."
  - "Candidate extra peak GR on plosive-like, sibilant-like and breath-noise proxies is no more than +0.50 dB versus the current detector."
  - "On the body-plus-transient case, candidate peak GR remains at least 50 percent of the current detector peak GR so the detector has not collapsed into body-only behavior."
  - "Candidate peak-GR sample-rate spread across 44.1/48/96/192 kHz is no more than 0.10 dB."
rejection:
  - "Any numeric trajectory is non-finite."
  - "Sustained-body active mean GR differs by more than 0.25 dB after equal reference calibration."
  - "Candidate adds more than 0.25 dB peak GR on either short-transient proxy."
  - "Candidate adds more than 0.50 dB peak GR on a problem-event proxy."
  - "Candidate body-plus-transient peak GR falls below 50 percent of the current detector."
  - "Candidate peak-GR sample-rate spread exceeds 0.10 dB."
max_runs: 1
timeout_minutes: 3
random_seed: 20260926
reproduction_conditions:
  current_product_repository: techitechi0331-svg/VocalPrepComp
  current_product_commit: cc796d30d7e1885e0ca66caaf7f1b02d0bffeb33
  source_research_repository: techitechi0331-svg/Vo.Prep
  source_research_reference: research/integrated-vocal-compressor-core
  sample_rates_hz:
    - 44100
    - 48000
    - 96000
    - 192000
  common_sidechain_hpf_hz: 80
  common_rms_tau_ms: 25
  common_ratio: 2.7
  common_knee_db: 12
  common_calibration_gr_db: 3
  common_max_gr_db: 6
  common_attack_ms: 20
  common_release_ms: 110
  baseline_peak_rms: "35/65 amplitude blend"
  candidate_fusion: "max(RMS, Peak - 6 dB)"
  execution_mode: deterministic_synthetic_screen
  network_required: false
  raw_audio_required: false
experiment_adapter: vopripro_detector_transfer_screen_v1
allowed_operations:
  - deterministic_synthetic_generation
  - detector_simulation
  - gain_reduction_measurement
  - csv_json_markdown_output
prohibited_operations:
  - arbitrary_shell
  - network_read
  - network_write
  - raw_audio_persist
  - product_repo_write
  - main_push
  - confidence_change
  - current_stage_change
  - product_release
knowledge_candidate:
  claim: "A Vo.Prep-derived Slow-RMS/Fast-Peak fusion is eligible for same-corpus real-vocal VoPriPro comparison only if it preserves body control without increasing short-transient or problem-event gain reduction under the fixed synthetic screen."
  evidence_type: HYPOTHESIS
  scope: "Synthetic detector-transfer eligibility screen only; no perceptual superiority or product-integration claim."
  promotion_requested: HYPOTHESIS
rejection_record:
  reason: "If any predeclared detector-transfer gate fails, retain the failed case metrics and reject this transfer formulation for VoPriPro until a materially different detector formulation is proposed."
  retained_findings:
    - "Preserve all per-case baseline/candidate GR measurements and the exact common compressor conditions."
    - "Preserve which transient/event/sample-rate gate caused rejection."
  reusable_findings:
    - "Detector transfers should be calibrated to the same sustained-body operating point before transient/event comparison."
    - "A more complex detector must be screened against problem-event proxies before real-vocal product experiments."
  revisit_if:
    - "A materially different fusion rule or peak allowance is proposed with a new predeclared job."
    - "New evidence shows this synthetic matrix is missing a critical detector failure mode."
  scope: "VoPriPro detector transfer v1 only."
review_policy:
  required_human_gates:
    - "Level-matched real-vocal listening is mandatory before product adoption."
    - "Cubase Pro 14 target-host validation remains mandatory for release."
lineage:
  supersedes: []
  related_jobs: []
  related_decisions: []
