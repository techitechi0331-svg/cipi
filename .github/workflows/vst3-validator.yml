name: vst3-official-validator

on:
  workflow_run:
    workflows: ["build-windows-vst3"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - name: Download VST3 artifacts from build run
        uses: actions/download-artifact@v4
        with:
          name: CIPI-Windows-VST3
          path: vst3-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch pinned Steinberg VST3 SDK 3.8.1
        shell: pwsh
        run: |
          git clone https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C vst3sdk submodule update --init --recursive

      - name: Configure official validator
        shell: pwsh
        run: |
          cmake -S vst3sdk -B vst3sdk-build -G "Visual Studio 18 2026" -A x64 -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build official validator
        shell: pwsh
        run: cmake --build vst3sdk-build --config Release --target validator --parallel 4

      - name: Run official VST3 validator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path validator-logs | Out-Null
          $validator = Get-ChildItem -Path vst3sdk-build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) {
            throw "validator.exe was not produced."
          }

          $bundles = Get-ChildItem -Path vst3-artifacts -Recurse -Directory -Filter *.vst3
          if (-not $bundles) {
            throw "No VST3 bundles were downloaded."
          }

          foreach ($bundle in $bundles) {
            $safeName = [IO.Path]::GetFileNameWithoutExtension($bundle.Name)
            $log = Join-Path validator-logs "$safeName.log"
            Write-Host "Steinberg validator: $($bundle.FullName)"
            & $validator.FullName $bundle.FullName 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) {
              throw "Steinberg validator failed for $($bundle.Name) with exit code $LASTEXITCODE."
            }
          }

      - name: Upload validator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CIPI-Steinberg-validator-logs
          path: validator-logs
          if-no-files-found: ignore
