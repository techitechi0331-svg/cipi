name: juce-factory

on:
  pull_request:
    paths:
      - "juce_factory/**"
      - ".github/workflows/juce-factory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: juce-factory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-and-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Contract and generator tests
        run: python -m unittest discover -s juce_factory/tests -v

      - name: CLI self-test
        run: python -m juce_factory.factory.cli self-test

      - name: Validate Golden Contract
        run: python -m juce_factory.factory.cli validate juce_factory/examples/golden_gain.contract.json

  golden-vst3-windows:
    needs: contract-and-generator
    runs-on: windows-2025-vs2026
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Generate Golden Plugin
        shell: pwsh
        run: |
          python -m juce_factory.factory.cli generate juce_factory/examples/golden_gain.contract.json --output generated/GoldenGain
          if ($LASTEXITCODE -ne 0) { throw "Factory generation failed." }

      - name: Configure
        id: configure
        shell: pwsh
        run: cmake -S generated/GoldenGain -B generated/GoldenGain/build -G "Visual Studio 18 2026" -A x64

      - name: Build Release
        id: build
        shell: pwsh
        run: cmake --build generated/GoldenGain/build --config Release --parallel 4

      - name: Run Factory-owned DSP and state validation matrix
        id: factory_validation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-logs | Out-Null
          $testExe = Get-ChildItem -Path generated/GoldenGain/build -Recurse -File -Filter *FactoryValidation.exe | Select-Object -First 1
          if (-not $testExe) { throw "Factory validation executable was not produced." }
          & $testExe.FullName 2>&1 | Tee-Object -FilePath factory-logs/factory-validation.log
          if ($LASTEXITCODE -ne 0) { throw "Factory validation matrix failed with exit code $LASTEXITCODE." }

      - name: Stage VST3
        id: stage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-staging | Out-Null
          $bundle = Get-ChildItem -Path generated/GoldenGain/build -Recurse -Directory -Filter *.vst3 | Select-Object -First 1
          if (-not $bundle) { throw "Golden VST3 bundle was not produced." }
          Copy-Item -LiteralPath $bundle.FullName -Destination factory-staging -Recurse -Force

      - name: Download pinned pluginval
        shell: pwsh
        run: |
          $url = "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip"
          $expected = "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab"
          Invoke-WebRequest -Uri $url -OutFile pluginval.zip
          $actual = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "pluginval checksum mismatch. Expected $expected, got $actual." }
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force

      - name: Validate with external pluginval
        id: pluginval
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-logs | Out-Null
          $pluginval = Get-ChildItem -Path pluginval -Recurse -File -Filter pluginval.exe | Select-Object -First 1
          if (-not $pluginval) { throw "pluginval.exe was not found." }
          $bundle = Get-ChildItem -Path factory-staging -Directory -Filter *.vst3 | Select-Object -First 1
          if (-not $bundle) { throw "No staged VST3 found." }
          & $pluginval.FullName --validate $bundle.FullName --strictness-level 5 2>&1 | Tee-Object -FilePath factory-logs/pluginval.log
          if ($LASTEXITCODE -ne 0) { throw "pluginval failed with exit code $LASTEXITCODE." }

      - name: Fetch pinned Steinberg VST3 SDK 3.8.1
        id: steinberg_fetch
        shell: pwsh
        run: |
          git clone https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C vst3sdk submodule update --init --recursive

      - name: Configure Steinberg official validator
        id: steinberg_configure
        shell: pwsh
        run: |
          cmake -S vst3sdk -B vst3sdk-build -G "Visual Studio 18 2026" -A x64 -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF -DSMTG_CREATE_PLUGIN_LINK=0

      - name: Build Steinberg official validator
        id: steinberg_build
        shell: pwsh
        run: cmake --build vst3sdk-build --config Release --target validator --parallel 4

      - name: Validate with Steinberg official validator
        id: steinberg_validator
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-logs | Out-Null
          $validator = Get-ChildItem -Path vst3sdk-build -Recurse -File -Filter validator.exe | Select-Object -First 1
          if (-not $validator) { throw "Steinberg validator.exe was not produced." }
          $bundle = Get-ChildItem -Path factory-staging -Directory -Filter *.vst3 | Select-Object -First 1
          if (-not $bundle) { throw "No staged VST3 found for Steinberg validator." }
          & $validator.FullName $bundle.FullName 2>&1 | Tee-Object -FilePath factory-logs/steinberg-validator.log
          if ($LASTEXITCODE -ne 0) { throw "Steinberg validator failed with exit code $LASTEXITCODE." }

      - name: Write Factory validation report
        shell: pwsh
        run: |
          $manifest = Get-Content generated/GoldenGain/factory_manifest.json -Raw | ConvertFrom-Json
          $report = [ordered]@{
            factory_status = "VALIDATION_PASS"
            sample_rates = @($manifest.validation_matrix.sample_rates)
            block_sizes = @($manifest.validation_matrix.block_sizes)
            factory_owned_validation = "PASS"
            pluginval = "PASS"
            pluginval_version = "1.0.4"
            pluginval_strictness = 5
            steinberg_validator = "PASS"
            steinberg_sdk_commit = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96"
            release_authority = $false
          }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 factory-logs/validation_report.json

      - name: Promote validation-passed artifact and write provenance
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-out/passed | Out-Null
          $bundle = Get-ChildItem -Path factory-staging -Directory -Filter *.vst3 | Select-Object -First 1
          Copy-Item -LiteralPath $bundle.FullName -Destination factory-out/passed -Recurse -Force
          Copy-Item generated/GoldenGain/factory_manifest.json factory-out/factory_manifest.json
          Copy-Item generated/GoldenGain/plugin_contract.json factory-out/plugin_contract.json
          Copy-Item factory-logs/validation_report.json factory-out/validation_report.json

          $contractHash = (Get-FileHash generated/GoldenGain/plugin_contract.json -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content generated/GoldenGain/factory_manifest.json -Raw | ConvertFrom-Json
          $provenance = [ordered]@{
            factory_status = "VALIDATION_PASS"
            git_sha = "${{ github.sha }}"
            juce_version = "9.0.2"
            build_type = "Release"
            platform = "windows-x64"
            validators = @("factory-owned-matrix", "pluginval-1.0.4-strictness-5", "steinberg-vst3-validator")
            contract_file_sha256 = $contractHash
            contract_semantic_sha256 = $manifest.contract_sha256
            validation_matrix = $manifest.validation_matrix
            release_authority = $false
          }
          $provenance | ConvertTo-Json | Set-Content -Encoding utf8 factory-out/provenance.json

          Get-ChildItem factory-out/passed -Recurse -File | Sort-Object FullName | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.FullName.Substring((Resolve-Path factory-out).Path.Length + 1))"
          } | Set-Content -Encoding ascii factory-out/sha256.txt

      - name: Quarantine failed Factory candidate
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path factory-quarantine | Out-Null

          $failureClass = "UNKNOWN_FACTORY_FAILURE"
          if ("${{ steps.configure.outcome }}" -eq "failure") { $failureClass = "CONFIGURE_ERROR" }
          elseif ("${{ steps.build.outcome }}" -eq "failure") { $failureClass = "BUILD_ERROR" }
          elseif ("${{ steps.factory_validation.outcome }}" -eq "failure") { $failureClass = "FACTORY_DSP_VALIDATION_ERROR" }
          elseif ("${{ steps.stage.outcome }}" -eq "failure") { $failureClass = "PACKAGING_ERROR" }
          elseif ("${{ steps.pluginval.outcome }}" -eq "failure") { $failureClass = "PLUGINVAL_ERROR" }
          elseif ("${{ steps.steinberg_fetch.outcome }}" -eq "failure") { $failureClass = "STEINBERG_FETCH_ERROR" }
          elseif ("${{ steps.steinberg_configure.outcome }}" -eq "failure") { $failureClass = "STEINBERG_CONFIGURE_ERROR" }
          elseif ("${{ steps.steinberg_build.outcome }}" -eq "failure") { $failureClass = "STEINBERG_BUILD_ERROR" }
          elseif ("${{ steps.steinberg_validator.outcome }}" -eq "failure") { $failureClass = "STEINBERG_VALIDATOR_ERROR" }

          $status = [ordered]@{
            factory_status = "QUARANTINED"
            failure_class = $failureClass
            git_sha = "${{ github.sha }}"
            release_authority = $false
          }
          $status | ConvertTo-Json | Set-Content -Encoding utf8 factory-quarantine/failure.json

          if (Test-Path generated/GoldenGain/factory_manifest.json) {
            Copy-Item generated/GoldenGain/factory_manifest.json factory-quarantine/factory_manifest.json
          }
          if (Test-Path generated/GoldenGain/plugin_contract.json) {
            Copy-Item generated/GoldenGain/plugin_contract.json factory-quarantine/plugin_contract.json
          }
          if (Test-Path factory-logs) {
            Copy-Item factory-logs factory-quarantine/logs -Recurse -Force
          }

      - name: Upload quarantined Factory candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JUCE-Factory-Golden-QUARANTINE
          path: factory-quarantine
          if-no-files-found: error

      - name: Upload Factory logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUCE-Factory-Golden-logs
          path: factory-logs
          if-no-files-found: ignore

      - name: Upload validation-passed Factory artifact
        uses: actions/upload-artifact@v4
        with:
          name: JUCE-Factory-Golden-VST3
          path: factory-out
          if-no-files-found: error
