research_question: Is Vo.Prep event-only processing (Plosive 50% + Sibilance 50%,
  Macro Level OFF) compatible with VoPriPro Natural50 across source-derived positive
  controls, neutral material, phrase steps, and sample rates without material double-processing?
hypothesis: Event-only Vo.Prep will perform localized Plosive/Sibilance cleanup, remain
  near-neutral on neutral/phrase material, preserve VoPriPro recovery, and avoid the
  Macro-driven post-event residual observed in integration v2.
counter_hypotheses:
- Event-only processing still creates material post-event VoPriPro GR shifts.
- Plosive cleanup materially changes downstream VoPriPro peak GR despite the 80 Hz
  sidechain HPF.
- Sibilance processing no longer reduces downstream VoPriPro event GR when Macro is
  disabled.
- Event modules false-trigger on neutral or phrase-step material.
- Event-only compatibility is materially sample-rate dependent.
acceptance_criteria:
- All generated samples and downstream gain-reduction trajectories are finite.
- Macro Level remains effectively unity with Amount 0%.
- Neutral mean VoPriPro GR shift is no more than 0.10 dB.
- Neutral false Plosive/Sibilance reduction is no more than 0.10 dB.
- Plosive positive-control probability reaches at least 0.80 at every tested sample
  rate.
- Plosive reduction reaches at least 0.50 dB at every tested sample rate.
- Plosive event RMS attenuation is at least 0.25 dB at every tested sample rate.
- Plosive absolute downstream VoPriPro event peak-GR change is no more than 0.10 dB.
- Plosive absolute post-event VoPriPro mean-GR shift is no more than 0.15 dB.
- Sibilance positive-control probability reaches at least 0.65 at every tested sample
  rate.
- Sibilance reduction reaches at least 0.30 dB at every tested sample rate.
- Sibilance event RMS attenuation is at least 0.10 dB at every tested sample rate.
- Sibilance preprocessing improves downstream VoPriPro event peak GR by at least 0.02
  dB.
- Sibilance absolute post-event VoPriPro mean-GR shift is no more than 0.15 dB.
- Phrase-step material causes no more than 0.10 dB false event reduction.
- Event-only preprocessing changes phrase RMS spread by no more than 0.10 dB.
- Preprocessed downstream peak-GR sample-rate spread across 44.1/48/88.2/96 kHz is
  no more than 0.15 dB.
rejection_criteria:
- Any event-localization, neutrality, recovery, finite-state, phrase, or sample-rate
  gate fails.
