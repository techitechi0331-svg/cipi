research_question: Can YIN-CMND confidence or MPM-NSDF clarity provide a bounded realtime-oriented
  periodicity signal for PeakBody that protects clean/bright/noisy voiced material
  while rejecting sibilant/breath-like noise at acceptable model complexity?
hypothesis: At least one established candidate periodicity family will satisfy the
  predeclared voiced/noise confidence separation gates with an operation proxy no
  more than 2.5 times the current normalized-autocorrelation baseline.
counter_hypotheses:
- YIN or MPM will lose confidence on bright high-register harmonic material.
- Noise-like sibilance or breath will produce excessive candidate confidence.
- A candidate will protect voiced material but require disproportionate pairwise computation.
- The current normalized-autocorrelation baseline will remain the safest simple mechanism.
acceptance_criteria:
- at least one of YIN-CMND or MPM-NSDF satisfies every hard gate
- clean voiced confidence minimum is at least 0.75
- bright-high confidence minimum is at least 0.75
- 6 dB SNR noisy-voiced confidence is at least 0.55
- sibilant/breath-like confidence maximum is no more than 0.35
- silence confidence is no more than 0.05
- bright-vs-noise confidence margin is at least 0.45
- candidate pair-operation proxy is no more than 2.5 times normalized-autocorrelation
  baseline
- all outputs are finite
rejection_criteria:
- neither candidate satisfies all predeclared confidence/safety/complexity gates
